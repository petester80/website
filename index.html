     landed on the button, the release landed on the stage, and the click in
     between was retargeted to the one ancestor they shared: no close button
     anywhere was ever clickable, nor the veil behind it. */
  const OVER_STAGE = '.panel, .ui-toggle, .rmenu, .burger, .drawer,'
    + ' .sheet, .sheet-veil, .zoomer, .hovercap';

  const onPointerDown = (e) => {
    if (e.target.closest(OVER_STAGE)) return;
    /* the gateway answers a press with a ring; the drifting field has no such
       call, so this asks rather than assumes */
    const eng = flowRef.current;
    if (eng && eng.tap && worldRef.current) {
      const r = worldRef.current.getBoundingClientRect();
      eng.tap(e.clientX - r.left, e.clientY - r.top);
    }
    glide.current = null;
    drag.current.active = true;
    drag.current.lastX = e.clientX;
    drag.current.lastY = e.clientY;
    drag.current.downX = e.clientX;
    drag.current.downY = e.clientY;
    drag.current.downT = performance.now();
    drag.current.vel = 0;
    worldRef.current.classList.add('dragging');
    e.currentTarget.setPointerCapture(e.pointerId);
  };
  const onPointerMove = (e) => {
    const eng = flowRef.current;
    const rip = rippleRef.current;
    if (eng || rip) {
      const r = worldRef.current.getBoundingClientRect();
      const lx = e.clientX - r.left;
      const ly = e.clientY - r.top;
      if (eng) eng.pointer(lx, ly, true);
      if (rip) rip.pointer(lx, ly);
    }
    if (!drag.current.active) {
      /* Only when the river is still: a hand that is pushing the cards along
         is not reaching for one of them, and a caption appearing under a drag
         reads as the page arguing with you. */
      if (openRef.current) return;
      const i = cardUnder(e.clientX, e.clientY);
      const w = i >= 0 ? workFor((deck[i] || {}).id) : null;
      const at = w ? i : -1;
      if (at !== hoverRef.current) {
        hoverRef.current = at;
        setHoverWork(w || null);
        if (worldRef.current) worldRef.current.classList.toggle('canopen', at >= 0);
      }
      return;
    }
    const dx = e.clientX - drag.current.lastX;
    const dy = e.clientY - drag.current.lastY;
    drag.current.lastX = e.clientX;
    drag.current.lastY = e.clientY;
    const ax = riverAxis();
    const along = dx * ax.x + dy * ax.y;
    const d = along / (dims.current.slot || 1);
    progress.current += d;
    drag.current.vel = d * 14;
  };
  const endDrag = () => {
    if (!drag.current.active) return;
    drag.current.active = false;
    worldRef.current.classList.remove('dragging');
  };

  /* A press that stayed in one place and did not last is a click on whatever
     was under it. Both tests are needed: a slow press that never moved is
     someone deciding, and a fast flick that moved is a scrub. */
  const onPointerUp = (e) => {
    const d = drag.current;
    const moved = Math.hypot(e.clientX - (d.downX || 0), e.clientY - (d.downY || 0));
    const held = performance.now() - (d.downT || 0);
    endDrag();
    if (openRef.current) return;
    if (moved > 7 || held > 500) return;
    if (e.target && e.target.closest && e.target.closest(OVER_STAGE)) return;
    const i = cardUnder(e.clientX, e.clientY);
    if (i < 0) return;
    const item = deck[i];
    const work = workFor(item && item.id);
    if (work) openCard(i, work);
  };

  useEffect(() => {
    const el = worldRef.current;
    const onWheel = (e) => {
      /* The editor sits inside the world, so a scroll meant for one of its
         lists arrives here too. Without this it did both of the wrong things
         at once: scrubbed the river, and -- through the preventDefault just
         below -- stopped the list under the pointer from scrolling at all. */
      if (e.target && e.target.closest && e.target.closest('.panel, .ui-toggle')) return;
      e.preventDefault();
      glide.current = null;           // scrolling takes over from a menu jump
      /* And from the hold: a hand on the wheel is driving the river, not
         reaching into it. The next time the pointer actually moves, whatever
         is under it takes hold again. */
      if (hoverRef.current !== -1) {
        hoverRef.current = -1;
        setHoverWork(null);
        if (worldRef.current) worldRef.current.classList.remove('canopen');
      }
      /* A sideways swipe follows the roll like a drag does. A downward one
         always drives the river, whatever the roll, because that is what a
         hand expects of a wheel.

         The test used to be whether there was any sideways movement at all,
         over half a unit. Trackpads never send a perfectly straight swipe and
         nor do many mice, so a scroll down with the least drift took the
         projection -- and at a quarter turn the river axis is sideways, so
         the projection threw the downward part away and kept the drift.
         Scrolling did nothing, on exactly the rolled rig this page uses, and
         no test sending a clean deltaY could ever see it. */
      /* A wheel does not have to report in pixels. Firefox and a good many
         drivers report in lines, where a notch is 3 rather than 120, and one
         browser in page units. Taken raw, a line-mode notch moved the river
         by six thousandths of a card -- which is not slow, it is nothing, and
         every wheel this was tested with happened to speak pixels. */
      const unit = e.deltaMode === 1 ? 16
        : e.deltaMode === 2 ? (worldRef.current ? worldRef.current.clientHeight : 800)
        : 1;
      const dX = e.deltaX * unit;
      const dY = e.deltaY * unit;

      const ax = riverAxis();
      const sideways = Math.abs(dX) > Math.abs(dY) * 1.5;
      const along = sideways ? dX * ax.x + dY * ax.y : dY;
      const d = along / WHEEL_PER_CARD;
      /* Part of a notch lands now and the rest is handed to the momentum a
         drag already uses, because a wheel arrives in lumps at uneven times:
         moving the river the whole way on each one made the step between
         frames swing from nothing to half a card, and stopping scrolling
         stopped the river dead, where letting go of a drag lets it run on.
         A notch still carries the river exactly as far as it did -- 0.45 of
         it at once, and 0.55 spread over the decay, which integrates to the
         same distance. */
      progress.current += d * WHEEL_NOW;
      drag.current.vel += d * (1 - WHEEL_NOW) * WHEEL_CARRY;
    };
    el.addEventListener('wheel', onWheel, { passive: false });
    const onKey = (e) => {
      // never steal a keystroke that belongs to a field -- typing a name with
      // a "c" in it used to close the panel mid-edit
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'c' || e.key === 'C') setShowUI((s) => !s);
    };
    window.addEventListener('keydown', onKey);
    return () => {
      el.removeEventListener('wheel', onWheel);
      window.removeEventListener('keydown', onKey);
    };
  }, []);

  const set = (key) => (e) => {
    const v = parseFloat(e.target.value);
    setParams((p) => {
      const next = { ...p, [key]: v };
      writeStop({ params: next });        // straight into the selected size
      return next;
    });
    setPreset(null);                      // sliders put you in custom territory
  };
  const applyPreset = (name) => {
    const custom = userPresetsRef.current.find((p) => p.name === name);
    const next = PRESETS[name] || (custom && custom.params);
    if (!next) return;
    setPreset(name);
    setPresetMsg('');
    // fill from DEFAULTS so a preset saved before a slider existed still loads
    setParams({ ...DEFAULTS, ...next });
  };

  // breakpoints: snapshots of the settings, keyed by the window width they
  // take effect from. Authored by hand rather than left to the browser.
  const [bps, setBps] = useState([]);
  /* Which size the panel is writing to -- or all of them at once. Editing
     every size is a target you select, not a value you set somewhere and
     then push outward: you move the slider and watch it land everywhere. */
  const [allSizes, setAllSizesState] = useState(false);
  const allSizesRef = useRef(false);
  const setAllSizes = (v) => { allSizesRef.current = v; setAllSizesState(v); };
  const [activeBp, setActiveBpState] = useState(null);
  const [newW, setNewW] = useState('');
  const setActiveBp = (v) => { activeBpRef.current = v; setActiveBpState(v); };
  const [winW, setWinW] = useState(() => (typeof window === 'undefined' ? 0 : window.innerWidth));
  const bpsRef = useRef(bps);
  bpsRef.current = bps;
  const appliedBp = useRef(undefined);
  const bpCheck = useRef(null);
  const lastW = useRef(-1);
  const activeBpRef = useRef(null);
  const stopTimer = useRef(0);
  const [fluid, setFluid] = useState(true);
  const fluidRef = useRef(fluid);
  fluidRef.current = fluid;

  const persistBps = useCallback(async (list) => {
    const db = capsRef.current.db;
    if (!db) return;
    try {
      await db.doc('deck/breakpoints').set({ items: list, fluid: !!fluidRef.current });
    } catch (e) { /* read-only */ }
  }, []);

  // Switch settings as the stage crosses a breakpoint. Measured from the
  // stage itself rather than window.innerWidth, so it is right inside an
  // iframe, an embed, or a device-emulated viewport.
  useEffect(() => {
    const el = worldRef.current;
    if (!el) return undefined;
    const merge = (prev, incoming) => {
      if (!incoming) return prev;
      let changed = false;
      const next = { ...prev };
      Object.keys(incoming).forEach((k) => {
        const v = incoming[k];
        if (typeof v !== 'number') return;
        if (Math.abs((typeof prev[k] === 'number' ? prev[k] : 0) - v) > 1e-4) {
          next[k] = v;
          changed = true;
        }
      });
      return changed ? next : prev;
    };

    const apply = (force) => {
      const w = el.clientWidth;
      if (!w) return;
      setWinW((prev) => (prev === w ? prev : w));
      const list = bpsRef.current;
      if (!list.length) { setActiveBp(null); lastW.current = w; return; }
      // Only speak when the stage actually changes size. Otherwise the blend
      // would rewrite the sliders several times a second and fight anyone
      // dragging one.
      if (!force && w === lastW.current) return;
      lastW.current = w;

      // the stop whose look is actually on screen is the one your edits go into
      const r = resolveAt(list, w, fluidRef.current);
      if (!r) return;
      setActiveBp(r.at);
      setParams((prev) => merge(prev, r.params));
      setBg((prev) => applyBgSnapshot(prev, r.bg));
      if (r.layers) {
        // through the ref, because the next resolve reads from it and a
        // setState would not have landed by then
        const nl = applyLayerSnapshot(layersRef.current, r.layers);
        if (nl !== layersRef.current) { layersRef.current = nl; setLayers(nl); }
      }
    };
    apply(false);
    bpCheck.current = apply;
    // Listeners hand their callback an event or an entry list. Passing that
    // straight to apply() made every one of them a FORCED re-resolve, which
    // overwrote whatever had just been changed -- so they get a wrapper that
    // always asks politely.
    const onResize = () => apply(false);
    // Three ways in, because none is reliable everywhere: the observer, the
    // window event, and a poll from the animation loop for hosts that
    // suspend the first two (a backgrounded or embedded page).
    const ro = new ResizeObserver(onResize);
    ro.observe(el);
    window.addEventListener('resize', onResize);
    return () => {
      ro.disconnect();
      window.removeEventListener('resize', onResize);
      bpCheck.current = null;
    };
    // Deliberately not keyed on `bps`: that changes on every slider tick, and
    // the teardown rebuilt the observer, which fires again on observe().
  }, [fluid]);

  /* The stops arrive from storage after the first paint, so the width has to
     be resolved again once they are here -- but not until everything else has
     landed. The sliders saved in `deck/state` are read last, and they are
     whatever width the piece was last edited at; resolving before them let
     those stale numbers win, and nothing re-resolved afterwards because the
     window had not changed size. The piece then opened in the wrong rig until
     it was nudged. */
  const stopsArrived = useRef(false);
  useEffect(() => {
    if (stopsArrived.current || !hydrated || !bps.length) return;
    stopsArrived.current = true;
    if (bpCheck.current) bpCheck.current(true);
  }, [bps, hydrated]);

  /* The sizes and the pictures are two documents and they do not arrive
     together. Whichever is second, the resolve that placed the pictures ran
     against an empty list and did nothing, so it has to run once more. */
  const layersArrived = useRef(false);
  useEffect(() => {
    if (layersArrived.current || !hydrated || !layers.length || !bps.length) return;
    layersArrived.current = true;
    if (bpCheck.current) bpCheck.current(true);
  }, [layers, bps, hydrated]);

  const bgSnap = (b) => bgOutOf(b);

  /* Edits land in the selected stop straight away -- there is no separate
     save step, and nothing you change can quietly revert. */
  /* `only` names the backdrop fields the edit actually touched. One size
     takes the whole snapshot, as before. Every size takes just those fields
     merged into what it already had -- otherwise moving the dim would write
     this width's framing over all the others, and 300% at 500px would
     become 127% everywhere. */
  writeStopRef.current = (patch, only, everySize) => {
    /* Normally this follows the size picker: one size, or all of them when
       All sizes is chosen. `everySize` is for the buttons that say so
       outright, which is the only way to push a setting you have already
       tuned onto the rest without going back and touching every control
       again with All sizes selected. */
    const all = everySize || allSizesRef.current;
    const w = activeBpRef.current;
    if (!all && (w === null || w === undefined)) return;
    const list = bpsRef.current.map((st) => {
      if (!all) return st.w === w ? { ...st, ...patch } : st;
      if (!patch.bg || !only) return { ...st, ...patch };
      const bgNext = { ...(st.bg || bgOutOf(DEFAULT_BG)) };
      only.forEach((k) => { bgNext[k] = patch.bg[k]; });
      return { ...st, bg: bgNext };
    });
    bpsRef.current = list;
    setBps(list);
    clearTimeout(stopTimer.current);
    stopTimer.current = setTimeout(() => persistBps(bpsRef.current), 350);
  };

  /* Every field that belongs to the animated field, and to the ripple. The
     buttons send exactly these and nothing else, so a size keeps its own
     framing, its own dim and its own picture. */
  const FLOW_SPREAD = ['flow', 'flowKind', 'flowOpacity', 'flowCount',
    'flowSpeed', 'flowPull', 'calm', 'mid', 'hot'];
  const RIPPLE_SPREAD = ['ripple', 'rippleAmp', 'rippleFreq', 'rippleSpeed'];
  const spreadToAll = (keys, where, what) => {
    const n = bpsRef.current.length;
    if (!n) return;
    writeStop({ bg: bgSnap(bgRef.current) }, keys, true);
    clearTimeout(spreadTimer.current);
    setSpread({ where, text: `${what} now on all ${n} size${n === 1 ? '' : 's'}` });
    spreadTimer.current = setTimeout(() => setSpread(null), 2800);
  };

  const addStop = (width) => {
    const w = Math.max(0, Math.round(width));
    if (!isFinite(w)) return;
    const entry = { w, params: { ...P.current }, bg: bgSnap(bgRef.current),
      layers: layerSnap(layersRef.current) };
    const list = bpsRef.current.filter((s) => s.w !== w).concat([entry]).sort((a, b) => a.w - b.w);
    if (worldRef.current) lastW.current = worldRef.current.clientWidth;
    setBps(list);
    setActiveBp(w);
    persistBps(list);
  };

  const deleteStop = (w) => {
    const list = bpsRef.current.filter((s) => s.w !== w);
    lastW.current = -1;             // let the next resize re-resolve
    setBps(list);
    setActiveBp(list.length ? nearestStop(list, winW).w : null);
    persistBps(list);
  };

  /* Back to the built-in look at this width, without losing the size itself.
     Deleting and re-adding was the only way before, and that re-captured
     whatever happened to be on screen rather than clearing anything. */
  const resetStop = (w) => {
    const list = bpsRef.current.map((s) => (s.w === w
      ? { w, params: { ...DEFAULTS }, bg: bgSnap(DEFAULT_BG) }
      : s));
    setBps(list);
    persistBps(list);
    // show the size that was just reset, rather than snapping back to whatever
    // this window width resolves to: you should see what the button did
    setActiveBp(w);
    setParams((prev) => ({ ...prev, ...DEFAULTS }));
    setBg(DEFAULT_BG);
    persistBg(DEFAULT_BG);
    if (worldRef.current) lastW.current = worldRef.current.clientWidth;
  };

  /* Picking a width leaves the all-sizes mode; picking "all" enters it. */
  const pickSize = (v) => {
    if (v === 'all') { setAllSizes(true); return; }
    setAllSizes(false);
    goToStop(v);
  };

  const resetAllStops = () => {
    const list = bpsRef.current.map((st) => ({
      w: st.w, params: { ...DEFAULTS }, bg: bgSnap(DEFAULT_BG),
    }));
    bpsRef.current = list;
    setBps(list);
    persistBps(list);
    setParams((prev) => ({ ...prev, ...DEFAULTS }));
    setBg(DEFAULT_BG);
    persistBg(DEFAULT_BG);
    lastW.current = -1;
  };

  const goToStop = (w) => {
    const s = bpsRef.current.find((x) => x.w === w);
    if (!s) return;
    setActiveBp(w);
    if (worldRef.current) lastW.current = worldRef.current.clientWidth;
    if (s.params) setParams((prev) => ({ ...prev, ...s.params }));
    if (s.bg) setBg((prev) => applyBgSnapshot(prev, s.bg));
  };

  const persistPresets = useCallback(async (list) => {
    const db = capsRef.current.db;
    if (!db) return;
    try { await db.doc('deck/presets').set({ items: list }); } catch (e) { /* read-only */ }
  }, []);

  const savePreset = () => {
    const name = presetName.trim().slice(0, 28);
    if (!name) return;
    if (PRESETS[name]) { setPresetMsg('That name belongs to a built-in'); return; }
    const list = userPresetsRef.current
      .filter((p) => p.name !== name)
      .concat([{ name, params: { ...P.current } }]);
    setUserPresets(list);
    setPreset(name);
    setPresetName('');
    setPresetMsg(`Saved \u201c${name}\u201d`);
    persistPresets(list);
  };

  const deletePreset = () => {
    const list = userPresetsRef.current.filter((p) => p.name !== preset);
    setUserPresets(list);
    persistPresets(list);
    applyPreset(OPENING);
  };

  const isCustom = !PRESETS[preset] && userPresets.some((p) => p.name === preset);

  const [exportMsg, setExportMsg] = useState('');
  const [exportText, setExportText] = useState('');
  const [embed, setEmbed] = useState(true);
  const [hasExport, setHasExport] = useState(false);
  const [held, setHeld] = useState(false);   // too large to put in the textarea
  const [wipeArmed, setWipeArmed] = useState(false);   // Start over asks first
  const exportRef = useRef('');

  // Above this the JSON is handed over as a file only -- a multi-megabyte
  // string in a textarea locks the browser up.
  const DISPLAY_CAP = 400000;

  const dataUrlFrom = async (src) => {
    if (!src) throw new Error('no source');
    const res = await fetch(src);
    // fetch resolves happily on a 404, and an error page saved as a picture
    // is worse than an honest gap -- it exports bytes that will never decode
    if (!res.ok) throw new Error(`fetch failed: ${res.status}`);
    const blob = await res.blob();
    if (!/^(image|video)\//.test(blob.type)) throw new Error(`not media: ${blob.type}`);
    return await new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.onerror = () => reject(fr.error);
      fr.readAsDataURL(blob);
    });
  };

  const blobFromDataUrl = async (url) => (await fetch(url)).blob();

  // Getting a file out of the page, best route first. The artifact only has
  // the host capability; running off disk there is a Save dialog and, failing
  // that, an ordinary download link.
  const saveText = async (filename, text) => {
    const dl = capsRef.current.downloads;
    if (dl) {
      try {
        const r = await dl.save({ filename, data: text });
        return { how: r && r.status === 'delivered' ? 'delivered' : 'host' };
      } catch (err) {
        if (err && err.code === 'declined') return { how: 'declined' };
        if (err && err.code) return { how: 'error', code: err.code };
      }
    }
    if (window.showSaveFilePicker) {
      try {
        const h = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
        });
        const w = await h.createWritable();
        await w.write(new Blob([text], { type: 'application/json' }));
        await w.close();
        return { how: 'picker' };
      } catch (e) {
        if (e && e.name === 'AbortError') return { how: 'declined' };
      }
    }
    // a link download is inert inside the artifact frame, so only off disk
    if (window.__localHost || !window.claude) {
      try {
        const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        return { how: 'link' };
      } catch (e) { /* fall through */ }
    }
    return { how: 'none' };
  };

  const prettyBytes = (n) => (n > 1048576
    ? `${(n / 1048576).toFixed(1)}MB`
    : `${Math.max(1, Math.round(n / 1024))}KB`);

  // Everything the page holds, in one file. Cards and the backdrop appear as
  // asset ids rather than bytes -- the images themselves stay in the artifact's
  // store, where they can be fetched by id and matched back to these entries.
  const exportJson = async () => {
    const deckOut = [];
    for (let i = 0; i < deck.length; i++) {
      const it = deck[i];
      const row = { id: it.id || null, name: it.name, kind: it.kind, fh: !!it.fh, fv: !!it.fv };
      if (embed) {
        setExportMsg(`Embedding ${i + 1} of ${deck.length}\u2026`);
        try { row.data = await dataUrlFrom(srcFor(it)); }
        catch (e) { row.missing = true; }
      }
      deckOut.push(row);
    }

    const bgOut = bgOutOf(bg);
    if (embed && bg.kind === 'image' && srcFor(bg)) {
      setExportMsg('Embedding the background\u2026');
      try { bgOut.data = await dataUrlFrom(srcFor(bg)); }
      catch (e) { bgOut.missing = true; }
    }

    // Each size can name its own backdrop. Those pictures travel too, once
    // each however many sizes share them, so a file opened on another machine
    // brings the whole per-size arrangement with it rather than a list of ids
    // pointing at nothing.
    const sizePics = {};
    let lostPics = 0;
    if (embed) {
      const wanted = [];
      bps.forEach((s) => {
        const id = s.bg && s.bg.kind === 'image' ? s.bg.id : null;
        if (id && id !== bg.id && wanted.indexOf(id) < 0) wanted.push(id);
      });
      for (let i = 0; i < wanted.length; i++) {
        setExportMsg(`Embedding size backdrop ${i + 1} of ${wanted.length}\u2026`);
        try { sizePics[wanted[i]] = await dataUrlFrom(srcFor({ id: wanted[i], url: '' })); }
        catch (e) { lostPics += 1; }   // that size travels without its picture
      }
    }

    // stacked pictures carry their own bytes, one row each
    const layerOut = [];
    for (let i = 0; i < layers.length; i++) {
      const l = layers[i];
      const row = {
        id: l.id || null, name: l.name, key: l.key, z: l.z, depth: l.depth,
        x: l.x, y: l.y, size: l.size, rot: l.rot, opacity: l.opacity,
        dim: l.dim, show: !!l.show,
      };
      if (embed && srcFor(l)) {
        setExportMsg(`Embedding stacked picture ${i + 1} of ${layers.length}\u2026`);
        try { row.data = await dataUrlFrom(srcFor(l)); }
        catch (e) { row.missing = true; }
      }
      layerOut.push(row);
    }

    const payload = {
      format: 'card-river/1',
      exportedAt: new Date().toISOString(),
      embedded: !!embed,
      preset: preset || null,
      params,
      background: bgOut,
      deck: deckOut,
      presets: userPresets,
      breakpoints: bps,
      sizeImages: sizePics,
      layers: layerOut,
      headlines: heads.map(headOut),
      menu: menuOut(menu),
      scene: { intro: !!scene.intro, wordScale: scene.wordScale, grain: scene.grain,
        steps: scene.steps },
      sampleArt: deck.length ? null : CLIPS.map((c) => c.name),
    };
    const text = JSON.stringify(payload, null, 2);
    const lost = deckOut.filter((r) => r.missing).length + (bgOut.missing ? 1 : 0)
      + lostPics + layerOut.filter((r) => r.missing).length;
    // always put the text on screen: a download can be declined or refused by
    // the viewer without the page being told anything useful
    const size = prettyBytes(text.length);
    const note = lost ? `, ${lost} image${lost > 1 ? 's' : ''} unreadable` : '';
    const big = text.length > DISPLAY_CAP;

    exportRef.current = text;
    setHasExport(true);
    setHeld(big);
    setExportText(big ? '' : text);
    setExportMsg(`Saving ${size}\u2026`);

    const r = await saveText('card-river.json', text);
    const tail = `${size}${note}`;
    if (r.how === 'host' || r.how === 'picker' || r.how === 'link') {
      setExportMsg(`Saved card-river.json \u2014 ${tail}`);
    } else if (r.how === 'delivered') {
      setExportMsg(`Sent to the destination you picked \u2014 ${tail}`);
    } else if (r.how === 'declined') {
      setExportMsg(`Save cancelled \u2014 ${tail}. Copy is still available.`);
    } else {
      setExportMsg(`No way to write a file here \u2014 ${tail}. Use Copy, `
        + 'or open local.html where a Save dialog is available.');
    }
  };

  // Accepts either shape: what this page exports (presets as a list) or the
  // generated config file (presets keyed by name, built-ins included).
  const importJson = async (text) => {
    let data;
    try { data = JSON.parse(text); } catch (e) { setExportMsg('That is not valid JSON'); return; }
    if (!data || typeof data !== 'object') { setExportMsg('Nothing to import'); return; }
    const done = [];

    let list = null;
    if (Array.isArray(data.presets)) list = data.presets.filter((p) => p && p.name && p.params);
    else if (data.presets && typeof data.presets === 'object') {
      list = Object.keys(data.presets)
        .filter((k) => !PRESETS[k])
        .map((name) => ({ name, params: data.presets[name] }));
    }
    if (list && list.length) {
      setUserPresets(list);
      persistPresets(list);
      done.push(`${list.length} presets`);
    }

    // the page's own export carries live sliders; the generated config file
    // instead names which preset to open on
    const named = data.opening
      && (PRESETS[data.opening]
        || (data.presets && !Array.isArray(data.presets) && data.presets[data.opening])
        || (list || []).reduce((f, p) => (p.name === data.opening ? p.params : f), null));
    if (data.params && typeof data.params === 'object') {
      setParams({ ...DEFAULTS, ...data.params });
      setPreset(data.preset || null);
      done.push('sliders');
    } else if (named) {
      setParams({ ...DEFAULTS, ...named });
      setPreset(data.opening);
      done.push(`preset \u201c${data.opening}\u201d`);
    }

    // Embedded bytes are put back into whatever store this view has; without
    // one they become object URLs so the deck at least appears.
    const restore = async (entry, fallbackName) => {
      let id = entry.id || null;
      let url = '';
      if (entry.data) {
        try {
          const blob = await blobFromDataUrl(entry.data);
          if (capsRef.current.assets) {
            const up = await capsRef.current.assets.upload(
              new File([blob], entry.name || fallbackName, { type: blob.type }));
            id = up.id; url = up.url;
          } else {
            id = null; url = URL.createObjectURL(blob);
          }
        } catch (e) { /* fall back to whatever the id resolves to */ }
      }
      return { id, url: url || srcFor({ id, url: '' }) };
    };

    // Uploading gives every picture a fresh id, so the ids the sizes were
    // saved with have to be translated rather than trusted.
    const idMap = {};
    if (data.sizeImages && typeof data.sizeImages === 'object') {
      const ids = Object.keys(data.sizeImages);
      for (let i = 0; i < ids.length; i++) {
        setExportMsg(`Restoring size backdrop ${i + 1} of ${ids.length}\u2026`);
        const got = await restore({ id: ids[i], data: data.sizeImages[ids[i]] }, 'backdrop');
        idMap[ids[i]] = got;
      }
    }

    if (data.background && data.background.kind) {
      const got = await restore(data.background, 'background');
      if (data.background.id) idMap[data.background.id] = got;
      const b = normaliseBg({ ...data.background, id: got.id, url: got.url });
      setBg(b); persistBg(b); done.push('background');
    }

    if (Array.isArray(data.breakpoints)) {
      const list = data.breakpoints
        .filter((b) => b && typeof b.w === 'number' && b.params)
        .map((b) => {
          const old = b.bg && b.bg.id;
          if (!old || !idMap[old]) return b;
          return { ...b, bg: { ...b.bg, id: idMap[old].id } };
        })
        .sort((a, b) => a.w - b.w);
      appliedBp.current = undefined;
      stopsArrived.current = false;        // let the new set resolve once
      layersArrived.current = false;
      setBps(list);
      persistBps(list);
      if (list.length) done.push(`${list.length} sizes`);
    }

    if (Array.isArray(data.deck)) {
      const items = [];
      for (let i = 0; i < data.deck.length; i++) {
        const it = data.deck[i];
        if (!it) continue;
        if (it.data) setExportMsg(`Restoring ${i + 1} of ${data.deck.length}\u2026`);
        const got = await restore(it, 'card');
        if (!got.url && !got.id) continue;
        items.push({
          id: got.id,
          url: got.url,
          name: it.name || 'card',
          kind: it.kind === 'video' ? 'video' : 'image',
          fh: !!it.fh, fv: !!it.fv,
          key: (got.id || 'local') + ':' + i,
        });
      }
      if (items.length) { setDeck(items); persist(items); done.push(`${items.length} cards`); }
    }

    if (Array.isArray(data.layers)) {
      const list = [];
      for (let i = 0; i < data.layers.length; i++) {
        const l = data.layers[i];
        if (!l) continue;
        if (l.data) setExportMsg(`Restoring stacked picture ${i + 1}\u2026`);
        const got = await restore(l, 'picture');
        if (!got.url && !got.id) continue;      // nothing to show for this one
        list.push(normaliseLayer({ ...l, id: got.id, url: got.url }, i));
      }
      if (list.length) {
        layersRef.current = list;
        setLayers(list);
        persistLayers(list);
        done.push(`${list.length} stacked picture${list.length > 1 ? 's' : ''}`);
      }
    }

    if (Array.isArray(data.headlines) || data.menu || data.scene) {
      const hs = Array.isArray(data.headlines)
        ? data.headlines.slice(0, HEAD_MAX).map(normaliseHead) : headsRef.current;
      const mn = data.menu ? normaliseMenu(data.menu) : menuRef.current;
      const sc = data.scene ? normaliseScene(data.scene) : sceneRef.current;
      headsRef.current = hs;
      menuRef.current = mn;
      sceneRef.current = sc;
      setHeads(hs);
      setMenu(mn);
      setScene(sc);
      persistWords(hs, mn, sc);
      if (Array.isArray(data.headlines) && hs.length) {
        done.push(`${hs.length} message${hs.length > 1 ? 's' : ''}`);
      }
      if (data.menu && mn.items.length) done.push('menu');
    }

    // The deck, the sizes and the sliders all land at once, which on a page
    // already on screen is a jump rather than an arrival. Let the opening
    // cover it -- unless the author has turned the opening off, in which case
    // they have said they do not want one.
    if (done.length && sceneRef.current.intro) playIntro();
    setExportMsg(done.length ? `Imported ${done.join(', ')}` : 'Nothing recognised in that file');
  };

  const copyExport = async () => {
    const text = exportRef.current || exportText;
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      setExportMsg(`Copied ${prettyBytes(text.length)} to the clipboard`);
    } catch (e) {
      setExportMsg('The clipboard refused it \u2014 turn off Embed images and try again');
    }
  };
  /* Back to an empty page. The deck, the backdrop and every size go, and the
     pictures are deleted from the folder rather than left behind as orphans
     nothing points at. Saved presets stay: they are a library, not this
     piece of work. */
  const startOver = async () => {
    const { assets } = capsRef.current;
    setBusy('Clearing\u2026');

    const ids = [];
    const want = (id) => { if (id && ids.indexOf(id) < 0) ids.push(id); };
    deckRef.current.forEach((it) => {
      want(it.id);
      if (it.url && it.url.startsWith('blob:')) URL.revokeObjectURL(it.url);
    });
    want(bgRef.current.id);
    if (bgRef.current.url && bgRef.current.url.startsWith('blob:')) {
      URL.revokeObjectURL(bgRef.current.url);
    }
    bpsRef.current.forEach((s) => want(s.bg && s.bg.id));
    layersRef.current.forEach((l) => {
      want(l.id);
      if (l.url && l.url.startsWith('blob:')) URL.revokeObjectURL(l.url);
    });

    if (assets) {
      for (let i = 0; i < ids.length; i++) {
        try { await assets.delete(ids[i]); } catch (e) { /* already gone */ }
      }
    }

    setDeck([]);
    persist([]);
    setBg(DEFAULT_BG);
    persistBg(DEFAULT_BG);
    bpsRef.current = [];
    setBps([]);
    setActiveBp(null);
    lastW.current = -1;              // nothing to resolve against any more
    stopsArrived.current = false;
    layersArrived.current = false;
    appliedBp.current = undefined;
    persistBps([]);
    layersRef.current = [];
    setLayers([]);
    setLaySel(null);
    persistLayers([]);
    headsRef.current = [];
    menuRef.current = DEFAULT_MENU;
    sceneRef.current = DEFAULT_SCENE;
    setHeads([]);
    setHeadSel(null);
    setMenu(DEFAULT_MENU);
    setScene(DEFAULT_SCENE);
    persistWords([], DEFAULT_MENU, DEFAULT_SCENE);
    setParams({ ...DEFAULTS });
    setPreset(OPENING);

    exportRef.current = '';
    setExportText('');
    setHasExport(false);
    setHeld(false);
    setWipeArmed(false);
    setBusy('');
    setExportMsg(ids.length
      ? `Started over \u2014 ${ids.length} picture${ids.length > 1 ? 's' : ''} deleted`
      : 'Started over');
  };

  const places = (key) => {
    if (key === 'crease') return 1;
    if (key === 'roll' || key === 'yaw' || key === 'shotRoll') return 0;
    if (key === 'width' || key === 'aspect' || key === 'radius'
        || key === 'offX' || key === 'offY') return 3;
    return 2;
  };

  const slider = ([key, label, min, max, step]) => (
    <div className="row" key={key}>
      <label htmlFor={`c-${key}`}>
        {label}<span>{params[key].toFixed(places(key))}</span>
      </label>
      <input id={`c-${key}`} type="range" min={min} max={max} step={step}
             value={params[key]} onChange={set(key)} />
    </div>
  );

  // the same slider, for the things that are not motion params
  const bit = (id, label, value, min, max, step, onInput, fmt) => (
    <div className="row" key={id}>
      <label htmlFor={id}>{label}<span>{fmt ? fmt(value) : value}</span></label>
      <input id={id} type="range" min={min} max={max} step={step} value={value}
             onChange={(e) => onInput(parseFloat(e.target.value))} />
    </div>
  );

  /* ---------- the stack, as the panel shows it ---------- */

  /* Every picture and every fixed piece of the scene in one order, nearest
     first. Pictures sharing a level fall back to their place in the list,
     which is exactly how they paint. */
  const stackRows = () => {
    const rows = layers.map((l, i) => ({ kind: 'pic', z: l.z, l, i }))
      .concat(sceneRows(hasBgImage, hasFlow)
        .map(([z, name]) => ({ kind: 'fixed', z, name, i: -1 })));
    rows.sort((a, b) => (b.z - a.z)
      || (a.kind !== b.kind ? (a.kind === 'fixed' ? -1 : 1) : b.i - a.i));
    return rows;
  };

  /* What a drop into the strip above row `g` means. The level comes from
     whichever neighbour is a picture -- landing on a picture's level is just
     being in front of or behind it -- and from the band between them when
     both neighbours are pieces of the scene. The new place in the order is
     however many pictures are still behind the strip. */
  const dropInGap = (rows, g, key) => {
    const above = rows[g - 1];
    const below = rows[g];
    let z;
    if (below && below.kind === 'pic') z = below.z;
    else if (above && above.kind === 'pic') z = above.z;
    else {
      const hi = above ? above.z : Z_MAX + 1;
      const lo = below ? below.z : Z_MIN - 1;
      z = Z_STOPS.find((v) => v < hi && v > lo);
      if (z === undefined) z = Math.max(Z_MIN, Math.min(Z_MAX, lo + 1));
    }
    let at = 0;
    for (let k = g; k < rows.length; k++) {
      if (rows[k].kind === 'pic' && rows[k].l.key !== key) at += 1;
    }
    const i = layersRef.current.findIndex((l) => l.key === key);
    if (i >= 0) placeLayerAt(i, z, at);
  };

  /* Open the tab and the fold a fixed row's settings live in, and put them
     on screen. Setting `open` on the details fires its own toggle, so the
     component's state and FOLD_STATE stay in step by themselves. */
  const goToSettings = (name) => {
    const to = SCENE_ROW_GO[name];
    if (!to) return;
    if (to.tab && to.tab !== tab) pickTab(to.tab);
    if (!to.fold) return;
    // after the tab has rendered, or the fold is not in the document yet
    setTimeout(() => {
      const el = document.querySelector(`.fold[data-fold="${to.fold}"]`);
      if (!el) return;
      if (!el.open) el.open = true;
      el.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }, 0);
  };

  const stackList = () => {
    const rows = stackRows();
    const strip = (g) => (
      <li key={`gap${g}`} className={`gap${overGap === g ? ' over' : ''}`}
          onDragOver={(e) => { if (dragKey) { e.preventDefault(); setOverGap(g); } }}
          onDragLeave={() => setOverGap((v) => (v === g ? null : v))}
          onDrop={(e) => {
            e.preventDefault();
            if (dragKey) dropInGap(rows, g, dragKey);
            setDragKey(null);
            setOverGap(null);
          }} />
    );
    const out = [strip(0)];
    rows.forEach((r, g) => {
      if (r.kind === 'fixed') {
        out.push(
          <li key={`fix${r.name}`} className="fixed">
            <span className="nm">{r.name}</span>
            {SCENE_ROW_GO[r.name] && (
              <button className="mini" title={`Settings for the ${r.name.toLowerCase()}`}
                      onClick={() => goToSettings(r.name)}>{'\u2699'}</button>
            )}
          </li>,
        );
      } else {
        const l = r.l;
        out.push(
          <li key={l.key} draggable
              className={`pic${laySel === l.key ? ' sel' : ''}`
                + (dragKey === l.key ? ' drag' : '')}
              onDragStart={(e) => {
                setDragKey(l.key);
                e.dataTransfer.effectAllowed = 'move';
                // Firefox starts no drag at all without something on the payload
                e.dataTransfer.setData('text/plain', l.key);
              }}
              onDragEnd={() => { setDragKey(null); setOverGap(null); }}>
            <span className="grip" aria-hidden="true">{'\u2630'}</span>
            <span className="thumb" style={{ backgroundImage: `url("${srcFor(l)}")` }} />
            <span className="nm" style={{ opacity: l.show ? 1 : 0.45 }}
                  title={zWhere(l.z)}>{l.name}</span>
            <button className="mini" aria-pressed={l.show}
                    title={l.show ? 'On the stage' : 'Kept, but not shown'}
                    onClick={() => applyLayer(r.i, { show: !l.show })}>
              {l.show ? '\u25cf' : '\u25cb'}
            </button>
            <button className="mini" title="Adjust this one" aria-pressed={laySel === l.key}
                    onClick={() => setLaySel(laySel === l.key ? null : l.key)}>{'\u2699'}</button>
            <button className="mini" title="Remove"
                    onClick={() => removeLayer(r.i)}>{'\u00d7'}</button>
          </li>,
        );
      }
      // no strip after the last row: that row is the Backdrop, and there is
      // nowhere under it for a picture to go
      if (g < rows.length - 1) out.push(strip(g + 1));
    });
    return <ul className={`stack${dragKey ? ' dragging' : ''}`}>{out}</ul>;
  };

  // smallest width that still covers the stage, for a stacked picture
  const fillLayer = (i) => {
    const l = layersRef.current[i];
    const stage = worldRef.current;
    if (!l || !stage) return;
    const el = stage.querySelector(`.layer-el[data-k="${l.key}"]`);
    if (!el || !el.naturalWidth) return;
    const byH = (stage.clientHeight / stage.clientWidth)
      * (el.naturalWidth / el.naturalHeight) * 100;
    applyLayer(i, { x: 0, y: 0, rot: 0, size: Math.ceil(Math.max(100, byH)) });
  };

  /* Every stacked picture, each in its own frame at its own level. One
     wrapper apiece rather than two banded containers: the level is a plain
     z-index now, so a picture goes wherever its number puts it and the
     markup no longer has to know which side of the cards that is. */
  const stackAll = () => layers.map((l) => ((l.show && srcFor(l)) ? (
    <div className={`layer${scene.steps.pics.in ? '' : ' noin'}`} key={l.key}
         style={{ zIndex: l.z, '--dim': String(l.dim) }}>
      <img className="layer-el" src={srcFor(l)} alt="" draggable={false}
           data-k={l.key}
           style={{
             width: `${l.size}%`,
             opacity: l.opacity,
             transform: `translate(-50%, -50%) translate(${l.x}%, ${l.y}%) `
               + `rotate(${l.rot}deg)`,
           }} />
    </div>
  ) : null));

  return (
    <div
      className={`world${dropping ? ' dropping' : ''}${intro ? ' intro' : ''}`
                 + (revealed ? '' : ' settling')
                 + (phase === 'from' || phase === 'to' || phase === 'home'
                    ? ' opened' : '')
                 + (phase === 'drop' ? ' closing' : '')}
      style={{
        '--d-back':  `${scene.steps.back.delay}s`,
        '--d-pics':  `${scene.steps.pics.delay}s`,
        '--d-cards': `${scene.steps.cards.delay}s`,
        '--d-words': `${scene.steps.words.delay}s`,
        '--d-menu':  `${scene.steps.menu.delay}s`,
      }}
      ref={worldRef}
      onPointerDown={onPointerDown}
      onPointerMove={onPointerMove}
      onPointerUp={onPointerUp}
      onPointerLeave={() => {
        if (flowRef.current) flowRef.current.pointer(0, 0, false);
        /* or the river stays held by a card the pointer left behind */
        if (hoverRef.current !== -1) {
          hoverRef.current = -1;
          setHoverWork(null);
          if (worldRef.current) worldRef.current.classList.remove('canopen');
        }
        endDrag();
      }}
      onPointerCancel={endDrag}
      onDragOver={(e) => { e.preventDefault(); setDropping(true); }}
      onDragLeave={() => setDropping(false)}
      onDrop={(e) => { e.preventDefault(); setDropping(false); addFiles(e.dataTransfer.files); }}
    >
      {/* the color, the picture and the dim are three layers, not one, so
          the stack can reach between them */}
      <div className={`backdrop${bg.kind === 'default' ? ' sky' : ''}`
                      + (scene.steps.back.in ? '' : ' noin')} ref={backRef} />
      {hasBgImage && (
        /* resolved here rather than read off bg.url, because off disk the
           backdrop's id is known before the folder has been read, and the
           stored url would still be the empty string it was given then */
        <div className={`bgpic${scene.steps.back.in ? '' : ' noin'}`}>
          {/* The <img> stays in place even while the shader is showing: it is
              where the texture comes from, it is what Fill frame measures,
              and hiding it rather than dropping it means a failure to put it
              on the GPU costs the effect and nothing else. */}
          <img className="bg-el" ref={bgElRef} src={srcFor(bg)} alt="" draggable={false}
               style={{
                 width: `${bg.size}%`,
                 opacity: bg.opacity,
                 visibility: rippleLive ? 'hidden' : 'visible',
                 filter: bg.dim > 0 ? `brightness(${(1 - bg.dim).toFixed(3)})` : 'none',
                 transform: `translate(-50%, -50%) translate(${bg.x}%, ${bg.y}%) `
                   + `rotate(${bg.rot}deg)`,
               }} />
          {wantRipple && (
            <canvas className="bg-el bg-ripple" ref={rippleElRef}
                    style={{
                      width: `${bg.size}%`,
                      opacity: bg.opacity,
                      filter: bg.dim > 0 ? `brightness(${(1 - bg.dim).toFixed(3)})` : 'none',
                      transform: `translate(-50%, -50%) translate(${bg.x}%, ${bg.y}%) `
                        + `rotate(${bg.rot}deg)`,
                    }} />
          )}
        </div>
      )}
      {hasFlow && (
        <div className={`bgflow${scene.steps.back.in ? '' : ' noin'}`}
             style={{ opacity: bg.flowOpacity }}>
          <canvas className="bg-flow" ref={flowElRef} />
        </div>
      )}

      {stackAll()}

      <div className={`stage${scene.steps.cards.in ? '' : ' noin'}`}>
        {Array.from({ length: n }, (_, i) => {
          const item = deck[i];
          const Art = CLIPS[i % CLIPS.length];
          return (
            <div className="card" key={item ? item.key : `art-${i}`}
                 ref={(el) => (cardRefs.current[i] = el)}>
              <div className="card-art" ref={(el) => (artRefs.current[i] = el)}>
                <div className="card-media">{item ? <Media item={item} /> : <Art />}</div>
              </div>
              <div className="card-sheen" ref={(el) => (sheenRefs.current[i] = el)} />
              <div className="card-edge" />
            </div>
          );
        })}
      </div>

      {/* Out through a portal, because the world carries a perspective and
          a roll -- and inside a transformed ancestor "fixed" quietly stops
          meaning fixed. */}
      {ReactDOM.createPortal(
        <React.Fragment>
          {/* Dark through the travel as well, and lifting only while the card
              turns back into the ring -- the mirror of its arriving while the
              card comes out. Lifting it at the start of the close left the
              whole return playing against a bright page. */}
          <div className={'sheet-veil'
                          + (phase === 'lift' || phase === 'from'
                             || phase === 'to' || phase === 'home'
                             ? ' in' : '')}
               onClick={() => closeCard(true)} />

          {zoom && open && (
            <div className={`sheet${phase === 'to' ? ' in' : ''}`
                            + (phase === 'home' ? ' going' : '')}
                 style={{
                   /* Back down into the card it grew out of, on the curve it
                      grew along. The exit is the entrance reversed, because
                      anything else reads as two different gestures for one
                      thing. */
                   width: `${zoom.sheet.w}px`,
                   height: `${zoom.sheet.h}px`,
                   transform: phase === 'from'
                     ? `translate(${zoom.from.x.toFixed(1)}px, ${zoom.from.y.toFixed(1)}px)`
                       + ` scale(${(zoom.from.w / zoom.sheet.w).toFixed(4)},`
                       + ` ${(zoom.from.h / zoom.sheet.h).toFixed(4)})`
                     : phase === 'home'
                       ? `translate(${zoom.from.x.toFixed(1)}px, ${zoom.from.y.toFixed(1)}px)`
                         + ` scale(${(zoom.from.w / zoom.sheet.w).toFixed(4)},`
                         + ` ${(zoom.from.h / zoom.sheet.h).toFixed(4)})`
                       : `translate(${zoom.sheet.x.toFixed(1)}px, ${zoom.sheet.y.toFixed(1)}px)`,
                 }}>
              <button className="sheet-x" onClick={() => closeCard(true)}
                      aria-label="Close">{'\u00d7'}</button>
              <div className="sheet-text"
                   style={zoom.sheet.w >= 820 ? {
                     left: `${(zoom.to.x - zoom.sheet.x + zoom.to.w + zoom.to.pad).toFixed(0)}px`,
                     top: `${zoom.to.pad}px`,
                     width: `${(zoom.sheet.w - (zoom.to.x - zoom.sheet.x) - zoom.to.w
                                - zoom.to.pad * 2).toFixed(0)}px`,
                     maxHeight: `${(zoom.sheet.h - zoom.to.pad * 2 - 56).toFixed(0)}px`,
                   } : {
                     left: `${zoom.to.pad}px`,
                     top: `${(zoom.to.y - zoom.sheet.y + zoom.to.h + zoom.to.pad).toFixed(0)}px`,
                     width: `${(zoom.sheet.w - zoom.to.pad * 2).toFixed(0)}px`,
                     maxHeight: `${(zoom.sheet.h - (zoom.to.y - zoom.sheet.y)
                                    - zoom.to.h - zoom.to.pad * 2 - 56).toFixed(0)}px`,
                   }}>
                <p className="sheet-kind">{open.kind}</p>
                <h2 className="sheet-title">{open.title}</h2>
                <p className="sheet-blurb">{open.blurb}</p>
                <div className="sheet-rule" />
                <p className="sheet-more">More work</p>
                <div className="sheet-list">
                  {WORKS.filter((w) => w.slug !== open.slug
                      && deck.some((it) => {
                        const f = workFor(it && it.id);
                        return f && f.slug === w.slug;
                      }))
                    .map((w) => (
                      <button key={w.slug} onClick={() => swapTo(w)}>{w.title}</button>
                    ))}
                </div>
              </div>
              <button className="sheet-back" onClick={() => closeCard(true)}>
                Back to the river
              </button>
            </div>
          )}

          {zoom && (
            <div className={`zoomer${phase === 'home' ? ' going' : ''}`
                            + (phase === 'drop' ? ' landing' : '')}
                 style={{
                   width: `${zoom.to.w}px`,
                   height: `${zoom.to.h}px`,
                   backgroundImage: zoom.src ? `url(${zoom.src})` : undefined,
                   transform: phase === 'to'
                     ? `translate(${zoom.to.x.toFixed(1)}px, ${zoom.to.y.toFixed(1)}px)`
                     : `translate(${zoom.from.x.toFixed(1)}px, ${zoom.from.y.toFixed(1)}px)`
                       + ` scale(${(zoom.from.w / zoom.to.w).toFixed(4)},`
                       + ` ${(zoom.from.h / zoom.to.h).toFixed(4)})`,
                 }}>
              {zoom.video && (
                <video src={zoom.video} autoPlay muted loop playsInline />
              )}
            </div>
          )}

          {/* Named where the eye is not: the card is what you are looking at,
              so the word for it sits at the foot of the frame. */}
          <div className={`hovercap${hoverWork && !open ? ' in' : ''}`}>
            {hoverWork && (
              <React.Fragment>
                <span className="hovercap-kind">{hoverWork.kind}</span>
                <span className="hovercap-title">{hoverWork.title}</span>
                <span className="hovercap-go">Open</span>
              </React.Fragment>
            )}
          </div>
        </React.Fragment>,
        document.body,
      )}

      <div className="vignette" />

      {waitingFor && (
        <div className="holding">
          <p>
            {waitingFor === 'reconnect' ? (
              <React.Fragment>
                This page remembers your <b>Card River</b> folder but is not
                allowed to read it yet. Press <b>Reconnect</b>, bottom left, and
                your work comes back.
              </React.Fragment>
            ) : (
              <React.Fragment>
                Press <b>Choose folder</b>, bottom left, and pick the{' '}
                <b>Card River</b> folder this page sits in. Your work loads
                from there.
              </React.Fragment>
            )}
          </p>
        </div>
      )}

      {scene.grain > 0 && <div className="grain" style={{ opacity: scene.grain }} />}

      {heads.length > 0 && (
        <div className={`words${scene.steps.words.in ? '' : ' noin'}`}>
          {/* every message is rendered, empty and hidden ones included, so the
              list and the elements the frame loop writes to stay in step */}
          {heads.map((h, i) => {
            const k = h.scale * scene.wordScale;    // the pair moves together
            return (
              <div className="headline"
                   key={h.key}
                   ref={(el) => (headElRefs.current[i] = el)}
                   style={{
                     left: `${50 + h.x}%`,
                     top: `${50 + h.y}%`,
                     textAlign: h.align,
                     display: h.show ? undefined : 'none',
                   }}>
                <span className={`hl f-${h.font}${h.caps ? ' caps' : ''}`}
                      style={{
                        fontSize: `${(h.size * k).toFixed(2)}vmin`,
                        color: h.color,
                        fontWeight: h.font === 'sora' ? h.weight : undefined,
                      }}>
                  {h.text}
                </span>
                {h.sub && (
                  <span className={`sub f-${h.subFont}`}
                        style={{ fontSize: `${(h.subSize * k).toFixed(2)}vmin`, color: h.subColor }}>
                    {h.sub}
                  </span>
                )}
              </div>
            );
          })}
        </div>
      )}

      {menu.on && (menu.items.length > 0 || menu.brand) && (
        <div className={`rmenu ${menu.place} ${menu.align} f-${menu.font}`
                        + (scene.steps.menu.in ? '' : ' noin')}
             style={{ color: menu.color }}>
          <span className="brand">{menu.brand}</span>
        </div>
      )}

      {/* The links live behind a catch now rather than across the top: the
          river is the page, and a row of words over it was competing with the
          thing they are there to get you into. */}
      {menu.on && menu.items.length > 0 && (
        <React.Fragment>
          <button className={`burger${menuOpen ? ' open' : ''}`}
                  style={{ color: menu.color }}
                  aria-expanded={menuOpen}
                  aria-label={menuOpen ? 'Close menu' : 'Menu'}
                  onClick={() => setMenuOpen((o) => !o)}>
            <span /><span /><span />
          </button>
          <nav className={`drawer f-${menu.font}${menuOpen ? ' open' : ''}`}
               style={{ color: menu.color }}>
            {menu.items.map((it) => (
              <button key={it.key} type="button"
                      onClick={() => { setMenuOpen(false); goTo(it.card); }}>
                {it.label || `Card ${it.card + 1}`}
              </button>
            ))}
          </nav>
        </React.Fragment>
      )}

      <button className="ui-toggle" onClick={() => setShowUI((s) => !s)}
              aria-expanded={showUI} aria-label="Toggle motion controls">
        {showUI ? '\u00d7' : '\u2699'}
      </button>

      <div className="panel" hidden={!showUI}>
        <div className="tabs">
          {TABS.map((t) => (
            <button key={t} className="chip" aria-pressed={tab === t}
                    onClick={() => pickTab(t)}>{t}</button>
          ))}
        </div>

        {caps.ready && !caps.db && (
          <p className="hint" style={{ color: '#ff9a2e' }}>
            No storage here, so nothing you do will be kept and pictures cannot
            be added. Open <b>local.html</b> and connect the Card River folder,
            or open the published artifact.
          </p>
        )}

        {tab === 'Cards' && (<React.Fragment>
        <h2>Cards ({n})</h2>
        <div className="deckbar">
          <label className="chip" htmlFor="pick">Add images</label>
          <input id="pick" type="file" accept="image/*,video/*" multiple hidden
                 onChange={(e) => { addFiles(e.target.files); e.target.value = ''; }} />
          {deck.length > 0 && (
            <button className="chip" onClick={clearDeck}>Sample art</button>
          )}
        </div>
        <p className="hint">
          {busy || (deck.length === 0
            ? 'Drop images or video on the stage to build your own deck.'
            : caps.assets
              ? 'Saved with the artifact.'
              : 'This session only \u2014 this view cannot store files.')}
        </p>
        {deck.length > 0 && (
          <ul className="deck">
            {deck.map((it, i) => (
              <li key={it.key}>
                <span className="thumb"
                      style={it.kind === 'image' ? { backgroundImage: `url(${srcFor(it)})` } : undefined}>
                  {it.kind === 'video' && <video src={srcFor(it)} muted playsInline />}
                </span>
                <span className="nm" title={it.name}>{it.name}</span>
                <button className="mini" onClick={() => toggleFlip(i, 'fh')}
                        aria-pressed={!!it.fh} aria-label="Flip horizontally">{'\u21c4'}</button>
                <button className="mini" onClick={() => toggleFlip(i, 'fv')}
                        aria-pressed={!!it.fv} aria-label="Flip vertically">{'\u21c5'}</button>
                <button className="mini" onClick={() => moveCard(i, -1)}
                        disabled={i === 0} aria-label="Move up">{'\u2191'}</button>
                <button className="mini" onClick={() => moveCard(i, 1)}
                        disabled={i === deck.length - 1} aria-label="Move down">{'\u2193'}</button>
                <button className="mini" onClick={() => removeCard(i)}
                        aria-label="Remove">{'\u00d7'}</button>
              </li>
            ))}
          </ul>
        )}
        </React.Fragment>)}

        {tab === 'Scene' && (<React.Fragment>
        <Fold id="backdrop" title="Backdrop" start>
        <div className="deckbar">
          {BG_KINDS.map(([kind, label]) => (
            <button key={kind} className="chip" aria-pressed={bg.kind === kind}
                    onClick={() => applyBg({ kind })}>{label}</button>
          ))}
        </div>
        {bg.kind !== 'default' && (
          <div className="row">
            <label htmlFor="bgcolor">Color<span>{bg.color}</span></label>
            <input id="bgcolor" type="color" value={bg.color}
                   onChange={(e) => applyBg({ color: e.target.value })} />
          </div>
        )}
        {bg.kind === 'image' && (
          <div className="deckbar">
            <label className="chip" htmlFor="bgpick">
              {hasBgImage ? 'Replace image' : 'Choose image'}
            </label>
            <input id="bgpick" type="file" accept="image/*" hidden
                   onChange={(e) => { setBackgroundFile(e.target.files[0]); e.target.value = ''; }} />
            {hasBgImage && <button className="chip" onClick={clearBackgroundImage}>Remove</button>}
          </div>
        )}

              ))}
            </ul>
          )}
          <div className="deckbar">
            <button className="chip" disabled={menu.items.length >= MENU_MAX}
                    onClick={() => addLinks([{
                      label: '', card: Math.min(menu.items.length * 2, Math.max(n - 1, 0)),
                    }])}>+ Add a link</button>
            {menu.items.length === 0 && (
              <button className="chip"
                      onClick={() => addLinks(THREE_LINKS)}>Start with three</button>
            )}
          </div>
          <p className="hint">
            {menu.items.length === 0
              ? 'A menu holds up to six of these. The number beside each one is '
                + 'the card it turns the river to.'
              : 'The number is the card that link turns the river to, bringing '
                + 'it through the middle of the frame. Scrolling or dragging '
                + 'takes the river back off the menu at once.'}
          </p>

          <h2>Name</h2>
          <div className="namerow">
            <input type="text" value={menu.brand} maxLength={28}
                   placeholder="A name for the piece"
                   onChange={(e) => applyMenu({ brand: e.target.value })} />
          </div>
          <p className="hint">
            A wordmark at one end of the bar, not a link: it goes nowhere when
            clicked. Leave it empty for links alone.
          </p>

          <h2>Where it sits</h2>
          <div className="deckbar">
            {[['top', 'Top'], ['bottom', 'Bottom']].map(([p, label]) => (
              <button key={p} className="chip" aria-pressed={menu.place === p}
                      onClick={() => applyMenu({ place: p })}>{label}</button>
            ))}
          </div>
          <div className="deckbar">
            {[['split', 'Spread out'], ['start', 'Left'],
              ['center', 'Centre'], ['end', 'Right']].map(([a, label]) => (
              <button key={a} className="chip" aria-pressed={menu.align === a}
                      onClick={() => applyMenu({ align: a })}>{label}</button>
            ))}
          </div>
          <div className="row">
            <label htmlFor="m-col">Color<span>{menu.color}</span></label>
            <input id="m-col" type="color" value={menu.color}
                   onChange={(e) => applyMenu({ color: e.target.value })} />
          </div>
          <div className="deckbar">
            {FONTS.map(([f, label]) => (
              <button key={f} className="chip" aria-pressed={menu.font === f}
                      onClick={() => applyMenu({ font: f })}>{label}</button>
            ))}
          </div>
        </React.Fragment>)}
        </Fold>
        </React.Fragment>)}

        {tab === 'Motion' && (<React.Fragment>
        <Fold id="looks" title="Looks" start>
          <div className="presets">
            {Object.keys(PRESETS).concat(userPresets.map((p) => p.name)).map((name) => (
              <button key={name} className="chip" aria-pressed={preset === name}
                      onClick={() => applyPreset(name)}>{name}</button>
            ))}
          </div>
          <div className="namerow">
            <input type="text" value={presetName} maxLength={28}
                   placeholder="Name this look"
                   onChange={(e) => { setPresetName(e.target.value); setPresetMsg(''); }}
                   onKeyDown={(e) => { if (e.key === 'Enter') savePreset(); }} />
            <button className="chip" onClick={savePreset}>Save</button>
            {isCustom && <button className="chip" onClick={deletePreset}>Delete</button>}
          </div>
          {(presetMsg || !caps.db) && (
            <p className="hint">{presetMsg || 'Saved presets need the artifact\u2019s store \u2014 unavailable in this view.'}</p>
          )}
        </Fold>
        <Fold id="movement" title="Movement">
          {CONTROLS.map(slider)}
        </Fold>
        <Fold id="cardshape" title="Card shape">
          {SHAPE.map(slider)}
        </Fold>
        <Fold id="placement" title="Placement">
          {PLACEMENT.map(slider)}
        </Fold>
        <Fold id="opening" title="Opening">
          <label className="toggle">
            <input type="checkbox" checked={scene.intro}
                   onChange={(e) => writeScene({ intro: e.target.checked })} />
            Fade things in when the page opens
          </label>
          {scene.intro && (<React.Fragment>
            <ul className="deck">
              {INTRO_STEPS.map(([k, label]) => (
                <li key={k}>
                  <span className="nm" style={{ opacity: scene.steps[k].in ? 1 : 0.45 }}>
                    {label}
                  </span>
                  <input type="number" min="0" max="3" step="0.05"
                         value={scene.steps[k].delay}
                         disabled={!scene.steps[k].in}
                         title="Seconds before this one starts"
                         style={{ width: '5.2em', flex: 'none' }}
                         onChange={(e) => writeStep(k, {
                           delay: Math.max(0, Math.min(parseFloat(e.target.value) || 0, 3)),
                         })} />
                  <button className="mini" aria-pressed={scene.steps[k].in}
                          title={scene.steps[k].in
                            ? 'Comes in' : 'There from the first frame'}
                          onClick={() => writeStep(k, { in: !scene.steps[k].in })}>
                    {scene.steps[k].in ? '\u25cf' : '\u25cb'}
                  </button>
                </li>
              ))}
            </ul>
            <div className="deckbar">
              <button className="chip" onClick={playIntro}>Play it now</button>
              <button className="chip" onClick={() => writeScene({
                steps: DEFAULT_SCENE.steps,
              })}>Reset the order</button>
            </div>
            <p className="hint">
              The number is how long each one waits before it starts, in
              seconds. The dot takes one out of the opening altogether, so it
              is simply there from the first frame. Anyone who has asked their
              system to reduce motion sees it all at once anyway.
            </p>
            {/* Said out loud, because a long delay looks exactly like the page
                being broken: the stage sits there without the thing that is
                waiting, and nothing on screen explains why. */}
            <p className="hint" style={{ color: 'var(--accent)' }}>
              {(() => {
                const on = INTRO_STEPS.filter(([k]) => scene.steps[k].in);
                if (!on.length) {
                  return 'Nothing comes in: the whole piece is there from the first frame.';
                }
                const last = Math.max.apply(null, on.map(([k]) => scene.steps[k].delay));
                const slow = on.filter(([k]) => scene.steps[k].delay >= 1.2)
                  .map(([, label]) => label.toLowerCase());
                return `All in by about ${(last + 1.2).toFixed(1)}s.`
                  + (slow.length
                    ? ` The ${slow.join(' and ')} wait a long time first, and until then`
                      + ' the stage shows everything else without them.'
                    : '');
              })()}
            </p>
          </React.Fragment>)}
        </Fold>
        </React.Fragment>)}

        {tab === 'Sizes' && (<React.Fragment>
        <p className="hint">
          Window is {winW}px.{activeBp === null
            ? ' Add a size to start.'
            : ` Everything you change is saved to the ${activeBp}px size.`}
        </p>
        <div className="deckbar">
          <button className="chip" onClick={() => addStop(winW)}>
            + Add size at {winW}px
          </button>
          {/* so a size can be set down at an exact width without dragging the
              window until the number happens to match */}
          <input type="number" min="200" max="4000" step="1" value={newW}
                 placeholder="width"
                 style={{ width: '6em', flex: 'none' }}
                 onChange={(e) => setNewW(e.target.value)}
                 onKeyDown={(e) => {
                   if (e.key !== 'Enter') return;
                   const v = parseInt(newW, 10);
                   if (v > 0) { addStop(v); setNewW(''); }
                 }} />
          <button className="chip" onClick={() => {
            const v = parseInt(newW, 10);
            if (v > 0) { addStop(v); setNewW(''); }
          }}>+ Add that width</button>
        </div>
        <label className="toggle">
          <input type="checkbox" checked={fluid}
                 onChange={(e) => {
                   setFluid(e.target.checked);
                   appliedBp.current = undefined;
                   lastW.current = -1;        // re-evaluate under the new mode
                   const db = capsRef.current.db;
                   if (db) db.doc('deck/breakpoints')
                     .set({ items: bpsRef.current, fluid: e.target.checked })
                     .catch(() => {});
                 }} />
          Glide between breakpoints
        </label>
        {bps.length === 0 && (
          <p className="hint">One look serves every width until you add a size.</p>
        )}
        {bps.length > 0 && (
          <ul className="deck">
            {bps.map((b) => (
              <li key={b.w}>
                <span className="nm">
                  {b.w}px{activeBp === b.w ? '   editing' : ''}
                  {b.bg && b.bg.kind === 'image' && b.bg.id ? '' : '   no picture yet'}
                </span>
                <button className="mini" onClick={() => goToStop(b.w)}
                        aria-pressed={activeBp === b.w} aria-label="Edit this size">
                  {'\u25b8'}
                </button>
                <button className="mini" onClick={() => resetStop(b.w)}
                        title="Back to the built-in look at this width"
                        aria-label="Reset this size">{'\u21ba'}</button>
                <button className="mini" onClick={() => deleteStop(b.w)}
                        aria-label="Remove">{'\u00d7'}</button>
              </li>
            ))}
          </ul>
        )}
        </React.Fragment>)}

        {tab === 'Data' && (<React.Fragment>
        <div className="deckbar">
          <button className="chip" onClick={exportJson}>Export JSON</button>
          <label className="chip" htmlFor="jsonpick">Import file</label>
          <input id="jsonpick" type="file" accept="application/json,.json" hidden
                 onChange={async (e) => {
                   const f = e.target.files[0];
                   e.target.value = '';
                   if (!f) return;
                   const t = await f.text();
                   setExportText(t);
                   importJson(t);
                 }} />
          <button className="chip"
                  onClick={() => { exportRef.current = ''; setExportText(''); setHeld(false); setHasExport(true); setExportMsg(''); }}>
            Paste
          </button>
          {/* says what it does: re-applies the preset's sliders. It does not
              clear the deck, the backdrop or the sizes. */}
          <button className="reset" onClick={() => applyPreset(preset || OPENING)}>Reset sliders</button>
        </div>
        <label className="toggle">
          <input type="checkbox" checked={embed}
                 onChange={(e) => setEmbed(e.target.checked)} />
          Embed images in the file
        </label>
        {exportMsg && <p className="hint">{exportMsg}</p>}
        {hasExport && (
          <React.Fragment>
            {held
              ? <p className="hint">Held in memory &mdash; too large to show, but Copy and Save file still work on it.</p>
              : <textarea className="exportbox" value={exportText} spellCheck={false}
                          placeholder="Paste a card-river.json here, then press Apply"
                          onChange={(e) => { setExportText(e.target.value); exportRef.current = e.target.value; }}
                          onFocus={(e) => e.target.select()} />}
            <div className="deckbar">
              <button className="chip" onClick={copyExport}>Copy</button>
              <button className="chip"
                      onClick={() => saveText('card-river.json', exportRef.current)
                        .then((r) => setExportMsg(r.how === 'none'
                          ? 'No way to write a file here \u2014 use Copy'
                          : r.how === 'declined' ? 'Save cancelled' : 'Saved card-river.json'))}>
                Save file
              </button>
              <button className="chip"
                      onClick={() => importJson(exportRef.current || exportText)}>Apply</button>
              <button className="chip"
                      onClick={() => { setExportText(''); exportRef.current = ''; setHeld(false); setHasExport(false); setExportMsg(''); }}>
                Close
              </button>
            </div>
          </React.Fragment>
        )}

        <h2>Start over</h2>
        {!wipeArmed ? (
          <React.Fragment>
            <button className="reset" onClick={() => setWipeArmed(true)}>Clear everything</button>
            <p className="hint">
              Empties the deck, the backdrop, every size, the stacked pictures,
              the messages and the menu, and deletes the picture files behind
              them. Saved presets stay. Export first if you might want this
              back.
            </p>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <p className="hint" style={{ color: 'var(--accent)' }}>
              Delete {deck.length} card{deck.length === 1 ? '' : 's'}, the
              backdrop, {bps.length} size{bps.length === 1 ? '' : 's'},{' '}
              {layers.length} stacked picture{layers.length === 1 ? '' : 's'} and{' '}
              {heads.length} message{heads.length === 1 ? '' : 's'}?
              This cannot be undone.
            </p>
            <div className="deckbar">
              <button className="chip" onClick={startOver}>Yes, clear it</button>
              <button className="chip" onClick={() => setWipeArmed(false)}>Cancel</button>
            </div>
          </React.Fragment>
        )}
        </React.Fragment>)}

        <p className="hint">
          Drag or scroll the stage to scrub. Press C to hide this panel.
          {typeof window !== 'undefined' && window.__build
            && ` \u00b7 build ${window.__build}`}
        </p>
        {tab === 'Data' && BOOT.length > 0 && (
          <p className="hint" style={{ fontFamily: 'var(--mono)', fontSize: '11px' }}>
            opening: {BOOT.join(' \u00b7 ')}ms
          </p>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<CardRiver />);
</script>
</body>
</html>
