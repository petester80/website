/* An id carries its filename, so the work is found in it. Longest match first,
   so a short key cannot steal a picture belonging to a longer one. */
const WORK_BY_LEN = WORKS.slice().sort((a, b) => b.match.length - a.match.length);
const workFor = (id) => {
  if (!id) return null;
  const hay = String(id).toLowerCase();
  for (let i = 0; i < WORK_BY_LEN.length; i++) {
    if (hay.indexOf(WORK_BY_LEN[i].match.toLowerCase()) >= 0) return WORK_BY_LEN[i];
  }
  return null;
};
const workBySlug = (slug) => WORKS.find((w) => w.slug === slug) || null;

/* ---------- how a wheel drives the river ------------------------------

   Geared to the wheel rather than to the layout: a notch is a notch, however
   far apart the cards are set. It used to divide by the river's own slot
   spacing, so the wider the river the less a scroll did.

   A notch lands partly at once and partly as momentum, because a wheel
   arrives in lumps at uneven times and the whole of one landing together
   made the step between frames swing from nothing to half a card. The
   momentum decays by 0.0015 a second and so travels 1/ln(1/0.0015) of
   itself, about 0.154 -- which is what the 6.5 undoes, so the split changes
   when the movement arrives and never how far it goes. */
const WHEEL_PER_CARD = 420;   // px of wheel that carry the river one card
const WHEEL_NOW = 0.45;       // of a notch, landing immediately
const WHEEL_CARRY = 6.5;      // and the rest, handed to the momentum

const blendBg = (a, b, t) => {
  if (!a) return b;
  if (!b) return a;
  const out = {};
  BG_NUM.forEach((k) => {
    out[k] = (typeof a[k] === 'number' && typeof b[k] === 'number')
      ? lerp(a[k], b[k], t)
      : (typeof b[k] === 'number' ? b[k] : a[k]);
  });
  BG_HEX.forEach((k) => { out[k] = mixHex(a[k], b[k], t); });
  const near = t < 0.5 ? a : b;
  out.flow = !!near.flow;
  if (typeof near.ripple === 'boolean') out.ripple = near.ripple;
  /* Which field is running cannot be mixed, so the nearer size wins -- but
     only if it has an opinion. Every size saved before there were two fields
     has none, and reading that silence as "the drifting one" put the choice
     back the moment the frame crossed into one of them. */
  if (near.flowKind) {
    out.flowKind = FLOW_KEYS.indexOf(near.flowKind) >= 0 ? near.flowKind : 'field';
  }
  if (near.kind) out.kind = near.kind;
  if (Object.prototype.hasOwnProperty.call(near, 'id')) out.id = near.id || null;
  return out;
};

/* Fold a captured backdrop onto the live one, resolving the image id to a
   source. Returns the same object when nothing moved, so React can bail. */
const applyBgSnapshot = (prev, snap) => {
  if (!snap) return prev;
  const next = { ...prev };
  let changed = false;
  BG_NUM.forEach((k) => {
    const v = snap[k];
    if (typeof v !== 'number') return;
    if (Math.abs((typeof prev[k] === 'number' ? prev[k] : 0) - v) > 1e-4) {
      next[k] = v;
      changed = true;
    }
  });
  BG_HEX.forEach((k) => {
    if (typeof snap[k] === 'string' && snap[k] !== prev[k]) { next[k] = snap[k]; changed = true; }
  });
  if (snap.kind && snap.kind !== prev.kind) { next.kind = snap.kind; changed = true; }
  if (typeof snap.flow === 'boolean' && snap.flow !== prev.flow) {
    next.flow = snap.flow;
    changed = true;
  }
  if (typeof snap.ripple === 'boolean' && snap.ripple !== prev.ripple) {
    next.ripple = snap.ripple;
    changed = true;
  }
  if (typeof snap.flowKind === 'string') {
    const fk = FLOW_KEYS.indexOf(snap.flowKind) >= 0 ? snap.flowKind : 'field';
    if (fk !== prev.flowKind) { next.flowKind = fk; changed = true; }
  }
  if (snap.kind === 'image' && snap.id) {
    // this size names a picture: show it
    if (snap.id !== (prev.id || null)) {
      next.id = snap.id;
      next.url = srcFor({ id: snap.id, url: '' });
      changed = true;
    }
  } else if (snap.kind && snap.kind !== 'image' && (prev.id || prev.url)) {
    // this size is a gradient or a flat color: the picture goes away, rather
    // than the last one lingering because the snapshot "had no opinion"
    next.id = null;
    next.url = '';
    changed = true;
  }
  return changed ? next : prev;
};

const blendMaps = (a, b, t) => {
  const out = {};
  Object.keys(a || {}).forEach((k) => {
    const av = a[k];
    const bv = b ? b[k] : undefined;
    out[k] = (typeof av === 'number' && typeof bv === 'number') ? lerp(av, bv, t) : (bv === undefined ? av : bv);
  });
  return out;
};

/* Cards and background are independent tracks. A breakpoint may pin either,
   or both, so you can change the backdrop at one width without freezing the
   card settings there -- and anything a breakpoint does not pin simply carries
   on from whatever came before. Each track resolves against only the
   breakpoints that actually pin it. */
/* Each stop is a complete look saved against a window width. Between two
   stops everything glides; outside the ends the nearest stop holds. */
/* `at` is the stop these values came from. The panel used to work that out
   separately with nearestStop, which is a different question: at 1024px with
   stops at 700 and 1050, the nearest is 1050 but the look being drawn is 700's,
   because without glide a width takes the stop at or below it. The panel then
   said you were editing 1050 while every slider showed 700. One answer now. */
const resolveAt = (stops, w, fluid) => {
  if (!stops.length) return null;
  if (w <= stops[0].w) {
    return { params: stops[0].params, bg: stops[0].bg, layers: stops[0].layers, at: stops[0].w };
  }
  const last = stops[stops.length - 1];
  if (w >= last.w) return { params: last.params, bg: last.bg, layers: last.layers, at: last.w };

  let a = stops[0];
  let b = last;
  for (let i = 0; i < stops.length - 1; i++) {
    if (w >= stops[i].w && w <= stops[i + 1].w) { a = stops[i]; b = stops[i + 1]; break; }
  }
  if (!fluid) return { params: a.params, bg: a.bg, layers: a.layers, at: a.w };

  const span = (b.w - a.w) || 1;
  const raw = (w - a.w) / span;
  const t = raw * raw * (3 - 2 * raw);   // settle into each end rather than ramp
  // mid-glide the look belongs to neither, so edits go to whichever end is closer
  return { params: blendMaps(a.params, b.params, t), bg: blendBg(a.bg, b.bg, t),
           layers: blendLayerSnaps(a.layers, b.layers, t),
           at: raw < 0.5 ? a.w : b.w };
};

const nearestStop = (stops, w) => (stops.length
  ? stops.reduce((best, s) => (Math.abs(s.w - w) < Math.abs(best.w - w) ? s : best))
  : null);

const TAU = Math.PI * 2;
const DEG = 180 / Math.PI;

/* ---------- the flowing backdrop ---------- */
/* A field of drifting lines that part around the pointer and trail eddies
   behind it. Ported from a React/TypeScript component into plain JS to suit
   this file, keeping the physics that gives it its look:

     - the drift is three divergence-free sway terms, so the field never
       bunches up or thins out on its own;
     - the pointer is a cylinder in potential flow, so lines bend around it
       analytically rather than being pushed by a fudge;
     - a moving pointer sheds alternating Lamb-Oseen vortices, which is the
       Karman street that makes the wake read as fluid rather than as decay.

   It is driven from the page's own frame loop rather than a second
   requestAnimationFrame, so the cards and the backdrop never fight over
   which one is behind. */

const FLOW_MAX = 4200;         // particle ceiling
const FLOW_L = 19;             // history points per particle
const FLOW_STEP = 1 / 60;      // fixed physics step
const FLOW_PUFFS = 32;
const FLOW_AGES = 6;           // age buckets per trail
const FLOW_SEGS = 3;           // segments per bucket

/* per-step filter coefficients; the step is fixed, so these are constants */
const F_RELAX = 1 - Math.exp(-FLOW_STEP / 0.12);
const F_Q = 1 - Math.exp(-FLOW_STEP * 8);
const F_CURSOR = 1 - Math.exp(-FLOW_STEP * 18);
const F_VEL = 1 - Math.exp(-FLOW_STEP * 10);
const F_IN = 1 - Math.exp(-FLOW_STEP / 0.06);
const F_OUT = 1 - Math.exp(-FLOW_STEP / 0.2);
const F_FIRE_P = 0.03 * FLOW_STEP;
const F_FIRE_DECAY = Math.exp(-FLOW_STEP / 0.45);
const F_PUFF_DECAY = Math.exp(-FLOW_STEP / 1.1);

const F_ALPHA = [0.2, 0.32, 0.48];
const F_WIDTH = [0.7, 0.9, 1.2];

const rng32 = (seed) => {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

/* One term of psi = A/|k| * sin(k.x + wt + phase). Taking u = d(psi)/dy and
   v = -d(psi)/dx analytically keeps the field divergence free. */
const flowWave = (lambda, angle, omega, phase, amp) => {
  const k = TAU / lambda;
  return {
    kx: k * Math.cos(angle), ky: k * Math.sin(angle),
    om: omega, ph: phase,
    au: amp * Math.sin(angle), av: -amp * Math.cos(angle),
  };
};
const FLOW_WAVES = [
  flowWave(380, 0.35, 0.18, 0.7, 16),
  flowWave(620, 1.9, 0.27, 2.1, 13),
  flowWave(900, 3.4, 0.35, 4.2, 10),
];

function makeFlow(canvas) {
  const ctx = canvas.getContext('2d');
  const rand = rng32(7);
  let w = 1;
  let h = 1;
  let dpr = 1;

  const px = new Float32Array(FLOW_MAX);
  const py = new Float32Array(FLOW_MAX);
  const vx = new Float32Array(FLOW_MAX);
  const vy = new Float32Array(FLOW_MAX);
  const pz = new Float32Array(FLOW_MAX);
  const v0 = new Float32Array(FLOW_MAX);
  const qv = new Float32Array(FLOW_MAX);
  const fire = new Float32Array(FLOW_MAX);
  const plen = new Uint8Array(FLOW_MAX);
  const hx = new Float32Array(FLOW_MAX * FLOW_L);
  const hy = new Float32Array(FLOW_MAX * FLOW_L);
  let head = 0;
  let active = 0;

  const groups = [];
  for (let g = 0; g < 6; g++) groups.push(new Int32Array(FLOW_MAX));
  const gcount = new Int32Array(6);
  const styles = new Array(6 * FLOW_AGES).fill('');
  const widths = new Float32Array(6 * FLOW_AGES);
  const headStyles = ['', ''];

  const uX = new Float32Array(FLOW_PUFFS);
  const uY = new Float32Array(FLOW_PUFFS);
  const uG = new Float32Array(FLOW_PUFFS);
  const uAge = new Float32Array(FLOW_PUFFS);
  const uOn = new Uint8Array(FLOW_PUFFS);
  const lX = new Float32Array(FLOW_PUFFS);
  const lY = new Float32Array(FLOW_PUFFS);
  const lG = new Float32Array(FLOW_PUFFS);
  const lC2 = new Float32Array(FLOW_PUFFS);
  const lR2 = new Float32Array(FLOW_PUFFS);
  let lCount = 0;
  let puffAt = 0;
  let shedSign = 1;
  let shedAcc = 0;

  let simTime = 0;
  let acc = 0;
  let owed = 0;       // warm-up steps still to be paid back
  let opts = { speed: 1, pull: 64, count: 0, calm: '#22e6ff', mid: '#8a5cff', hot: '#ff3d9a' };

  let ptrOn = false;
  let ptrX = 0;
  let ptrY = 0;
  let tgtX = 0;
  let tgtY = 0;
  let cx = 0;
  let cy = 0;
  let pcx = 0;
  let pcy = 0;
  let vcx = 0;
  let vcy = 0;
  let infl = 0;
  let curA = 64;
  let prevSrc = 0;

  const rgb = (hex, fb) => {
    const v = hexToRgb(hex);
    return v || fb;
  };

  const buildStyles = () => {
    const cols = [rgb(opts.calm, [34, 230, 255]), rgb(opts.mid, [138, 92, 255]),
      rgb(opts.hot, [255, 61, 154])];
    for (let g = 0; g < 6; g++) {
      const near = g >= 3;
      const b = g % 3;
      const c = cols[b];
      for (let ab = 0; ab < FLOW_AGES; ab++) {
        const fall = Math.pow(1 - (ab + 0.5) / FLOW_AGES, 1.5);
        const al = Math.min(0.95, F_ALPHA[b] * (near ? 1 : 0.55) * fall * 1.3);
        styles[g * FLOW_AGES + ab] = `rgba(${c[0]},${c[1]},${c[2]},${al.toFixed(3)})`;
        const wd = F_WIDTH[b] * (near ? 1 : 0.75) * (1 - (0.45 * ab) / FLOW_AGES);
        widths[g * FLOW_AGES + ab] = Math.max(0.6, Math.min(1.3, wd));
      }
    }
    headStyles[0] = 'rgba(234,252,255,0.5)';
    headStyles[1] = 'rgba(234,252,255,0.85)';
  };

  const seed = (i, anywhere) => {
    const x = anywhere ? rand() * w : -40 + rand() * (w + 80);
    const y = anywhere ? rand() * h : -40 - rand() * 80;
    const z = 0.35 + 0.65 * rand();
    const nominal = 70 + 90 * z * z;
    pz[i] = z;
    v0[i] = nominal;
    plen[i] = 9 + Math.floor(rand() * 11);
    px[i] = x;
    py[i] = y;
    vx[i] = 0;
    vy[i] = nominal * opts.speed;
    qv[i] = 1;
    fire[i] = 0;
    const base = i * FLOW_L;
    for (let k = 0; k < FLOW_L; k++) { hx[base + k] = x; hy[base + k] = y; }
  };

  const setCount = (anywhere) => {
    const auto = Math.max(900, Math.min(Math.round((w * h) / 620), 3600));
    const want = Math.max(1, Math.min(Math.round(opts.count > 0 ? opts.count : auto), FLOW_MAX));
    for (let i = active; i < want; i++) seed(i, anywhere);
    active = want;
  };

  const shed = (a, speed) => {
    const dxn = vcx / speed;
    const dyn = vcy / speed;
    const s = shedSign;
    shedSign = -shedSign;
    const j = puffAt;
    puffAt = (puffAt + 1) % FLOW_PUFFS;
    uX[j] = cx - dxn * 0.6 * a - dyn * s * 0.7 * a;
    uY[j] = cy - dyn * 0.6 * a + dxn * s * 0.7 * a;
    uG[j] = Math.max(-105000, Math.min(s * Math.min(speed, 1200) * a * 1.5, 105000));
    uAge[j] = 0;
    uOn[j] = 1;
  };

  const step = () => {
    const flow = opts.speed;
    head = (head + 1) % FLOW_L;
    simTime += FLOW_STEP;

    const src = ptrOn ? 1 : 0;
    if (src) { tgtX = ptrX; tgtY = ptrY; }
    const snap = src && !prevSrc && infl < 0.05;
    prevSrc = src;
    if (snap) {
      cx = tgtX; cy = tgtY; pcx = cx; pcy = cy; vcx = 0; vcy = 0;
    } else {
      pcx = cx; pcy = cy;
      cx += (tgtX - cx) * F_CURSOR;
      cy += (tgtY - cy) * F_CURSOR;
      vcx += ((cx - pcx) / FLOW_STEP - vcx) * F_VEL;
      vcy += ((cy - pcy) / FLOW_STEP - vcy) * F_VEL;
    }
    infl += (src - infl) * (src ? F_IN : F_OUT);

    const vcMag = Math.sqrt(vcx * vcx + vcy * vcy);
    const a = opts.pull + Math.min(vcMag * 0.025, 36);
    curA = a;

    if (infl > 0.3 && vcMag > 60) {
      const dxm = cx - pcx;
      const dym = cy - pcy;
      shedAcc += Math.sqrt(dxm * dxm + dym * dym);
      let guard = 0;
      while (shedAcc >= 28 && guard < 4) { shedAcc -= 28; guard++; shed(a, vcMag); }
      if (shedAcc >= 28) shedAcc = 0;
    } else {
      shedAcc = 0;
    }

    lCount = 0;
    const drift = 0.5 * 115 * flow * FLOW_STEP;
    for (let j = 0; j < FLOW_PUFFS; j++) {
      if (!uOn[j]) continue;
      const age = uAge[j] + FLOW_STEP;
      if (age > 2.4) { uOn[j] = 0; continue; }
      uAge[j] = age;
      uG[j] *= F_PUFF_DECAY;
      uY[j] += drift;
      const c2 = 676 + 90 * age;     // viscous spreading
      lX[lCount] = uX[j]; lY[lCount] = uY[j]; lG[lCount] = uG[j] / TAU;
      lC2[lCount] = c2; lR2[lCount] = 36 * c2;
      lCount++;
    }

    const W = FLOW_WAVES;
    const p0 = W[0].om * simTime + W[0].ph;
    const p1 = W[1].om * simTime + W[1].ph;
    const p2 = W[2].om * simTime + W[2].ph;
    const obsOn = infl > 0.002;
    const projOn = infl > 0.05;
    const projScale = Math.min(1, infl * 1.5);
    const bottom = h + 40;
    const right = w + 120;

    for (let i = 0; i < active; i++) {
      const x0 = px[i];
      const y0 = py[i];
      const z = pz[i];
      const vn = v0[i] * flow;

      const c0 = Math.cos(W[0].kx * x0 + W[0].ky * y0 + p0);
      const c1 = Math.cos(W[1].kx * x0 + W[1].ky * y0 + p1);
      const c2 = Math.cos(W[2].kx * x0 + W[2].ky * y0 + p2);
      let tx = (W[0].au * c0 + W[1].au * c1 + W[2].au * c2) * z;
      let ty = vn + (W[0].av * c0 + W[1].av * c1 + W[2].av * c2) * z;

      const zf = 0.55 + 0.45 * z;    // far lines feel the pointer less
      const aE = a * zf;
      const rx = x0 - cx;
      const ry = y0 - cy;
      let pertX = 0;
      let pertY = 0;
      let deficit = 0;

      if (obsOn) {
        const d2 = rx * rx + ry * ry;
        let Ux = -vcx;
        let Uy = vn - vcy;
        let U = Math.sqrt(Ux * Ux + Uy * Uy);
        if (U > 1e-3) {
          if (U > 900) { const sc = 900 / U; Ux *= sc; Uy *= sc; U = 900; }
          const ex = Ux / U;
          const ey = Uy / U;
          const s = rx * ex + ry * ey;
          const nn0 = -rx * ey + ry * ex;
          if (s > 0 && s < 12 * aE) {
            const wd = 0.9 * aE + 0.2 * s;
            const nn = nn0 / wd;
            deficit = 0.55 * Math.exp(-s / (3 * aE)) * Math.exp(-nn * nn);
          }
          const near = 9 * aE;
          if (d2 < near * near) {
            const rho2 = Math.max(s * s + nn0 * nn0, aE * aE * 0.64);
            const k = (aE * aE) / (rho2 * rho2);
            const ds = -U * k * (s * s - nn0 * nn0);
            const dn = -U * k * 2 * s * nn0;
            let win = 1;
            const inner = 5 * aE;
            if (d2 > inner * inner) {
              const t = (Math.sqrt(d2) - inner) / (4 * aE);
              win = 1 - t * t * (3 - 2 * t);
            }
            pertX = (ds * ex - dn * ey) * win;
            pertY = (ds * ey + dn * ex) * win;
          }
        }
      }

      let vorX = 0;
      let vorY = 0;
      for (let j = 0; j < lCount; j++) {
        const dx = x0 - lX[j];
        const dy = y0 - lY[j];
        const d2p = dx * dx + dy * dy + 1e-3;
        const r2 = lR2[j];
        if (d2p < r2) {
          const f = (lG[j] * (1 - Math.exp(-d2p / lC2[j]))) / d2p;
          const wnd = 1 - d2p / r2;
          const fw = f * wnd * wnd * zf;
          vorX += -dy * fw;
          vorY += dx * fw;
        }
      }

      const keep = 1 - deficit * infl;
      tx = tx * keep + pertX * infl + vorX;
      ty = ty * keep + pertY * infl + vorY;

      let ux = vx[i] + (tx - vx[i]) * F_RELAX;
      let uy = vy[i] + (ty - vy[i]) * F_RELAX;
      const sp2 = ux * ux + uy * uy;
      if (sp2 > 810000) { const sc = 900 / Math.sqrt(sp2); ux *= sc; uy *= sc; }
      let x = x0 + ux * FLOW_STEP;
      let y = y0 + uy * FLOW_STEP;

      if (projOn) {
        const aP = aE * projScale;
        const qx = x - cx;
        const qy = y - cy;
        const q2 = qx * qx + qy * qy;
        const lim = 0.98 * aP;
        if (q2 < lim * lim) {
          const rr = Math.sqrt(q2);
          const nx = rr < 1e-3 ? 0 : qx / rr;
          const ny = rr < 1e-3 ? 1 : qy / rr;
          x = cx + nx * aP;
          y = cy + ny * aP;
          const dot = (ux - vcx) * nx + (uy - vcy) * ny;
          if (dot < 0) { ux -= dot * nx; uy -= dot * ny; }
        }
      }

      vx[i] = ux; vy[i] = uy; px[i] = x; py[i] = y;

      if (y > bottom || x < -120 || x > right || y < -600) { seed(i, false); continue; }

      qv[i] += (Math.sqrt(ux * ux + uy * uy) / vn - qv[i]) * F_Q;
      if (rand() < F_FIRE_P) fire[i] = 1;
      else { const f = fire[i] * F_FIRE_DECAY; fire[i] = f < 0.01 ? 0 : f; }

      const slot = i * FLOW_L + head;
      hx[slot] = x;
      hy[slot] = y;
    }
  };

  const draw = () => {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    gcount.fill(0);
    for (let i = 0; i < active; i++) {
      const q = qv[i];
      let b = q < 1.25 ? 0 : q < 1.85 ? 1 : 2;
      if (fire[i] > 0.35 && b < 2) b++;
      const g = (pz[i] < 0.62 ? 0 : 3) + b;
      groups[g][gcount[g]++] = i;
    }

    for (let g = 0; g < 6; g++) {
      const cnt = gcount[g];
      if (!cnt) continue;
      const list = groups[g];
      for (let ab = 0; ab < FLOW_AGES; ab++) {
        const k0 = ab * FLOW_SEGS;
        const k1 = k0 + FLOW_SEGS;
        ctx.strokeStyle = styles[g * FLOW_AGES + ab];
        ctx.lineWidth = widths[g * FLOW_AGES + ab];
        ctx.beginPath();
        for (let j = 0; j < cnt; j++) {
          const i = list[j];
          const segs = plen[i] - 1;
          if (k0 >= segs) continue;
          const base = i * FLOW_L;
          const kEnd = Math.min(k1, segs);
          let idx = (head - k0 + FLOW_L) % FLOW_L;
          ctx.moveTo(hx[base + idx], hy[base + idx]);
          for (let k = k0; k < kEnd; k++) {
            idx = idx === 0 ? FLOW_L - 1 : idx - 1;
            ctx.lineTo(hx[base + idx], hy[base + idx]);
          }
        }
        ctx.stroke();
      }
    }

    const prev = head === 0 ? FLOW_L - 1 : head - 1;
    ctx.lineWidth = 1.4;
    for (let d = 0; d < 2; d++) {
      ctx.strokeStyle = headStyles[d];
      ctx.beginPath();
      for (let b = 1; b < 3; b++) {
        const g = d * 3 + b;
        const cnt = gcount[g];
        const list = groups[g];
        for (let j = 0; j < cnt; j++) {
          const i = list[j];
          if (b === 1 && fire[i] <= 0.5) continue;
          const base = i * FLOW_L;
          ctx.moveTo(hx[base + head], hy[base + head]);
          ctx.lineTo(hx[base + prev], hy[base + prev]);
        }
      }
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  };

  return {
    resize(nw, nh) {
      const d = Math.min(window.devicePixelRatio || 1, 2);
      const cap = nw * nh * d * d > 4.5e6 ? Math.sqrt(4.5e6 / (nw * nh)) : d;
      if (nw === w && nh === h && cap === dpr) return;
      const first = w === 1;
      w = Math.max(1, nw); h = Math.max(1, nh); dpr = cap;
      canvas.width = Math.max(1, Math.round(w * dpr));
      canvas.height = Math.max(1, Math.round(h * dpr));
      if (first) { for (let i = 0; i < FLOW_MAX; i++) seed(i, true); }
      else { for (let i = 0; i < active; i++) if (px[i] > w + 120 || py[i] > h + 40) seed(i, false); }
      setCount(true);
    },
    set(next) {
      const was = opts.count;
      opts = { ...opts, ...next };
      buildStyles();
      if (opts.count !== was) { active = Math.min(active, FLOW_MAX); setCount(false); }
    },
    pointer(x, y, on) { ptrX = x; ptrY = y; ptrOn = on; },
    /* Warm the field up so it never appears as a blank sheet filling in. */
    warm(seconds) { const n = Math.round(seconds / FLOW_STEP); for (let s = 0; s < n; s++) step(); draw(); },
    frame(dt) {
      acc += Math.min(0.05, dt);
      let n = 0;
      while (acc >= FLOW_STEP && n < 3) { step(); acc -= FLOW_STEP; n++; }
      if (n === 3) acc = 0;
      if (n > 0) draw();
    },
  };
}

/* ---------- the gateway: tracks that converge on the middle ----------

   A second field, and a far simpler one than the fluid above. Every track is
   a fixed curve from the left or the right edge to the centre of the frame,
   drawn as a dotted line with sparks running along it. The pointer pushes
   sparks off their tracks as it passes, and a press sends a ring out that
   carries whatever it crosses.

   It answers the same calls as the fluid field -- resize, set, pointer, warm,
   frame -- so neither the canvas nor the page's own loop needs to know which
   one is running. `tap` is the one addition, and the page checks for it
   rather than assuming. */
const GW_STEP = 1 / 60;
const GW_MAX = 300;           // tracks the arrays can hold
const GW_PER = 2;             // sparks on each track
const GW_RINGS = 12;          // rings in flight at once
const GW_GROW = 700;          // px a ring grows each second
const GW_LIFE = 1.3;          // seconds a ring lasts
const GW_BAND = 120;          // how far either side of a ring it carries
const GW_DECAY = Math.exp(-GW_STEP / 0.25);  // a spark easing back on track

function makeGateway(canvas) {
  const ctx = canvas.getContext('2d', { alpha: true });
  let w = 1;
  let h = 1;
  let dpr = 1;
  let opts = {
    count: 0, speed: 1, pull: 64,
    calm: '#22e6ff', mid: '#8a5cff', hot: '#ff3d9a',
  };
  let active = 0;
  let seeded = 0;    // tracks that have had their sparks placed
  let acc = 0;
  let ptrX = -1e5;
  let ptrY = -1e5;
  let ptrOn = false;

  const ty = new Float32Array(GW_MAX);            // where it leaves the edge
  const tj = new Float32Array(GW_MAX);            // its own offset in that gap
  const side = new Uint8Array(GW_MAX);            // 0 left, 1 right
  const sp = new Float32Array(GW_MAX * GW_PER);   // 0..1 along the track
  const sv = new Float32Array(GW_MAX * GW_PER);   // t gained each second
  const sx = new Float32Array(GW_MAX * GW_PER);   // how far off the track it
  const sy = new Float32Array(GW_MAX * GW_PER);   // has been pushed

  const rx = new Float32Array(GW_RINGS);
  const ry = new Float32Array(GW_RINGS);
  const rr = new Float32Array(GW_RINGS);
  const rlife = new Float32Array(GW_RINGS);
  let ringAt = 0;

  const rand = rng32(0x1d0a7);
  /* The tracks are the expensive half: a few hundred dashed curves cost more
     to stroke than everything else here put together, and at 300 of them the
     page fell to 14 frames a second. They do not move between resizes, so
     they are stroked once into a layer of their own and that layer is what
     each frame draws. */
  const track = document.createElement('canvas');
  const tctx = track.getContext('2d');
  let trackDirty = true;
  let lineCol = 'rgba(34,230,255,0.3)';
  let sparkCol = 'rgba(138,92,255,0.8)';
  let ringRgb = '255,61,154';
  let glow = null;

  const buildStyles = () => {
    const a = hexToRgb(opts.calm) || [34, 230, 255];
    const b = hexToRgb(opts.mid) || [138, 92, 255];
    const c = hexToRgb(opts.hot) || [255, 61, 154];
    lineCol = `rgba(${a[0]},${a[1]},${a[2]},0.3)`;
    sparkCol = `rgba(${b[0]},${b[1]},${b[2]},0.8)`;
    ringRgb = `${c[0]},${c[1]},${c[2]}`;
    glow = null;   // it depends on the frame size too, so the draw rebuilds it
    trackDirty = true;
  };

  /* Tracks are spread over rather more than the frame height, so the ones
     starting past the top and bottom edges still sweep across it. */
  const layout = () => {
    for (let i = 0; i < active; i++) {
      side[i] = i & 1;
      const gap = (h * 1.4) / active;
      ty[i] = (i + 0.5) * gap - h * 0.2 + tj[i] * gap;
    }
    trackDirty = true;
  };
  const seedSparks = (i) => {
    tj[i] = (rand() - 0.5) * 1.6;   // so the fan is uneven, not a comb
    for (let k = 0; k < GW_PER; k++) {
      const j = i * GW_PER + k;
      sp[j] = (k / GW_PER + rand()) % 1;
      sv[j] = 0.09 + rand() * 0.13;
      sx[j] = 0;
      sy[j] = 0;
    }
  };
  /* A resize re-flows the fan but leaves the sparks where they were, so
     dragging a window edge does not restart the whole thing. */
  const setCount = () => {
    const auto = Math.max(24, Math.min(Math.round(h / 13), 150));
    active = Math.max(6, Math.min(
      Math.round(opts.count > 0 ? opts.count : auto), GW_MAX));
    // the sparks first: laying the fan out reads each track's own offset
    for (; seeded < active; seeded++) seedSparks(seeded);
    layout();
  };

  /* One track's four control points, written into a shared tuple so the step
     and the draw are not each building one per track per frame. */
  const P = new Float32Array(8);
  const curveOf = (i) => {
    const cx = w / 2;
    const cy = h / 2;
    const left = side[i] === 0;
    P[0] = left ? 0 : w;
    P[1] = ty[i];
    P[2] = left ? cx * 0.5 : w - cx * 0.5;
    P[3] = ty[i];
    P[4] = left ? cx * 0.8 : w - cx * 0.8;
    P[5] = cy;
    P[6] = cx;
    P[7] = cy;
  };
  let qx = 0;
  let qy = 0;
  const atT = (t) => {
    const u = 1 - t;
    const a = u * u * u;
    const b = 3 * u * u * t;
    const c = 3 * u * t * t;
    const d = t * t * t;
    qx = a * P[0] + b * P[2] + c * P[4] + d * P[6];
    qy = a * P[1] + b * P[3] + c * P[5] + d * P[7];
  };

  const step = () => {
    for (let r = 0; r < GW_RINGS; r++) {
      if (rlife[r] <= 0) continue;
      rr[r] += GW_GROW * GW_STEP;
      rlife[r] -= GW_STEP / GW_LIFE;
      if (rlife[r] < 0) rlife[r] = 0;
    }
    const pull = opts.pull;
    const pull2 = pull * pull;
    for (let i = 0; i < active; i++) {
      curveOf(i);
      for (let k = 0; k < GW_PER; k++) {
        const j = i * GW_PER + k;
        sp[j] += sv[j] * opts.speed * GW_STEP;
        if (sp[j] > 1) sp[j] -= 1;
        atT(sp[j]);
        let ax = 0;
        let ay = 0;
        if (ptrOn) {
          const dx = qx - ptrX;
          const dy = qy - ptrY;
          const d2 = dx * dx + dy * dy;
          if (d2 < pull2) {
            /* Carried out to about the edge of the circle rather than merely
               nudged: a push that falls off with distance never clears its
               own radius, so it only shuffled sparks about inside it. Push is
               the size of the bubble the pointer opens. */
            const d = Math.max(Math.sqrt(d2), 0.5);
            ax += (dx / d) * (pull - d) * 0.95;
            ay += (dy / d) * (pull - d) * 0.95;
          }
        }
        for (let r = 0; r < GW_RINGS; r++) {
          if (rlife[r] <= 0) continue;
          const dx = qx - rx[r];
          const dy = qy - ry[r];
          const d = Math.sqrt(dx * dx + dy * dy) || 1e-3;
          const off = Math.abs(d - rr[r]);
          if (off < GW_BAND) {
            const f = (1 - off / GW_BAND) * rlife[r];
            ax += (dx / d) * f * 110;
            ay += (dy / d) * f * 110;
          }
        }
        // the push is only where it wants to be: it eases there and back off
        sx[j] = sx[j] * GW_DECAY + ax * (1 - GW_DECAY);
        sy[j] = sy[j] * GW_DECAY + ay * (1 - GW_DECAY);
      }
    }
  };

  const draw = () => {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    if (!glow) {
      const far = Math.max(60, Math.min(w, h) * 0.42);
      const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, far);
      g.addColorStop(0, `rgba(${ringRgb},0.2)`);
      g.addColorStop(0.45, `rgba(${ringRgb},0.05)`);
      g.addColorStop(1, `rgba(${ringRgb},0)`);
      glow = g;
    }
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);

    if (trackDirty) {
      trackDirty = false;
      track.width = canvas.width;
      track.height = canvas.height;
      tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      tctx.clearRect(0, 0, w, h);
      // every track is the same dotted line, so they all go down in one stroke
      tctx.beginPath();
      for (let i = 0; i < active; i++) {
        curveOf(i);
        tctx.moveTo(P[0], P[1]);
        tctx.bezierCurveTo(P[2], P[3], P[4], P[5], P[6], P[7]);
      }
      tctx.strokeStyle = lineCol;
      tctx.lineWidth = 1.1;
      tctx.setLineDash([1, 4]);
      tctx.stroke();
    }
    ctx.drawImage(track, 0, 0, w, h);

    // and so is every spark
    ctx.beginPath();
    for (let i = 0; i < active; i++) {
      curveOf(i);
      for (let k = 0; k < GW_PER; k++) {
        const j = i * GW_PER + k;
        atT(sp[j]);
        ctx.rect(qx + sx[j] - 1.4, qy + sy[j] - 1.4, 2.8, 2.8);
      }
    }
    ctx.fillStyle = sparkCol;
    ctx.fill();

    // the rings themselves, faint enough to read as a wake
    for (let r = 0; r < GW_RINGS; r++) {
      if (rlife[r] <= 0) continue;
      ctx.beginPath();
      ctx.arc(rx[r], ry[r], rr[r], 0, TAU);
      ctx.strokeStyle = `rgba(${ringRgb},${(rlife[r] * 0.26).toFixed(3)})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  };

  buildStyles();

  return {
    resize(nw, nh) {
      const d = Math.min(window.devicePixelRatio || 1, 2);
      const cap = nw * nh * d * d > 4.5e6 ? Math.sqrt(4.5e6 / (nw * nh)) : d;
      if (nw === w && nh === h && cap === dpr) return;
      w = Math.max(1, nw); h = Math.max(1, nh); dpr = cap;
      canvas.width = Math.max(1, Math.round(w * dpr));
      canvas.height = Math.max(1, Math.round(h * dpr));
      glow = null;
      setCount();
    },
    set(next) {
      const was = opts.count;
      opts = { ...opts, ...next };
      buildStyles();
      if (opts.count !== was) setCount();
    },
    pointer(x, y, on) { ptrX = x; ptrY = y; ptrOn = on; },
    /* A ring from a press. The fluid field has no such call, so the page
       checks before making it. */
    tap(x, y) {
      rx[ringAt] = x;
      ry[ringAt] = y;
      rr[ringAt] = 0;
      rlife[ringAt] = 1;
      ringAt = (ringAt + 1) % GW_RINGS;
    },
    warm(seconds) {
      const n = Math.round(seconds / GW_STEP);
      for (let s = 0; s < n; s++) step();
      draw();
    },
    frame(dt) {
      acc += Math.min(0.05, dt);
      let n = 0;
      while (acc >= GW_STEP && n < 3) { step(); acc -= GW_STEP; n++; }
      if (n === 3) acc = 0;
      if (n > 0) draw();
    },
  };
}

/* ---------- the nebula: dust carried by a curl field ----------------------

   Tens of thousands of specks, each one pixel, drifting on a swirling field
   that gathers them into sheets and ridges and leaves voids between. The
   pointer pushes a hole through it that stays open while it rests there.

   Two things make the count affordable. The field is worked out on a coarse
   grid once per step and read off it per speck, rather than evaluated tens of
   thousands of times; and nothing is drawn through the canvas API at all --
   the specks are written straight into a pixel buffer as numbers, which is
   the only way fifty thousand of anything gets onto a frame in time.

   The field is the curl of a stream function, as the drifting field's sway
   is: a flow built that way can never pile up or thin out on its own, so the
   structure you see is the field's and not an artefact of the maths. */
const NEB_STEP = 1 / 60;
const NEB_MAX = 50000;
const NEB_GX = 80;             // velocity grid, in cells across
const NEB_GY = 50;
/* The buffer is deliberately coarser than the frame. Fifty thousand specks
   spread over a retina-resolution sheet is a thin dusting; over this they
   read as a cloud, and the browser's own scaling up is the nearest thing to
   bloom that costs nothing. */
const NEB_PIX = 1.6e6;         // pixels the buffer may hold
/* How far off the curl the flow is turned, and so how hard dust gathers.
   It is a balance, not a taste: too little and the cloud is an even haze
   with no structure at all, too much and inside a few seconds every speck
   has fallen into one of a handful of points and the frame is four bright
   dots. The waves travelling fast enough that no ridge has time to finish
   collapsing is the other half of it. */
const NEB_LEAN = 0.185;
/* The random walk, in pixels per step at a thousand-pixel frame -- it is
   scaled with the frame like everything else here. It has to be read against
   the flow: gathering and spreading are in balance, and a figure that is
   right on a laptop is a blizzard on a phone if it is left as plain pixels. */
const NEB_DRIFT = 0.5;
/* Seconds a speck lasts before it is put back somewhere at random.

   Gathering has no natural limit: a convergent flow keeps pulling, and the
   random walk only spreads as the square root of time, so it never catches
   up. Left alone the cloud is a fine haze at five seconds, sheets at ten and
   a few bright threads with bare frame between them at thirty -- and which
   of those you see depends on how long you happened to leave the tab open,
   which is no way to settle a look. Retiring a steady trickle of specks puts
   a ceiling on it: the cloud reaches the structure this number allows and
   stays there. Spread over every frame, it is some tens of specks a frame
   out of tens of thousands, and nothing is seen to appear. */
const NEB_LIFE = 7;
/* Whole wave numbers, every one of them. The frame wraps, so a speck leaving
   the right edge arrives at the left -- and unless the field repeats over
   exactly that distance, it arrives somewhere the flow is pointing elsewhere.
   With fractional wave numbers that mismatch pumps dust across the wrap all
   day, and what should be a drifting haze collapses into a few threads with
   nothing between them. */
const NEB_WAVES = [
  { kx: 1, ky: 1, w: 0.062, a: 1.00, p: 0.00 },
  { kx: -2, ky: 1, w: -0.048, a: 0.70, p: 1.70 },
  { kx: 2, ky: -2, w: 0.074, a: 0.50, p: 3.40 },
  { kx: -3, ky: -2, w: -0.065, a: 0.36, p: 5.10 },
  { kx: 4, ky: 3, w: 0.089, a: 0.25, p: 2.20 },
  { kx: -4, ky: 5, w: 0.080, a: 0.18, p: 4.30 },
];
/* The waves are summed with their own wave numbers as weights, so changing
   the spectrum changes how fast the whole thing moves -- and the pointer's
   push, which is in plain pixels, stops meaning the same thing. Dividing it
   out keeps the field's speed where it was set and leaves the spectrum free
   to be chosen for how it looks. */
const NEB_NORM = 1 / NEB_WAVES.reduce(
  (t, W) => t + W.a * Math.max(Math.abs(W.kx), Math.abs(W.ky)), 0);

function makeNebula(canvas) {
  const ctx = canvas.getContext('2d', { alpha: true });
  let w = 1;          // the frame, in CSS pixels
  let h = 1;
  let bw = 1;         // the buffer, in its own pixels
  let bh = 1;
  let img = null;
  let buf = null;     // a 32-bit view of the same bytes
  let opts = { count: 0, speed: 1, pull: 64,
    calm: '#22e6ff', mid: '#8a5cff', hot: '#ff3d9a' };
  let active = 0;
  let seeded = 0;
  let acc = 0;
  let owed = 0;       // warm-up steps still to be paid back
  let simTime = 0;
  let ptrX = -1e5;
  let ptrY = -1e5;
  let ptrOn = false;

  /* Dust still gathers, because a flow read off a grid is only nearly
     incompressible and because the pointer shoves it about. A speck of real
     drift each step spreads it back out, so ridges stay ridges instead of
     thinning to threads with bare frame between them. */
  let noise = 0x2545f491;
  let retireAt = 0;
  const px = new Float32Array(NEB_MAX);
  const py = new Float32Array(NEB_MAX);
  const pd = new Float32Array(NEB_MAX);   // its depth, 0 far to 1 near
  const pc = new Int32Array(NEB_MAX);     // which of the three colours
  const rand = rng32(0x9e37a);

  // the grid, in buffer pixels per second
  const gu = new Float32Array((NEB_GX + 1) * (NEB_GY + 1));
  const gv = new Float32Array((NEB_GX + 1) * (NEB_GY + 1));

  /* A pixel is four bytes, and which byte is which depends on the machine.
     Writing one 32-bit number instead of four bytes is most of the speed
     here, so it is worth asking once rather than guessing. */
  const LE = (() => {
    const probe = new ArrayBuffer(4);
    new Uint32Array(probe)[0] = 0x01000000;
    return new Uint8Array(probe)[0] === 0;
  })();
  const packed = new Int32Array(3);        // rgb only; alpha is accumulated
  const bright = new Float32Array(3);

  const buildStyles = () => {
    [opts.calm, opts.mid, opts.hot].forEach((hex, i) => {
      const c = hexToRgb(hex) || [255, 255, 255];
      /* lifted well toward white: dust reads as light, and a speck in a
         saturated hue at one pixel across just looks like a dead sub-pixel */
      const r = Math.round(c[0] * 0.3 + 255 * 0.7);
      const g = Math.round(c[1] * 0.3 + 255 * 0.7);
      const b = Math.round(c[2] * 0.3 + 255 * 0.7);
      packed[i] = LE ? ((b << 16) | (g << 8) | r) : ((r << 24) | (g << 16) | (b << 8)) >>> 0;
      bright[i] = 1;
    });
  };

  const seed = (i) => {
    px[i] = rand() * bw;
    py[i] = rand() * bh;
    const d = rand();
    pd[i] = 0.25 + d * 0.75;
    /* Mostly the first colour, a scattering of the second, a few of the
       third. An even three-way split at one pixel a speck is confetti, not
       dust. */
    pc[i] = d < 0.72 ? 0 : (d < 0.96 ? 1 : 2);
  };

  const setCount = () => {
    const auto = Math.round((bw * bh) / 20);
    active = Math.max(600, Math.min(
      Math.round(opts.count > 0 ? opts.count : auto), NEB_MAX));
    for (; seeded < active; seeded++) seed(seeded);
  };

  /* The curl of a sum of travelling waves. Worked out on the grid corners;
     everything between is read off it. */
  const field = () => {
    const sp = opts.speed;
    const scale = 0.14 * Math.min(bw, bh) * sp * NEB_NORM;
    for (let gyi = 0; gyi <= NEB_GY; gyi++) {
      const v = gyi / NEB_GY;
      for (let gxi = 0; gxi <= NEB_GX; gxi++) {
        const u = gxi / NEB_GX;
        let du = 0;
        let dv = 0;
        for (let k = 0; k < NEB_WAVES.length; k++) {
          const W = NEB_WAVES[k];
          const c = Math.cos((W.kx * u + W.ky * v + W.w * simTime) * TAU + W.p);
          du += W.a * W.ky * c;
          dv -= W.a * W.kx * c;
        }
        /* Turned a fixed angle off the pure curl. A curl field can never
           gather anything -- it is incompressible by construction -- so dust
           carried by one stays an even haze for ever, which is the one thing
           a nebula is not. Leaning it over mixes in the gradient of the same
           function, and that has a divergence: dust converges into ridges and
           leaves voids, and both travel as the waves do. The lean costs two
           multiplies, since the gradient is the curl's own components
           swapped. */
        const at = gyi * (NEB_GX + 1) + gxi;
        gu[at] = (du + NEB_LEAN * dv) * scale;
        gv[at] = (dv - NEB_LEAN * du) * scale;
      }
    }
  };

  const step = () => {
    simTime += NEB_STEP;
    field();
    // the trickle of specks going back into the pot, spread evenly over time
    let retire = Math.ceil(active / (NEB_LIFE * 60));
    while (retire-- > 0) {
      if (retireAt >= active) retireAt = 0;
      const i = retireAt++;
      px[i] = rand() * bw;
      py[i] = rand() * bh;
    }
    const sx = NEB_GX / bw;
    const sy = NEB_GY / bh;
    const walk = NEB_DRIFT * Math.min(bw, bh) * 0.001;
    const pull = opts.pull * (bw / Math.max(1, w));   // the push, in buffer px
    const pull2 = pull * pull;
    const mx = ptrX * (bw / Math.max(1, w));
    const my = ptrY * (bh / Math.max(1, h));
    for (let i = 0; i < active; i++) {
      let x = px[i];
      let y = py[i];
      // bilinear off the grid
      const fx = x * sx;
      const fy = y * sy;
      let ix = fx | 0;
      let iy = fy | 0;
      if (ix < 0) ix = 0; else if (ix >= NEB_GX) ix = NEB_GX - 1;
      if (iy < 0) iy = 0; else if (iy >= NEB_GY) iy = NEB_GY - 1;
      const tx = fx - ix;
      const ty = fy - iy;
      const a0 = iy * (NEB_GX + 1) + ix;
      const a1 = a0 + 1;
      const b0 = a0 + NEB_GX + 1;
      const b1 = b0 + 1;
      const w00 = (1 - tx) * (1 - ty);
      const w10 = tx * (1 - ty);
      const w01 = (1 - tx) * ty;
      const w11 = tx * ty;
      /* nearer dust runs faster, which is the whole of the depth here: with
         everything moving at one rate it reads as a flat sheet */
      const depth = 0.55 + pd[i] * 0.75;
      let vx = (gu[a0] * w00 + gu[a1] * w10 + gu[b0] * w01 + gu[b1] * w11) * depth;
      let vy = (gv[a0] * w00 + gv[a1] * w10 + gv[b0] * w01 + gv[b1] * w11) * depth;
      if (ptrOn) {
        const dx = x - mx;
        const dy = y - my;
        const d2 = dx * dx + dy * dy;
        if (d2 < pull2) {
          const d = Math.max(Math.sqrt(d2), 0.5);
          const f = (1 - d / pull) * 2.4;
          vx += (dx / d) * f * pull;
          vy += (dy / d) * f * pull;
        }
      }
      noise ^= noise << 13; noise ^= noise >>> 17; noise ^= noise << 5;
      x += vx * NEB_STEP + ((noise & 255) * 0.0078125 - 1) * walk;
      y += vy * NEB_STEP + (((noise >>> 8) & 255) * 0.0078125 - 1) * walk;
      // the frame wraps, so the cloud never runs out at an edge
      if (x < 0) x += bw; else if (x >= bw) x -= bw;
      if (y < 0) y += bh; else if (y >= bh) y -= bh;
      px[i] = x;
      py[i] = y;
    }
  };

  const draw = () => {
    if (!buf) return;
    buf.fill(0);
    /* Alpha carries the brightness and the colour stays at full strength:
       the buffer is composited straight, so a speck written dim would be
       dimmed twice over. Piling up adds, and that is what makes a ridge read
       brighter than the haze around it -- but only where specks actually
       land on the same pixel, which at a few percent coverage almost never
       happens. The nearest quarter is drawn two pixels across for that
       reason as much as for depth: it is what gives the dense places
       somewhere to pile. */
    for (let i = 0; i < active; i++) {
      const x = px[i] | 0;
      const y = py[i] | 0;
      if (x < 0 || y < 0 || x >= bw || y >= bh) continue;
      const d = pd[i];
      const col = packed[pc[i]];
      const add = 34 + d * 165;
      const row = y * bw;
      let at = row + x;
      let a = ((buf[at] >>> 24) & 255) + add;
      buf[at] = (LE ? ((a > 255 ? 255 : a) << 24) : (a > 255 ? 255 : a)) | col;
      if (d > 0.76) {
        const x1 = x + 1 < bw ? x + 1 : 0;
        const y1 = y + 1 < bh ? y + 1 : 0;
        const r1 = y1 * bw;
        at = row + x1;
        a = ((buf[at] >>> 24) & 255) + add;
        buf[at] = (LE ? ((a > 255 ? 255 : a) << 24) : (a > 255 ? 255 : a)) | col;
        at = r1 + x;
        a = ((buf[at] >>> 24) & 255) + add;
        buf[at] = (LE ? ((a > 255 ? 255 : a) << 24) : (a > 255 ? 255 : a)) | col;
        at = r1 + x1;
        a = ((buf[at] >>> 24) & 255) + add;
        buf[at] = (LE ? ((a > 255 ? 255 : a) << 24) : (a > 255 ? 255 : a)) | col;
      }
    }
    ctx.putImageData(img, 0, 0);
  };

  buildStyles();

  return {
    resize(nw, nh) {
      if (nw === w && nh === h && buf) return;
      w = Math.max(1, nw); h = Math.max(1, nh);
      const d = 1;    // see NEB_PIX: coarser than the frame, on purpose
      let W = Math.round(w * d);
      let H = Math.round(h * d);
      const over = (W * H) / NEB_PIX;
      if (over > 1) {
        const k = Math.sqrt(1 / over);
        W = Math.round(W * k); H = Math.round(H * k);
      }
      W = Math.max(16, W); H = Math.max(16, H);
      const sx = W / Math.max(1, bw);
      const sy = H / Math.max(1, bh);
      bw = W; bh = H;
      canvas.width = W;
      canvas.height = H;
      img = ctx.createImageData(W, H);
      buf = new Uint32Array(img.data.buffer);
      // carry the cloud across rather than starting it again
      for (let i = 0; i < seeded; i++) { px[i] *= sx; py[i] *= sy; }
      setCount();
    },
    set(next) {
      const was = opts.count;
      opts = { ...opts, ...next };
      buildStyles();
      if (opts.count !== was) setCount();
    },
    pointer(x, y, on) { ptrX = x; ptrY = y; ptrOn = on; },
    /* Owed rather than run here, and capped as well: a step moves tens of
       thousands of specks, so the couple of seconds the page asks for would
       lock up the frame this mounts on -- which is the frame the piece opens
       on. Paid back a step at a time, the ridges form over the first second
       or so while the page goes on answering. */
    warm(seconds) { owed = Math.min(60, Math.round(seconds / NEB_STEP)); },
    frame(dt) {
      acc += Math.min(0.05, dt);
      let n = 0;
      while (acc >= NEB_STEP && n < 2) { step(); acc -= NEB_STEP; n++; }
      if (n === 2) acc = 0;
      let extra = 0;
      if (owed > 0) { step(); owed--; extra = 1; }
      if (n > 0 || extra > 0) draw();
    },
  };
}

/* ---------- the marks: five fields that share their machinery -------------

   A warping grid, a dot lattice, a constellation, a stack of waves and a
   pixel mosaic. Adapted from Tweenly's hero backgrounds (MIT), rewritten to
   this page's own shape: no build step, no framework, driven by the loop that
   is already running rather than one of their own, and taking its colours and
   its reach from the same three swatches the other fields use.

   They are one engine rather than five because what differs between them is
   only what a mark is and how it is drawn. Everything underneath -- how far
   the pointer reaches, how hard it pushes, the rings a press sends out, the
   fixed step -- is the same in all five, and five copies of that is five
   places for one bug to hide. */
const MK_STEP = 1 / 60;
const MK_RINGS = 8;
const MK_RING_V = 620;         // px a ring grows each second
const MK_RING_LIFE = 1.1;      // seconds it lasts
const MK_RING_BAND = 90;       // how far either side of it is moved
const MK_WAVE_DX = 11;         // px between the points a wave is drawn through

function makeMarks(canvas, kind) {
  const ctx = canvas.getContext('2d', { alpha: true });
  let w = 1;
  let h = 1;
  let dpr = 1;
  let opts = { count: 0, speed: 1, pull: 160,
    calm: '#22e6ff', mid: '#8a5cff', hot: '#ff3d9a' };
  let acc = 0;
  let simTime = 0;
  let ptrX = -1e5;
  let ptrY = -1e5;
  let ptrOn = false;
  // the pointer arriving and leaving is eased, so nothing ever snaps
  let presence = 0;

  const rand = rng32(0x4b1dd1);
  let calmRgb = [34, 230, 255];
  let midRgb = [138, 92, 255];
  let hotRgb = [255, 61, 154];

  let cols = 0;
  let rows = 0;
  let sp = 1;          // lattice spacing, or the side of a mosaic cell
  let x0 = 0;
  let y0 = 0;
  let n = 0;
  let ox = null;       // lattice: where a node has been pushed to
  let oy = null;
  let vx = null;       // lattice: and how fast it is heading back
  let vy = null;
  let fx = null;       // constellation: free points
  let fy = null;
  let fvx = null;
  let fvy = null;
  let cell = null;     // mosaic: how lit each cell is
  let seedv = null;    // mosaic: its own threshold, so the edge is ragged
  let lineF = null;    // waves: two frequencies, two speeds, two phases, amp
  let lines = 0;

  const rx = new Float32Array(MK_RINGS);
  const ry = new Float32Array(MK_RINGS);
  const rr = new Float32Array(MK_RINGS);
  const rl = new Float32Array(MK_RINGS);
  let ringAt = 0;
  // the direction the last ring to touch a mark was pushing it
  let rdx = 0;
  let rdy = 0;

  const buildStyles = () => {
    calmRgb = hexToRgb(opts.calm) || calmRgb;
    midRgb = hexToRgb(opts.mid) || midRgb;
    hotRgb = hexToRgb(opts.hot) || hotRgb;
  };
  const tint = (t, a) => {
    const r = Math.round(calmRgb[0] + (midRgb[0] - calmRgb[0]) * t);
    const g = Math.round(calmRgb[1] + (midRgb[1] - calmRgb[1]) * t);
    const b = Math.round(calmRgb[2] + (midRgb[2] - calmRgb[2]) * t);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a.toFixed(3) + ')';
  };

  /* How strongly the pointer is felt at a point: one under it, nothing at the
     edge of its reach, eased between so no mark ever steps. */
  const inf = (x, y) => {
    if (presence <= 0.004) return 0;
    const dx = x - ptrX;
    const dy = y - ptrY;
    const R = opts.pull;
    const d2 = dx * dx + dy * dy;
    if (d2 >= R * R) return 0;
    const t = 1 - Math.sqrt(d2) / R;
    return t * t * (3 - 2 * t) * presence;
  };

  /* Rings carry what they pass over, so this answers with a strength and
     leaves the direction in rdx/rdy rather than building a pair per mark. */
  const rip = (x, y) => {
    let v = 0;
    rdx = 0;
    rdy = 0;
    for (let i = 0; i < MK_RINGS; i++) {
      if (rl[i] <= 0) continue;
      const dx = x - rx[i];
      const dy = y - ry[i];
      const d = Math.sqrt(dx * dx + dy * dy) || 1e-3;
      const off = Math.abs(d - rr[i]);
      if (off >= MK_RING_BAND) continue;
      const f = (1 - off / MK_RING_BAND) * rl[i];
      if (f > v) { v = f; rdx = dx / d; rdy = dy / d; }
    }
    return v;
  };

  const autoCount = () => {
    const area = w * h;
    if (kind === 'grid') return Math.round(area / 2000);
    if (kind === 'dots') return Math.round(area / 900);
    if (kind === 'web') return Math.round(area / 3400);
    if (kind === 'waves') return Math.round(h / 26);
    return Math.round(area / 700);           // mosaic
  };

  /* A count becomes a layout. For the three that sit on a lattice that means
     working a spacing back from how many marks were asked for, so the slider
     reads the same way whichever is running. */
  const layout = () => {
    const want = Math.max(4, Math.round(opts.count > 0 ? opts.count : autoCount()));
    if (kind === 'waves') {
      lines = Math.max(3, Math.min(want, 90));
      lineF = new Float32Array(lines * 7);
      for (let l = 0; l < lines; l++) {
        const at = l * 7;
        lineF[at] = 0.004 + rand() * 0.004;      // the slow wave, per px
        lineF[at + 1] = 0.009 + rand() * 0.008;  // and the quicker one
        lineF[at + 2] = 0.4 + rand() * 0.5;      // how fast each travels
        lineF[at + 3] = 0.3 + rand() * 0.6;
        lineF[at + 4] = rand() * TAU;            // and where each starts
        lineF[at + 5] = rand() * TAU;
        lineF[at + 6] = 0.5 + rand() * 0.6;      // its share of the gap
      }
      n = lines;
      return;
    }
    if (kind === 'web') {
      n = Math.max(8, Math.min(want, 3000));
      fx = new Float32Array(n);
      fy = new Float32Array(n);
      fvx = new Float32Array(n);
      fvy = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        fx[i] = rand() * w;
        fy[i] = rand() * h;
        const a = rand() * TAU;
        const v = 8 + rand() * 16;
        fvx[i] = Math.cos(a) * v;
        fvy[i] = Math.sin(a) * v;
      }
      return;
    }
    sp = Math.max(kind === 'grid' ? 16 : 7, Math.sqrt((w * h) / Math.max(1, want)));
    cols = Math.ceil(w / sp) + 1;
    rows = Math.ceil(h / sp) + 1;
    n = cols * rows;
    x0 = (w - (cols - 1) * sp) / 2;
    y0 = (h - (rows - 1) * sp) / 2;
    if (kind === 'mosaic') {
      cell = new Float32Array(n);
      seedv = new Float32Array(n);
      for (let i = 0; i < n; i++) seedv[i] = rand();
      return;
    }
    ox = new Float32Array(n);
    oy = new Float32Array(n);
    vx = new Float32Array(n);
    vy = new Float32Array(n);
  };

  /* ---- the step ---- */

  const stepRings = () => {
    for (let i = 0; i < MK_RINGS; i++) {
      if (rl[i] <= 0) continue;
      rr[i] += MK_RING_V * MK_STEP;
      rl[i] -= MK_STEP / MK_RING_LIFE;
      if (rl[i] < 0) rl[i] = 0;
    }
  };

  /* Shoved aside while the pointer is near, sprung back once it is not. The
     cap stops a node being thrown through the pointer and out the far side,
     which is what an uncapped push does at the very middle. */
  const stepLattice = () => {
    const push = opts.pull * 0.26;
    const k = 170 * MK_STEP;
    const damp = Math.exp(-13 * MK_STEP);
    /* A slow sway over the whole mesh, so it breathes rather than sitting
       perfectly still whenever the pointer is elsewhere -- which, on a page
       somebody is reading rather than playing with, is most of the time. It
       is also the only thing the speed slider has to do in these two. */
    const amb = sp * 0.2;
    const swayT = simTime * 0.55 * opts.speed;
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const at = j * cols + i;
        const x = x0 + i * sp;
        const y = y0 + j * sp;
        let tx = 0;
        let ty = 0;
        const f = inf(x, y);
        if (f > 0) {
          const dx = x - ptrX;
          const dy = y - ptrY;
          const d = Math.max(Math.sqrt(dx * dx + dy * dy), 0.5);
          const m = Math.min(f * push, d * 0.85);
          tx = (dx / d) * m;
          ty = (dy / d) * m;
        }
        tx += Math.sin(x * 0.011 + y * 0.007 + swayT) * amb;
        ty += Math.cos(x * 0.009 - y * 0.013 + swayT * 0.9) * amb;
        const r = rip(x, y);
        if (r > 0) { tx += rdx * sp * 0.9 * r; ty += rdy * sp * 0.9 * r; }
        vx[at] = (vx[at] + (tx - ox[at]) * k) * damp;
        vy[at] = (vy[at] + (ty - oy[at]) * k) * damp;
        ox[at] += vx[at] * MK_STEP;
        oy[at] += vy[at] * MK_STEP;
      }
    }
  };

  const stepWeb = () => {
    const sp8 = opts.speed;
    const push = opts.pull * 1.4;
    const wrapX = w + 40;
    const wrapY = h + 40;
    for (let i = 0; i < n; i++) {
      let x = fx[i] + fvx[i] * sp8 * MK_STEP;
      let y = fy[i] + fvy[i] * sp8 * MK_STEP;
      const f = inf(x, y);
      if (f > 0) {
        const dx = x - ptrX;
        const dy = y - ptrY;
        const d = Math.max(Math.sqrt(dx * dx + dy * dy), 0.5);
        x += (dx / d) * f * push * MK_STEP;
        y += (dy / d) * f * push * MK_STEP;
      }
      const r = rip(x, y);
      if (r > 0) { x += rdx * r * 150 * MK_STEP; y += rdy * r * 150 * MK_STEP; }
      if (x < -20) x += wrapX; else if (x > w + 20) x -= wrapX;
      if (y < -20) y += wrapY; else if (y > h + 20) y -= wrapY;
      fx[i] = x;
      fy[i] = y;
    }
  };

  const stepMosaic = () => {
    const decay = Math.exp(-MK_STEP * 2.4 * Math.max(0.2, opts.speed));
    for (let i = 0; i < n; i++) cell[i] *= decay;
    if (presence <= 0.01) return;
    const R = opts.pull;
    const c0 = Math.max(0, Math.floor((ptrX - R - x0) / sp));
    const c1 = Math.min(cols - 1, Math.ceil((ptrX + R - x0) / sp));
    const r0 = Math.max(0, Math.floor((ptrY - R - y0) / sp));
    const r1 = Math.min(rows - 1, Math.ceil((ptrY + R - y0) / sp));
    for (let j = r0; j <= r1; j++) {
      for (let i = c0; i <= c1; i++) {
        const at = j * cols + i;
        // a ragged edge rather than a clean disc of lit cells
        const lit = inf(x0 + (i + 0.5) * sp, y0 + (j + 0.5) * sp)
          * (0.55 + seedv[at] * 0.45);
        if (lit > cell[at]) cell[at] = lit;
      }
    }
  };

  const step = () => {
    simTime += MK_STEP;
    presence += ((ptrOn ? 1 : 0) - presence) * (1 - Math.exp(-MK_STEP * 7));
    stepRings();
    if (kind === 'web') stepWeb();
    else if (kind === 'mosaic') stepMosaic();
    else if (kind !== 'waves') stepLattice();
  };

  /* ---- the draw ---- */

  const drawRings = () => {
    for (let i = 0; i < MK_RINGS; i++) {
      if (rl[i] <= 0) continue;
      ctx.beginPath();
      ctx.arc(rx[i], ry[i], rr[i], 0, TAU);
      ctx.strokeStyle = 'rgba(' + hotRgb[0] + ',' + hotRgb[1] + ',' + hotRgb[2]
        + ',' + (rl[i] * 0.22).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  };

  const drawGrid = () => {
    /* Lines joining the nodes where they have ended up, which is the whole
       trick: the mesh is regular and only its corners move. */
    ctx.lineWidth = 1;
    ctx.strokeStyle = tint(0, 0.3);
    ctx.beginPath();
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const at = j * cols + i;
        const x = x0 + i * sp + ox[at];
        const y = y0 + j * sp + oy[at];
        if (i + 1 < cols) {
          const r = at + 1;
          ctx.moveTo(x, y);
          ctx.lineTo(x0 + (i + 1) * sp + ox[r], y0 + j * sp + oy[r]);
        }
        if (j + 1 < rows) {
          const b = at + cols;
          ctx.moveTo(x, y);
          ctx.lineTo(x0 + i * sp + ox[b], y0 + (j + 1) * sp + oy[b]);
        }
      }
    }
    ctx.stroke();
    // and the nodes the pointer is near, picked out over the top
    if (presence > 0.01) {
      ctx.beginPath();
      for (let j = 0; j < rows; j++) {
        for (let i = 0; i < cols; i++) {
          const at = j * cols + i;
          const f = inf(x0 + i * sp, y0 + j * sp);
          if (f <= 0.04) continue;
          const x = x0 + i * sp + ox[at];
          const y = y0 + j * sp + oy[at];
          ctx.moveTo(x + 1.6, y);
          ctx.arc(x, y, 1.6, 0, TAU);
        }
      }
      ctx.fillStyle = tint(1, 0.75 * presence);
      ctx.fill();
    }
  };

  const drawDots = () => {
    /* Two passes rather than a style per dot: the ones at rest are all the
       same colour, and only the few the pointer has reached are not. */
    ctx.beginPath();
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const at = j * cols + i;
        if (inf(x0 + i * sp, y0 + j * sp) > 0.04) continue;
        const x = x0 + i * sp + ox[at];
        const y = y0 + j * sp + oy[at];
        ctx.moveTo(x + 1.25, y);
        ctx.arc(x, y, 1.25, 0, TAU);
      }
    }
    ctx.fillStyle = tint(0, 0.42);
    ctx.fill();
    if (presence <= 0.01) return;
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const at = j * cols + i;
        const f = inf(x0 + i * sp, y0 + j * sp);
        if (f <= 0.04) continue;
        const x = x0 + i * sp + ox[at];
        const y = y0 + j * sp + oy[at];
        ctx.beginPath();
        ctx.arc(x, y, 1.25 + f * 1.7, 0, TAU);
        ctx.fillStyle = tint(f, 0.42 + f * 0.5);
        ctx.fill();
      }
    }
  };

  const drawWeb = () => {
    /* Links are every pair closer than the reach, which naively is every
       point against every other. The points go into a grid of buckets first
       and each one asks only its own bucket and the three after it, so the
       work is what is actually near rather than what might be. */
    const link = Math.max(40, opts.pull * 0.62);
    const gw = Math.max(1, Math.ceil(w / link));
    const gh = Math.max(1, Math.ceil(h / link));
    const head = new Int32Array(gw * gh).fill(-1);
    const next = new Int32Array(n).fill(-1);
    for (let i = 0; i < n; i++) {
      let cx = Math.floor(fx[i] / link);
      let cy = Math.floor(fy[i] / link);
      if (cx < 0) cx = 0; else if (cx >= gw) cx = gw - 1;
      if (cy < 0) cy = 0; else if (cy >= gh) cy = gh - 1;
      const b = cy * gw + cx;
      next[i] = head[b];
      head[b] = i;
    }
    const lim = link * link;
    ctx.lineWidth = 1;
    for (let cy = 0; cy < gh; cy++) {
      for (let cx = 0; cx < gw; cx++) {
        for (let i = head[cy * gw + cx]; i !== -1; i = next[i]) {
          for (let dy = 0; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              if (dy === 0 && dx < 0) continue;
              const nx = cx + dx;
              const ny = cy + dy;
              if (nx < 0 || ny < 0 || nx >= gw || ny >= gh) continue;
              let j = (dx === 0 && dy === 0) ? next[i] : head[ny * gw + nx];
              for (; j !== -1; j = next[j]) {
                const ddx = fx[i] - fx[j];
                const ddy = fy[i] - fy[j];
                const d2 = ddx * ddx + ddy * ddy;
                if (d2 >= lim) continue;
                const t = 1 - Math.sqrt(d2) / link;
                const near = Math.max(inf(fx[i], fy[i]), inf(fx[j], fy[j]));
                ctx.strokeStyle = tint(near, t * (0.16 + near * 0.5));
                ctx.beginPath();
                ctx.moveTo(fx[i], fy[i]);
                ctx.lineTo(fx[j], fy[j]);
                ctx.stroke();
              }
            }
          }
        }
      }
    }
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      ctx.moveTo(fx[i] + 1.5, fy[i]);
      ctx.arc(fx[i], fy[i], 1.5, 0, TAU);
    }
    ctx.fillStyle = tint(0, 0.6);
    ctx.fill();
  };

  const drawWaves = () => {
    const gap = h / lines;
    const pts = Math.ceil(w / MK_WAVE_DX) + 2;
    ctx.lineWidth = 1;
    for (let l = 0; l < lines; l++) {
      const at = l * 7;
      const base = (l + 0.5) * gap;
      const amp = gap * lineF[at + 6];
      ctx.beginPath();
      let near = 0;
      for (let k = 0; k < pts; k++) {
        const x = k * MK_WAVE_DX;
        let y = base
          + Math.sin(x * lineF[at] + simTime * lineF[at + 2] * opts.speed
            + lineF[at + 4]) * amp * 0.6
          + Math.sin(x * lineF[at + 1] + simTime * lineF[at + 3] * opts.speed
            + lineF[at + 5]) * amp * 0.4;
        const f = inf(x, y);
        if (f > near) near = f;
        // the pointer lifts a swell through whichever lines it is over
        if (f > 0) y -= f * gap * 1.9;
        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = tint(near, 0.22 + near * 0.55);
      ctx.stroke();
    }
  };

  const drawMosaic = () => {
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const e = cell[j * cols + i];
        if (e <= 0.012) continue;
        ctx.fillStyle = tint(Math.min(1, e * 1.4), Math.min(0.85, e * 0.9));
        ctx.fillRect(x0 + i * sp, y0 + j * sp, sp - 1, sp - 1);
      }
    }
  };

  const draw = () => {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    if (kind === 'grid') drawGrid();
    else if (kind === 'dots') drawDots();
    else if (kind === 'web') drawWeb();
    else if (kind === 'waves') drawWaves();
    else drawMosaic();
    drawRings();
  };

  buildStyles();

  return {
    resize(nw, nh) {
      const d = Math.min(window.devicePixelRatio || 1, 2);
      const cap = nw * nh * d * d > 4.5e6 ? Math.sqrt(4.5e6 / (nw * nh)) : d;
      if (nw === w && nh === h && cap === dpr) return;
      w = Math.max(1, nw); h = Math.max(1, nh); dpr = cap;
      canvas.width = Math.max(1, Math.round(w * dpr));
      canvas.height = Math.max(1, Math.round(h * dpr));
      layout();
    },
    set(next) {
      const was = opts.count;
      opts = { ...opts, ...next };
      buildStyles();
      if (opts.count !== was) layout();
    },
    pointer(x, y, on) { ptrX = x; ptrY = y; ptrOn = on; },
    tap(x, y) {
      rx[ringAt] = x;
      ry[ringAt] = y;
      rr[ringAt] = 0;
      rl[ringAt] = 1;
      ringAt = (ringAt + 1) % MK_RINGS;
    },
    /* A lattice and a mosaic start at rest with the pointer nowhere near, so
       running the clock forward on them changes nothing at all -- it only
       stalls the frame they are picked on, which at a lattice of twenty
       thousand dots was most of a second. Only the two that are already
       moving when you first see them are worth warming, and a fraction of a
       second is enough for either. */
    warm(seconds) {
      if (kind !== 'web' && kind !== 'waves') { draw(); return; }
      const k = Math.min(36, Math.round(seconds / MK_STEP));
      for (let s = 0; s < k; s++) step();
      draw();
    },
    frame(dt) {
      acc += Math.min(0.05, dt);
      let k = 0;
      while (acc >= MK_STEP && k < 3) { step(); acc -= MK_STEP; k++; }
      if (k === 3) acc = 0;
      if (k > 0) draw();
    },
  };
}

/* ---------- the mesh: a field of dots running to the horizon --------------

   Dots laid out on a ground plane that recedes to a horizon, rolling like a
   slow sea, with a soft hill under the pointer and rings thrown off by a
   press. Adapted from ham7a311's Wave Mesh (MIT) and fitted to this page: its
   own loop and listeners dropped in favour of the one already running, and
   its two colours widened to the three every field here shares.

   There is no 3D anything in it. A dot's height is a function of where it
   stands and what the clock says, and the depth comes from dividing by how
   far away it is -- which is all perspective is. */
const MSH_CAM = 0.62;          // how high the eye sits above the ground
const MSH_NEAR = 0.35;         // the nearest row, in those same units
const MSH_FAR = 3.4;           // and the furthest
const MSH_RINGS = 6;
const MSH_RING_LIFE = 5;       // seconds before a ring is forgotten
/* A dot standing above this is a crest. The waves alone reach about 0.185
   at their rare best, so this picks out the few real peaks; much lower and
   most of the field is a crest and the colour stops meaning anything. */
const MSH_CREST = 0.135;
const MSH_MAX = 24000;

function makeMesh(canvas) {
  const ctx = canvas.getContext('2d', { alpha: true });
  let w = 1;
  let h = 1;
  let dpr = 1;
  let f = 1;          // focal length
  let hz = 0;         // where the horizon falls on screen
  let cols = 60;
  let rows = 50;
  let hw = 1;         // half the ground's width at its far edge
  let opts = { count: 0, speed: 1, pull: 160,
    calm: '#22e6ff', mid: '#8a5cff', hot: '#ff3d9a' };
  let simTime = 0;

  /* Where the pointer is standing on the ground, and how much of it is felt.
     Both are eased: a hill that teleported would read as a glitch. */
  let pX = 0;
  let pZ = 1.4;
  let pS = 0;
  let tX = 0;
  let tZ = 1.4;
  let tS = 0;

  const rX = new Float32Array(MSH_RINGS);
  const rZ = new Float32Array(MSH_RINGS);
  const rT = new Float32Array(MSH_RINGS);
  const rOn = new Uint8Array(MSH_RINGS);
  let ringAt = 0;

  let dotRgb = [201, 214, 234];
  let hillRgb = [138, 92, 255];
  let crestRgb = [240, 179, 122];
  const buildStyles = () => {
    dotRgb = hexToRgb(opts.calm) || dotRgb;
    hillRgb = hexToRgb(opts.mid) || hillRgb;
    crestRgb = hexToRgb(opts.hot) || crestRgb;
  };

  /* How far the ground reaches sideways at its far edge: enough that the
     field still fills the frame once it has been divided down by depth. */
  const halfWidth = () => (w / 2 / f) * MSH_FAR * 1.05;

  const shape = () => {
    f = Math.max(w, h * 1.2) * 0.55;
    hz = h * 0.3;
    const auto = Math.round((w * h) / 85);
    const want = Math.max(400, Math.min(
      Math.round(opts.count > 0 ? opts.count : auto), MSH_MAX));
    /* Spaced to look square on screen rather than on the ground, which is
       what the geometric row spacing in the draw is for as well. */
    cols = Math.max(24, Math.min(260, Math.round(Math.sqrt(want * 1.06 * w / h))));
    rows = Math.max(20, Math.min(140, Math.round(want / cols)));
    hw = halfWidth();
  };

  /* The ground's height at a point: three waves that never quite line up,
     plus the hill under the pointer, plus whatever rings are still running. */
  const height = (x, z, t) => {
    let y = 0.085 * Math.sin(x * 2.2 + t * 0.7)
      + 0.07 * Math.sin(z * 2.9 - t * 0.9 + x * 0.8)
      + 0.03 * Math.sin((x + z) * 6.1 + t * 1.6);
    if (pS > 0.01) {
      const dx = x - pX;
      const dz = z - pZ;
      // reach widens the hill rather than raising it
      const s = 0.07 * (opts.pull / 160);
      y += 0.24 * pS * Math.exp(-(dx * dx + dz * dz) / s);
    }
    for (let i = 0; i < MSH_RINGS; i++) {
      if (!rOn[i]) continue;
      const age = t - rT[i];
      const dx = x - rX[i];
      const dz = z - rZ[i];
      const off = Math.sqrt(dx * dx + dz * dz) - age * 1.15;
      y += 0.2 * Math.exp(-(off * off) / 0.014) * Math.exp(-age * 0.75);
    }
    return y;
  };

  /* Which patch of ground a point on screen is standing on. Above the horizon
     there is no ground at all, so that answers nothing. */
  const ground = (sx, sy) => {
    if (sx < 0 || sy < 0 || sx > w || sy > h || sy <= hz + 4) return null;
    const z = Math.min(MSH_FAR, Math.max(MSH_NEAR, (MSH_CAM * f) / (sy - hz)));
    return { x: ((sx - w / 2) * z) / f, z };
  };

  const draw = () => {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const t = simTime;
    const hill = pS > 0.01;
    const hillS = 0.07 * (opts.pull / 160);
    for (let j = 0; j < rows; j++) {
      /* Rows step geometrically into the distance, so they land roughly
         evenly on screen instead of bunching up at the horizon. Everything
         in one row is the same size and the same distance away, so it is
         also one fill rather than a few hundred. */
      const z = MSH_FAR * Math.pow(MSH_NEAR / MSH_FAR, j / (rows - 1));
      const fog = Math.pow(1 - (z - MSH_NEAR) / (MSH_FAR - MSH_NEAR), 1.25);
      const size = Math.max(0.8, Math.min(3.2, 2.3 / z));
      const half = size / 2;
      let crests = null;
      let hills = null;
      ctx.beginPath();
      for (let i = 0; i < cols; i++) {
        const x = -hw + (i / (cols - 1)) * hw * 2;
        const sx = w / 2 + (x / z) * f;
        if (sx < -4 || sx > w + 4) continue;
        const y = height(x, z, t);
        const sy = hz + ((MSH_CAM - y) / z) * f;
        /* The hill is asked about before the crest is, because the hill
           raises what is under it by more than a crest ever reaches -- so
           the other way round every dot the pointer lifted came out as a
           crest, and the middle colour was never seen at all. */
        if (hill) {
          const dx = x - pX;
          const dz = z - pZ;
          if (dx * dx + dz * dz < hillS * 2.2) {
            if (!hills) hills = [];
            hills.push(sx, sy);
            continue;
          }
        }
        if (y > MSH_CREST) {
          if (!crests) crests = [];
          crests.push(sx, sy);
          continue;
        }
        ctx.rect(sx - half, sy - half, size, size);
      }
      ctx.fillStyle = 'rgba(' + dotRgb[0] + ',' + dotRgb[1] + ',' + dotRgb[2]
        + ',' + (0.12 + fog * 0.85).toFixed(3) + ')';
      ctx.fill();
      if (hills) {
        ctx.beginPath();
        for (let k = 0; k < hills.length; k += 2) {
          ctx.rect(hills[k] - half, hills[k + 1] - half, size, size);
        }
        ctx.fillStyle = 'rgba(' + hillRgb[0] + ',' + hillRgb[1] + ','
          + hillRgb[2] + ',' + (0.2 + fog * 0.8).toFixed(3) + ')';
        ctx.fill();
      }
      if (crests) {
        const cs = size * 1.15;
        const ch = cs / 2;
        ctx.beginPath();
        for (let k = 0; k < crests.length; k += 2) {
          ctx.rect(crests[k] - ch, crests[k + 1] - ch, cs, cs);
        }
        ctx.fillStyle = 'rgba(' + crestRgb[0] + ',' + crestRgb[1] + ','
          + crestRgb[2] + ',' + (0.2 + fog * 0.8).toFixed(3) + ')';
        ctx.fill();
      }
    }
  };

  buildStyles();

  return {
    resize(nw, nh) {
      const d = Math.min(window.devicePixelRatio || 1, 2);
      const cap = nw * nh * d * d > 4.5e6 ? Math.sqrt(4.5e6 / (nw * nh)) : d;
      if (nw === w && nh === h && cap === dpr) return;
      w = Math.max(1, nw); h = Math.max(1, nh); dpr = cap;
      canvas.width = Math.max(1, Math.round(w * dpr));
      canvas.height = Math.max(1, Math.round(h * dpr));
      shape();
    },
    set(next) {
      const was = opts.count;
      opts = { ...opts, ...next };
      buildStyles();
      if (opts.count !== was) shape();
    },
    pointer(x, y, on) {
      const g = on ? ground(x, y) : null;
      if (g) {
        tX = g.x;
        tZ = g.z;
        // the first sighting puts the hill there rather than sliding it in
        if (pS < 0.05) { pX = g.x; pZ = g.z; }
      }
      tS = g ? 1 : 0;
    },
    tap(x, y) {
      const g = ground(x, y);
      if (!g) return;
      rX[ringAt] = g.x;
      rZ[ringAt] = g.z;
      rT[ringAt] = simTime;
      rOn[ringAt] = 1;
      ringAt = (ringAt + 1) % MSH_RINGS;
    },
    warm(seconds) {
      // the sea is a function of the clock, so warming it is winding that on
      simTime += seconds;
      draw();
    },
    frame(dt) {
      const d = Math.min(0.05, dt);
      simTime += d * opts.speed;
      const ease = 1 - Math.exp(-d * 6.5);
      pX += (tX - pX) * ease;
      pZ += (tZ - pZ) * ease;
      pS += (tS - pS) * (1 - Math.exp(-d * 3.8));
      for (let i = 0; i < MSH_RINGS; i++) {
        if (rOn[i] && simTime - rT[i] > MSH_RING_LIFE) rOn[i] = 0;
      }
      draw();
    },
  };
}

  web: 'Drifting points, with a line drawn between any two near enough to '
    + 'each other, so the web keeps making and breaking itself. Reach sets '
    + 'both how far the pointer pushes and how long a link can be.',
  waves: 'A stack of lines, each on its own slow wave but drifting together '
    + 'so the stack reads as one surface. The pointer lifts a swell through '
    + 'whichever it is over.',
  mosaic: 'Cells that light where the pointer passes and fade behind it, on '
    + 'a ragged edge rather than a clean disc. Fade speed is how quickly '
    + 'they go out, so slow leaves a trail.',
  mesh: 'A ground of dots running away to a horizon and rolling like a slow '
    + 'sea, shrinking and fading with distance. The pointer raises a hill '
    + 'under wherever it is standing -- there is no ground above the '
    + 'horizon, so nothing happens up there -- and a press throws a ring off '
    + 'it that travels out across the field.',
