/* ---------- the ripple: the backdrop photo seen through moving water ----

   Rings spread from wherever the pointer last was and pull the picture about
   as they pass. It is a displacement of the texture lookup, not a drawing on
   top, so the photo itself bends -- which is the whole point, and the reason
   it wants a shader rather than a canvas trick.

   Written against plain WebGL rather than a 3D library: this is one quad with
   one fragment shader, and pulling in a whole scene graph to hold it would be
   several hundred kilobytes for nothing. If the context cannot be had, the
   factory returns null and the page simply shows the picture as it always
   did. */
const RIP_VS = [
  'attribute vec2 aPos;',
  'varying vec2 vUv;',
  'void main() {',
  '  vUv = aPos * 0.5 + 0.5;',
  '  gl_Position = vec4(aPos.x, -aPos.y, 0.0, 1.0);',
  '}',
].join('\n');

const RIP_FS = [
  'precision mediump float;',
  'uniform sampler2D uTex;',
  'uniform vec2 uCentre;',   // where the rings come from, 0..1 across the photo
  'uniform vec2 uAspect;',   // makes the rings round on a photo that is not
  'uniform float uTime;',
  'uniform float uFreq;',
  'uniform float uAmp;',
  'uniform float uSpeed;',
  'varying vec2 vUv;',
  'void main() {',
  '  vec2 d = (vUv - uCentre) * uAspect;',
  '  float r = length(d);',
  /* Dividing by the distance, as the usual form of this does, makes the
     point under the pointer move by amplitude/0.12 -- eight times what was
     asked for -- and on a portrait that is not a ripple, it is a hole where
     the face was. Falling away from a peak instead means depth is the
     furthest the picture actually moves, which is also the only reading of
     that slider anyone could predict. */
  '  float wave = sin(r * uFreq - uTime * uSpeed) * uAmp / (1.0 + r * 6.0);',
  '  vec2 dir = r > 1e-4 ? d / r : vec2(0.0);',
  '  vec2 uv = vUv + (dir / uAspect) * wave;',
  '  gl_FragColor = texture2D(uTex, clamp(uv, 0.0, 1.0));',
  '}',
].join('\n');

function makeRipple(canvas) {
  let gl = null;
  try {
    gl = canvas.getContext('webgl', {
      alpha: true, premultipliedAlpha: true, antialias: false,
      depth: false, stencil: false, preserveDrawingBuffer: false,
    }) || canvas.getContext('experimental-webgl');
  } catch (e) { gl = null; }
  if (!gl) return null;

  const compile = (type, src) => {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { gl.deleteShader(sh); return null; }
    return sh;
  };
  const vs = compile(gl.VERTEX_SHADER, RIP_VS);
  const fs = compile(gl.FRAGMENT_SHADER, RIP_FS);
  if (!vs || !fs) return null;
  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return null;
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER,
    new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  ['uTex', 'uCentre', 'uAspect', 'uTime', 'uFreq', 'uAmp', 'uSpeed']
    .forEach((k) => { U[k] = gl.getUniformLocation(prog, k); });

  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  /* the photo is any size at all, so no mipmaps and no wrapping: WebGL 1
     refuses both on a texture whose sides are not powers of two */
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.uniform1i(U.uTex, 0);

  let haveTex = false;
  let iw = 1;
  let ih = 1;
  let vw = 0;
  let vh = 0;
  let t = 0;
  let cu = 0.5;
  let cv = 0.5;
  let opts = { freq: 30, amp: 0.02, speed: 5 };
  // the photo's placement, so a pointer on the stage can be read in its space
  let geo = { cw: 1, ch: 1, ew: 1, eh: 1, rot: 0, x: 0, y: 0 };

  const setViewport = () => {
    const want = Math.max(1, Math.round(canvas.clientWidth || 0));
    if (!want || !haveTex) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    // never more pixels than the photo itself holds, nor than a frame can pay
    let W = Math.min(Math.round(want * dpr), iw);
    const cap = Math.sqrt(4.5e6 / Math.max(1, (W * W * ih) / iw));
    if (cap < 1) W = Math.round(W * cap);
    W = Math.max(16, W);
    const H = Math.max(16, Math.round((W * ih) / iw));
    if (W === vw && H === vh) return;
    vw = W; vh = H;
    canvas.width = W;
    canvas.height = H;
    gl.viewport(0, 0, W, H);
  };

  return {
    setImage(img) {
      if (!img || !img.naturalWidth) { haveTex = false; return false; }
      iw = img.naturalWidth;
      ih = img.naturalHeight;
      gl.bindTexture(gl.TEXTURE_2D, tex);
      try {
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      } catch (e) { haveTex = false; return false; }
      haveTex = true;
      vw = 0; vh = 0;
      setViewport();
      return true;
    },
    /* Where the photo sits on the stage, which is the only way a pointer in
       stage coordinates can be turned into a point on the photo once it has
       been moved, scaled and turned. */
    layout(next) { geo = { ...geo, ...next }; setViewport(); },
    set(next) { opts = { ...opts, ...next }; },
    pointer(px, py) {
      // the photo's centre on the stage: x and y are a share of its own size,
      // exactly as the transform that places it reads them
      const qx = px - (geo.cw * 0.5 + (geo.ew * geo.x) / 100);
      const qy = py - (geo.ch * 0.5 + (geo.eh * geo.y) / 100);
      const a = (-geo.rot * Math.PI) / 180;
      const ca = Math.cos(a);
      const sa = Math.sin(a);
      const lx = qx * ca - qy * sa;
      const ly = qx * sa + qy * ca;
      cu = lx / (geo.ew || 1) + 0.5;
      cv = ly / (geo.eh || 1) + 0.5;
    },
    frame(dt) {
      if (!haveTex) return;
      setViewport();
      t += Math.min(0.05, dt);
      gl.useProgram(prog);
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.uniform2f(U.uCentre, cu, cv);
      const ar = iw / ih;
      gl.uniform2f(U.uAspect, ar >= 1 ? ar : 1, ar >= 1 ? 1 : 1 / ar);
      gl.uniform1f(U.uTime, t);
      gl.uniform1f(U.uFreq, opts.freq);
      gl.uniform1f(U.uAmp, opts.amp);
      gl.uniform1f(U.uSpeed, opts.speed);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    },
    dispose() {
      try {
        gl.deleteTexture(tex);
        gl.deleteBuffer(buf);
        gl.deleteProgram(prog);
        const lose = gl.getExtension('WEBGL_lose_context');
        if (lose) lose.loseContext();
      } catch (e) { /* the context may already be gone */ }
    },
  };
}

const DEFAULT_BG = {
  kind: 'default', color: '#16203a', id: null, url: '', dim: 0.35,
  opacity: 1,  // the backdrop picture's own strength, as a stacked one has
  /* The flowing field is an addition, not one of the kinds: it layers under
     the backdrop picture, so a cut-out subject can stand in front of it while
     the flat color still shows through both. */
  flow: false,
  /* which field: 'field' is the drifting fluid, 'gateway' the tracks that
     converge on the middle of the frame */
  flowKind: 'field',
  /* the backdrop photo seen through moving water, rings spreading from
     wherever the pointer last was */
  ripple: false,
  rippleFreq: 30, rippleAmp: 0.02, rippleSpeed: 5,
  // its own strength, so Backdrop dim never speaks for it
  flowOpacity: 1,
  // 0 lines means "work it out from the frame size"
  flowCount: 0, flowSpeed: 1, flowPull: 64,
  calm: '#22e6ff', mid: '#8a5cff', hot: '#ff3d9a',
  x: 0,        // % of stage width from centre
  y: 0,        // % of stage height from centre
  size: 100,   // width as a % of the stage

/* Older saves positioned it as a cover background (x/y 0-100, scale). */
const normaliseBg = (raw) => {
  const b = { ...DEFAULT_BG, ...(raw || {}) };
  if (typeof raw?.size !== 'number') {
    b.size = typeof raw?.scale === 'number' ? Math.round(raw.scale * 100) : 100;
    b.x = typeof raw?.x === 'number' ? raw.x - 50 : 0;
    b.y = typeof raw?.y === 'number' ? raw.y - 50 : 0;
  }
  if (typeof b.rot !== 'number') b.rot = 0;
  if (typeof b.opacity !== 'number' || !isFinite(b.opacity)) b.opacity = 1;
  b.opacity = Math.max(0.05, Math.min(1, b.opacity));
  const n = (v, d, lo, hi) => (typeof v === 'number' && isFinite(v)
    ? Math.max(lo, Math.min(v, hi)) : d);
  b.flow = !!b.flow;
  b.flowKind = FLOW_KEYS.indexOf(b.flowKind) >= 0 ? b.flowKind : 'field';
  b.ripple = !!b.ripple;
  b.rippleFreq = n(b.rippleFreq, 30, 2, 120);
  b.rippleAmp = n(b.rippleAmp, 0.02, 0, 0.15);
  b.rippleSpeed = n(b.rippleSpeed, 5, 0, 20);
  b.flowOpacity = n(b.flowOpacity, 1, 0.05, 1);
  b.flowCount = n(b.flowCount, 0, 0, 4200);
  b.flowSpeed = n(b.flowSpeed, 1, 0.05, 4);
  b.flowPull = n(b.flowPull, 64, 8, 320);
  BG_HEX.forEach((k) => {
    if (!/^#[0-9a-f]{6}$/i.test(String(b[k]))) b[k] = DEFAULT_BG[k];
  });
  return b;
};
const BG_KINDS = [['default', 'Gradient'], ['color', 'Color'], ['image', 'Image']];

/* Everything a backdrop is, in one place. Saving, exporting and the per-size
   snapshot all went through their own hand-written field lists, so a new
   setting had to be remembered three times -- and opacity was already missed
   once that way. */
const bgOutOf = (b) => {
  const out = { kind: b.kind, id: b.id || null, flow: !!b.flow,
    flowKind: FLOW_KEYS.indexOf(b.flowKind) >= 0 ? b.flowKind : 'field',
    ripple: !!b.ripple };
  BG_NUM.forEach((k) => { out[k] = b[k]; });
  BG_HEX.forEach((k) => { out[k] = b[k]; });
  return out;
};

/* A stacked picture. Like the backdrop, its placement can differ per size --
   see layerSnap below. What does NOT differ is WHICH pictures exist: that is
   one list for the whole piece, because a different set of pictures at every
   width is bookkeeping nobody wants. A size can still hide one it does not
   want, which covers the same ground without the mess. */
const DEFAULT_LAYER = {
  id: null, url: '', name: 'picture',
  z: 10,           // its level in the scene -- see Z_MARKS
  depth: 'back',   // kept in step with z, so an older copy of this page copes
  x: 0, y: 0, size: 100, rot: 0, opacity: 1,
  dim: 0,          // a veil laid at this picture's own level
  show: true,      // kept in the folder but off the stage
};

/* The scene's own pieces, by level. They are spaced so a picture can be
   slotted between any two of them, which is the whole point of the number:
   "behind the cards" and "over everything" were only ever two of the places
   a picture might want to be. Must match the z-index values in the CSS. */
const Z_CARDS = 20;
const Z_VIGNETTE = 30;
const Z_WORDS = 50;
const Z_MENU = 60;
/* The backdrop's COLOUR is the floor -- there is nothing to put under a flat
   fill. Its PICTURE is a step up from that, with room between the two, which
   is where a picture goes when the backdrop is a cut-out on a transparent
   background and you want something other than the color showing through. */
const Z_FLOW = 2;
const Z_BGPIC = 5;
const Z_MIN = 1;         // 0 is the backdrop color
const Z_MAX = 69;        // 70 is the message shown while waiting on a folder
const Z_MARKS = [
  [3, 'Behind the backdrop picture'],
  [10, 'Behind the cards'],
  [25, 'Over the cards'],
  [40, 'Over the vignette'],
  [55, 'Over the messages'],
];
/* Everywhere a picture is worth stopping as you step it back or forward:
   the landmarks above, plus the very front. Stepping walks these, so the
   buttons move a picture through the scene even when it is the only one. */
const Z_STOPS = Z_MARKS.map(([z]) => z).concat([65]);
/* What a level lands on, said in the scene's own terms, so the number in the
   panel is never a number the author has to guess the meaning of. */
const zWhere = (z) => (
  z < Z_FLOW ? 'over the backdrop color, behind the flow'
    : z < Z_BGPIC ? 'over the backdrop color, behind the backdrop picture'
    : z < Z_CARDS ? 'over the backdrop, behind the cards'
    : z < Z_VIGNETTE ? 'over the cards, behind the vignette'
      : z < Z_WORDS ? 'over the cards and the vignette, behind the messages'
        : z < Z_MENU ? 'over the messages, behind the menu'
          : 'over everything'
);
const zDepth = (z) => (z < Z_CARDS ? 'back' : 'front');

/* The pieces of the scene, as rows in the stack list. They cannot be dragged
   -- their order is what the piece IS -- but a picture can be dropped above or
   below any of them. The backdrop appears as two rows when it has a picture,
   because then there is a real place between them to drop something. */
/* Every fixed row stands for something with settings somewhere else in the
   panel. Showing them in the stack without saying where to edit them was
   half an answer: the row looks like a layer, so it should behave like one
   to the extent of taking you to its own controls. */
const SCENE_ROW_GO = {
  'Menu': { tab: 'Words', fold: 'menu' },
  'Messages': { tab: 'Words', fold: 'messages' },
  'Vignette': { tab: 'Scene', fold: 'finish' },
  'Cards': { tab: 'Cards' },
  'Backdrop': { tab: 'Scene', fold: 'backdrop' },
  'Backdrop picture': { tab: 'Scene', fold: 'backdrop' },
  'Flow': { tab: 'Scene', fold: 'backdrop' },
  'Backdrop color': { tab: 'Scene', fold: 'backdrop' },
};

const sceneRows = (hasPic, hasFlow) => {
  const rows = [
    [Z_MENU, 'Menu'],
    [Z_WORDS, 'Messages'],
    [Z_VIGNETTE, 'Vignette'],
    [Z_CARDS, 'Cards'],
  ];
  if (hasPic) rows.push([Z_BGPIC, 'Backdrop picture']);
  if (hasFlow) rows.push([Z_FLOW, 'Flow']);
  // the colour is only worth naming apart when something sits above it
  rows.push([0, (hasPic || hasFlow) ? 'Backdrop color' : 'Backdrop']);
  return rows;
};

const LAYER_NUM = ['x', 'y', 'size', 'rot', 'opacity', 'z', 'dim'];
const normaliseLayer = (raw, i) => {
  const l = { ...DEFAULT_LAYER, ...(raw || {}) };
  /* A save made before levels existed carries only back/front. Those two
     words meant exactly two levels: just under the cards, and just over the
     vignette but under the messages. Map them there and nothing moves. */
  if (typeof raw?.z !== 'number' || !isFinite(raw.z)) {
    l.z = raw?.depth === 'front' ? 40 : 10;
  }
  LAYER_NUM.forEach((k) => {
    if (typeof l[k] !== 'number' || !isFinite(l[k])) l[k] = DEFAULT_LAYER[k];
  });
  /* A picture saved under the backdrop, from when there was room under it,
     comes back to the band it would have had by default -- rather than to
     level 1, where it would be visible but at a level nobody chose. */
  l.z = Math.round(l.z) < Z_MIN ? 10 : Math.round(l.z);
  l.z = Math.max(Z_MIN, Math.min(Z_MAX, l.z));
  l.dim = Math.max(0, Math.min(0.9, l.dim));
  l.depth = zDepth(l.z);
  l.name = String(l.name || 'picture');
  l.show = l.show !== false;
  l.key = l.key || `${l.id || 'local'}:${i}`;
  return l;
};

/* What a size remembers about each picture. Keyed by the picture rather than
   by its place in the list, so reordering the stack does not shuffle which
   size remembers what -- which is why `key` is persisted with the layer. */
const LAYER_SNAP = ['z', 'x', 'y', 'size', 'rot', 'opacity', 'dim'];
/* z and show are deliberately left out of the glide. A z-index has to be a
   whole number -- a fractional one is invalid, the declaration is dropped,
   and the whole stack collapses to auto halfway through a resize. Both snap
   at the midpoint instead. */
const LAYER_BLEND = ['x', 'y', 'size', 'rot', 'opacity', 'dim'];

const layerSnap = (list) => {
  const out = {};
  (list || []).forEach((l) => {
    const row = {};
    LAYER_SNAP.forEach((k) => { row[k] = l[k]; });
    row.show = !!l.show;
    out[l.key] = row;
  });
  return out;
};

const applyLayerSnapshot = (list, snap) => {
  if (!snap) return list;
  let changed = false;
  const next = list.map((l) => {
    const row = snap[l.key];
    if (!row) return l;
    const m = { ...l };
    let hit = false;
    LAYER_SNAP.forEach((k) => {
      if (typeof row[k] !== 'number') return;
      const v = k === 'z' ? Math.round(row[k]) : row[k];
      if (Math.abs((typeof l[k] === 'number' ? l[k] : 0) - v) > 1e-4) { m[k] = v; hit = true; }
    });
    if (typeof row.show === 'boolean' && row.show !== l.show) { m.show = row.show; hit = true; }
    if (!hit) return l;
    m.depth = zDepth(m.z);
    changed = true;
    return m;
  });
  return changed ? next.sort((a, b) => a.z - b.z) : list;
};

const blendLayerSnaps = (a, b, t) => {
  if (!a) return b;
  if (!b) return a;
  const out = {};
  const near = t < 0.5 ? a : b;
  Object.keys(a).concat(Object.keys(b)).forEach((k) => {
    if (out[k]) return;
    const x = a[k];
    const y = b[k];
    if (!x || !y) { out[k] = x || y; return; }
    const row = {};
    LAYER_BLEND.forEach((n) => {
      row[n] = (typeof x[n] === 'number' && typeof y[n] === 'number')
        ? lerp(x[n], y[n], t)
        : (typeof y[n] === 'number' ? y[n] : x[n]);
    });
    row.z = (near[k] || x).z;
    row.show = (near[k] || x).show;
    out[k] = row;
  });
  return out;
};

/* The faces a message can be set in. Sora carries weight, so it is the one

};

  m.place = m.place === 'bottom' ? 'bottom' : 'top';
  if (['start', 'center', 'end', 'split'].indexOf(m.align) < 0) m.align = 'split';
  m.brand = String(m.brand || '').slice(0, 28);
  m.color = /^#[0-9a-f]{6}$/i.test(String(m.color)) ? m.color : DEFAULT_MENU.color;
  m.items = (Array.isArray(m.items) ? m.items : []).slice(0, MENU_MAX).map((it, i) => ({
    label: String((it && it.label) || '').slice(0, 24),
    card: typeof (it && it.card) === 'number' && isFinite(it.card)
      ? Math.max(0, Math.round(it.card)) : 0,
    key: (it && it.key) || `m${i}-${Math.random().toString(36).slice(2, 7)}`,
  }));
  return m;
};

/* A named group of controls inside a tab. Open state is remembered for the
   session, so switching tabs and coming back does not shut everything you
   had open. Declared out here so React keeps the same element across renders
   rather than remounting it and losing the caret in a field. */
const FOLD_STATE = {};
function Fold({ id, title, start, children }) {
  const [open, setOpen] = useState(() => (id in FOLD_STATE ? FOLD_STATE[id] : !!start));
  return (
    <details className="fold" data-fold={id} open={open}
             onToggle={(e) => { FOLD_STATE[id] = e.currentTarget.open; setOpen(e.currentTarget.open); }}>
      <summary>{title}</summary>
      <div className="inner">{children}</div>
    </details>
  );
}

/* A record of what the page waited for on the way in, shown at the foot of
   the Data tab. Guessing at this from the outside has cost more than it ever
   saved: the page can simply say. */
const BOOT = [];
const mark = (name) => {
  if (BOOT.length < 12) BOOT.push(`${name} ${Math.round(performance.now())}`);
};

function CardRiver() {
  const worldRef = useRef(null);
  const cardRefs = useRef([]);
  const artRefs = useRef([]);
  const sheenRefs = useRef([]);

  // a bare token in the link picks a preset, e.g. .../card-river#slab
  const opening = useMemo(() => {
    const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
    let token = '';
    try { token = slug((location.hash || '').slice(1)); } catch (e) { /* ignore */ }
    const hit = token && Object.keys(PRESETS).find((k) => slug(k) === token);
    // a link that names a preset wins over whatever was last left on screen
    return { name: hit || OPENING, fromHash: !!token };
  }, []);

  const [params, setParams] = useState(() => PRESETS[opening.name]);
  const [preset, setPreset] = useState(opening.name);
  const [hydrated, setHydrated] = useState(false);
  const [userPresets, setUserPresets] = useState([]);
  const [presetName, setPresetName] = useState('');
  const [presetMsg, setPresetMsg] = useState('');
  const userPresetsRef = useRef(userPresets);
  userPresetsRef.current = userPresets;
  const [showUI, setShowUI] = useState(false);
  const [tab, setTab] = useState(() => {
    try {
      const t = localStorage.getItem('cardriver.tab');
      return TABS.indexOf(t) >= 0 ? t : 'Cards';
    } catch (e) { return 'Cards'; }
  });
  const pickTab = (t) => {
    setTab(t);
    try { localStorage.setItem('cardriver.tab', t); } catch (e) { /* private window */ }
  };

  const P = useRef(params);
  P.current = params;
  const progress = useRef(0);
  const dims = useRef({ cardW: 0, cardH: 0, perspPx: 0, ampY: 0, ampZ: 0, slot: 0 });
  const drag = useRef({ active: false, lastX: 0, lastY: 0, vel: 0 });
  // where a menu link is steering the river, or null when nothing is
  const glide = useRef(null);
  /* How much of the river is running: 1 turning, 0 held. */
  const riverRun = useRef(1);

  // deck: the viewer's own cards. Empty means the sample art stands in.
  // forward declaration: the stop writer is defined further down, and the
  // backdrop handlers above it need to reach it
  const writeStopRef = useRef(null);
  // what the last "use on all sizes" press did, shown under that button
  const [spread, setSpread] = useState(null);
  const spreadTimer = useRef(null);
  const writeStop = (patch, only, everySize) => {
    if (writeStopRef.current) writeStopRef.current(patch, only, everySize);
  };

  const [deck, setDeck] = useState([]);
  const [caps, setCaps] = useState({ assets: null, db: null, downloads: null, ready: false });
  const [busy, setBusy] = useState('');
  const [dropping, setDropping] = useState(false);
  const capsRef = useRef(caps);
  capsRef.current = caps;
  const deckRef = useRef(deck);
  deckRef.current = deck;

  // backdrop: the built-in gradient, a flat color, or an uploaded image
  const [bg, setBg] = useState(DEFAULT_BG);
  const bgRef = useRef(bg);
  bgRef.current = bg;
  const backRef = useRef(null);
  const bgElRef = useRef(null);
  const rippleElRef = useRef(null);
  const rippleRef = useRef(null);
  const layoutRippleRef = useRef(null);
  /* Only true once the shader is up AND the photo is in it. Until then the
     plain <img> stays showing, so a browser without WebGL, or a picture that
     will not upload as a texture, loses the effect and nothing else. */
  const [rippleLive, setRippleLive] = useState(false);

  // pictures stacked behind or in front of the cards
  const [layers, setLayers] = useState([]);
  const layersRef = useRef(layers);
  layersRef.current = layers;
  /* The key of the picture the sliders edit, not its place in the list: the
     list is re-ordered whenever a level changes, and an index would quietly
     start pointing at a different picture mid-drag. */
  const [laySel, setLaySel] = useState(null);
  const selAt = laySel === null ? -1 : layers.findIndex((l) => l.key === laySel);
  const selLayer = selAt < 0 ? null : layers[selAt];
  /* Whether the backdrop has a picture decides both how it is drawn and how
     many rows it takes in the stack, so it is worked out once. */
  /* An image whose file has resolved, or the flowing field. Both occupy the
     backdrop-picture slot, so both put a row in the stack and open the gap
     underneath it; only the image has framing to adjust. */
  const flowElRef = useRef(null);
  const flowRef = useRef(null);
  const hasBgImage = bg.kind === 'image' && !!srcFor(bg);
  const bgSrc = srcFor(bg);
  const wantRipple = hasBgImage && !!bg.ripple;
  const hasFlow = !!bg.flow;
  const flowKind = FLOW_KEYS.indexOf(bg.flowKind) >= 0 ? bg.flowKind : 'field';
  const hasBgPic = hasBgImage;
  const [dragKey, setDragKey] = useState(null);   // the picture being dragged
  const [overGap, setOverGap] = useState(null);   // the strip it is over

  // messages over the river, and the menu
  const [heads, setHeads] = useState([]);
  const headsRef = useRef(heads);
  headsRef.current = heads;
  const headElRefs = useRef([]);
  const [headSel, setHeadSel] = useState(null);
  const [menu, setMenu] = useState(DEFAULT_MENU);
  const menuRef = useRef(menu);
  menuRef.current = menu;
  const [scene, setScene] = useState(DEFAULT_SCENE);
  const sceneRef = useRef(scene);
  sceneRef.current = scene;

  /* The opening fade runs once, on the way in. It is taken off again a beat
     after it finishes so that nothing later -- a picture swapped, a size
     resolving -- replays it, and so the author can set it off again from the
     panel without reloading. */
  const [introRun, setIntroRun] = useState(0);
  const intro = introRun > 0;
  /* Restarting a CSS animation means taking the class off, letting the
     browser notice, and putting it back. Reading a layout property is what
     makes it notice. Waiting a frame would work too, until the page is in a
     tab nobody is looking at -- those stop being handed frames, and then the
     opening would simply never play. */
  const playIntro = useCallback(() => {
    const el = worldRef.current;
    if (el && el.classList.contains('intro')) {
      el.classList.remove('intro');
      void el.offsetWidth;
      el.classList.add('intro');
    }
    setIntroRun((r) => r + 1);
  }, []);
  useEffect(() => {
    if (!introRun) return undefined;
    // long enough for the last thing in to finish, whatever delay it was given
    const t = setTimeout(() => setIntroRun(0),
      INTRO_LONGEST(sceneRef.current) * 1000 + 1600);
    return () => clearTimeout(t);
  }, [introRun]);

  /* Held back until the saved piece is here: the state, and off disk the
     pictures too, since cards with nothing in them are their own kind of
     wrong first impression. The cap is the backstop for a store that never
     answers at all -- it then shows the sample art, as the page always used
     to, rather than nothing. It should not be what ends the wait. */
  const [revealed, setRevealed] = useState(false);
  const introDone = useRef(false);
  /* Showing the piece and starting the opening have to happen in the same
     render. Let one go by in between and it appears at full strength for a
     frame and only then begins fading up from nothing. */
  const reveal = useCallback(() => {
    mark('shown');
    setRevealed(true);
    if (introDone.current) return;
    introDone.current = true;
    if (sceneRef.current.intro) setIntroRun((r) => r + 1);
  }, []);
  /* A folder that is only waiting to be reconnected hands the page no
     storage, which from in here is indistinguishable from having none -- so
     the page used to decide there was nothing to load and run the sample
     river, in full, until the folder was reconnected. That is the wrong
     thing to show and it is not a wait that times out, so nothing is drawn
     and the stage says what it is waiting for instead. */
  const waitingFor = typeof window !== 'undefined'
    && (window.__folderState === 'reconnect' || window.__folderState === 'pick')
    ? window.__folderState : null;

  useEffect(() => {
    if (revealed || waitingFor) return undefined;
    const cap = setTimeout(() => { mark('gave up'); reveal(); }, 6000);
    return () => clearTimeout(cap);
  }, [revealed, reveal, waitingFor]);

  /* Two passes, because the pictures arrive in two steps and both have to be
     done before anything is shown. First the folder hands over its urls --
     which only makes the <img> tags point somewhere, and takes a render to
     reach them. Then the browser has to actually decode what they point at;
     skip that and the opening fades up over a set of empty cards. */
  const [artPass, setArtPass] = useState(0);
  useEffect(() => {
    if (!hydrated || revealed || waitingFor || artPass) return undefined;
    let alive = true;
    if (window.__assetsPending && window.__onAssetsReady) {
      window.__onAssetsReady(() => { if (alive) { mark('pictures'); setArtPass(1); } });
    } else {
      mark('pictures');
      setArtPass(1);
    }
    return () => { alive = false; };
  }, [hydrated, revealed, waitingFor, artPass]);

  useEffect(() => {
    if (artPass !== 1 || revealed) return undefined;
    let alive = true;
    const imgs = Array.from(document.querySelectorAll('.card-art img, .bg-el, .layer-el'));
    const decoded = Promise.all(imgs.map((i) => (
      i.decode ? i.decode().catch(() => {}) : Promise.resolve()
    )));
    // a picture that will never decode must not hold the page for ever
    Promise.race([decoded, new Promise((r) => { setTimeout(r, 2500); })])
      .then(() => { if (alive) { mark(`art x${imgs.length}`); reveal(); } });
    return () => { alive = false; };
  }, [artPass, revealed, reveal]);

  const n = deck.length || SAMPLE_SLOTS;

  // resolve the storage capabilities, then load any deck saved with the artifact
  useEffect(() => {
    let alive = true;
    (async () => {
      const use = window.claude && window.claude.use;
      const get = async (name) => {
        if (!use) return null;
        try { return await window.claude.use(name); } catch (e) { return null; }
      };
      // together, not one after another: each can take its own time, and
      // waiting on them in turn adds those times up for no reason
      const [assets, db, downloads] = await Promise.all([
        get('assets'), get('db'), get('downloads'),
      ]);
      if (!alive) return;
      mark(`storage ${db ? 'yes' : 'no'}`);
      setCaps({ assets, db, downloads, ready: true });
      if (!db) { setHydrated(true); mark('nothing to load'); return; }
      try {
        const snap = await db.doc('deck/current').get();
        const items = snap.exists ? snap.data().items : null;
        if (alive && Array.isArray(items) && items.length) {
          setDeck(items.map((it, i) => ({
            id: it.id, name: it.name || 'card', kind: it.kind === 'video' ? 'video' : 'image',
            fh: !!it.fh, fv: !!it.fv,
            // through srcFor, not a hardcoded /_blob/ path: that route only
            // exists on the artifact host, so off disk every card came back
            // dead while the backdrop -- which already resolved properly --
            // loaded fine
            url: srcFor({ id: it.id, url: '' }), key: it.id + ':' + i,
          })));
        }
      } catch (e) { /* nothing saved yet, or no read access -- sample art stands */ }
      try {
        const snap = await db.doc('deck/background').get();
        const saved = snap.exists ? snap.data() : null;
        if (alive && saved && saved.kind) {
          setBg(normaliseBg({
            ...saved,
            id: saved.id || null,
            url: saved.id ? srcFor({ id: saved.id, url: '' }) : '',
          }));
        }
      } catch (e) { /* no backdrop saved -- the built-in gradient stands */ }
      try {
        const snap = await db.doc('deck/layers').get();
        const items = snap.exists ? snap.data().items : null;
        if (alive && Array.isArray(items) && items.length) {
          setLayers(items.map((l, i) => normaliseLayer({
            ...l, url: l.id ? srcFor({ id: l.id, url: '' }) : '',
          }, i)));
        }
      } catch (e) { /* nothing stacked */ }
      try {
        const snap = await db.doc('deck/words').get();
        const saved = snap.exists ? snap.data() : null;
        if (alive && saved) {
          if (Array.isArray(saved.headlines)) {
            setHeads(saved.headlines.slice(0, HEAD_MAX).map(normaliseHead));
          }
          if (saved.menu) setMenu(normaliseMenu(saved.menu));
          if (saved.scene) setScene(normaliseScene(saved.scene));
        }
      } catch (e) { /* no words yet */ }
      try {
        const snap = await db.doc('deck/presets').get();
        const items = snap.exists ? snap.data().items : null;
        if (alive && Array.isArray(items) && items.length) {
          setUserPresets(items);
          // a saved preset can be opened straight from the link too
          const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
          let token = '';
          try { token = slug((location.hash || '').slice(1)); } catch (e2) { /* ignore */ }
          const hit = token && items.find((p) => slug(p.name) === token);
          if (hit) { setPreset(hit.name); setParams({ ...DEFAULTS, ...hit.params }); }
        }
      } catch (e) { /* no saved presets yet */ }
      try {
        const snap = await db.doc('deck/breakpoints').get();
        const items = snap.exists ? snap.data().items : null;
        if (alive && Array.isArray(items)) setBps(items.slice().sort((a, b) => a.w - b.w));
        if (alive && snap.exists && typeof snap.data().fluid === 'boolean') setFluid(snap.data().fluid);
      } catch (e) { /* none defined */ }
      try {
        if (!opening.fromHash) {
          const snap = await db.doc('deck/state').get();
          const saved = snap.exists ? snap.data() : null;
          if (alive && saved && saved.params) {
            setParams({ ...DEFAULTS, ...saved.params });
            setPreset(saved.preset || null);
          }
        }
      } catch (e) { /* nothing left on screen last time */ }
      if (alive) { mark('state'); setHydrated(true); }
    })();
    return () => { alive = false; };
  }, [opening]);

  // keep the live sliders in the store, one write per pause rather than per drag
  useEffect(() => {
    if (!hydrated) return undefined;
    const t = setTimeout(() => {
      const db = capsRef.current.db;
      if (!db) return;
      db.doc('deck/state').set({ preset: preset || '', params }).catch(() => {});
    }, 600);
    return () => clearTimeout(t);
  }, [params, preset, hydrated]);

  // paint the backdrop whenever it changes
  useEffect(() => {
    const back = backRef.current;
    const world = worldRef.current;
    if (!back || !world) return;
    // the color always underlies the image, so it shows through transparency
    // and stands in while no image is chosen
    back.style.backgroundColor = bg.kind === 'default' ? 'transparent' : bg.color;
    world.style.setProperty('--bgdim', bg.kind === 'default' ? 0 : bg.dim);
    /* The floor under the whole page. Matching it to the backdrop means the
       held frame and the opening fade are already the right color instead of
       fading up out of something else. */
    world.style.setProperty('--page', bg.kind === 'default' ? '#05070d' : bg.color);
    /* The image's own size and position are NOT set here. They used to be,
       through bgElRef -- and off disk that ref is empty when this runs,
       because the picture cannot be resolved until the folder has been read,
       so the <img> mounts a beat later and this never fires again for it.
       The backdrop then drew at its natural size with its top-left corner at
       the middle of the stage, and stayed there until any resize happened to
       re-resolve a size and change `bg`. It is written in the markup now, so
       it is right on the frame the picture first appears. */
  }, [bg]);

  /* The engine belongs to the canvas, so it is built when that mounts and
     dropped when it goes. It is never given a loop of its own: the page
     already runs one, and two would drift apart. */
  useEffect(() => {
    const el = flowElRef.current;
    if (!hasFlow || !el) { flowRef.current = null; return undefined; }
    const eng = FLOW_MAKE[flowKind](el);
    const world = worldRef.current;
    eng.resize(world ? world.clientWidth : 1, world ? world.clientHeight : 1);
    const b = bgRef.current;
    eng.set({ count: b.flowCount, speed: b.flowSpeed, pull: b.flowPull,
      calm: b.calm, mid: b.mid, hot: b.hot });
    // a cold field reads as a blank sheet filling in, so it starts warm
    eng.warm(2.5);
    flowRef.current = eng;
    return () => { flowRef.current = null; };
  }, [hasFlow, flowKind]);

  /* The shader belongs to its canvas, and the picture belongs to the shader,
     so both the canvas mounting and the source changing rebuild it. */
  useEffect(() => {
    const el = rippleElRef.current;
    if (!wantRipple || !el) { rippleRef.current = null; setRippleLive(false); return undefined; }
    const eng = makeRipple(el);
    if (!eng) { rippleRef.current = null; setRippleLive(false); return undefined; }
    rippleRef.current = eng;
    const img = bgElRef.current;
    const take = () => {
      const ok = eng.setImage(bgElRef.current);
      setRippleLive(ok);
      if (ok && layoutRippleRef.current) layoutRippleRef.current();
    };
    // off disk the picture is resolved late, so this often mounts before it
    if (img && img.complete && img.naturalWidth) take();
    else if (img) img.addEventListener('load', take);
    return () => {
      if (img) img.removeEventListener('load', take);
      eng.dispose();
      rippleRef.current = null;
      setRippleLive(false);
    };
  }, [wantRipple, bgSrc]);

  useEffect(() => {
    const eng = rippleRef.current;
    if (eng) eng.set({ freq: bg.rippleFreq, amp: bg.rippleAmp, speed: bg.rippleSpeed });
  }, [bg.rippleFreq, bg.rippleAmp, bg.rippleSpeed, rippleLive]);

  /* Where the photo sits, so a pointer on the stage can be read as a point on
     the photo however it has been moved, scaled or turned. */
  layoutRippleRef.current = () => {
    const eng = rippleRef.current;
    const world = worldRef.current;
    const img = bgElRef.current;
    if (!eng || !world || !img || !img.naturalWidth) return;
    const b = bgRef.current;
    const cw = world.clientWidth;
    const ew = (cw * b.size) / 100;
    eng.layout({
      cw, ch: world.clientHeight, ew,
      eh: (ew * img.naturalHeight) / img.naturalWidth,
      rot: b.rot, x: b.x, y: b.y,
    });
  };
  useEffect(() => {
    if (layoutRippleRef.current) layoutRippleRef.current();
  }, [bg.size, bg.rot, bg.x, bg.y, rippleLive]);

  // settings reach the engine without rebuilding it
  useEffect(() => {
    const eng = flowRef.current;
    if (!eng) return;
    eng.set({ count: bg.flowCount, speed: bg.flowSpeed, pull: bg.flowPull,
      calm: bg.calm, mid: bg.mid, hot: bg.hot });
  }, [bg.flowCount, bg.flowSpeed, bg.flowPull, bg.calm, bg.mid, bg.hot]);

  // is this picture still spoken for by a size or a stacked layer? deleting
  // the file, or even revoking its URL, would break whatever still points at it
  const bgIdInUse = useCallback(
    (id) => !!id && (bpsRef.current.some((b) => b.bg && b.bg.id === id)
      || layersRef.current.some((l) => l.id === id)),
    [],
  );

  const persistBg = useCallback(async (next) => {
    const db = capsRef.current.db;
    if (!db) return;
    try {
      await db.doc('deck/background').set(bgOutOf(next));
    } catch (e) { /* read-only viewer */ }
  }, []);

  const applyBg = useCallback((patch) => {
    const next = { ...bgRef.current, ...patch };
    setBg(next);
    persistBg(next);
    // the keys actually touched, so editing every size changes only those
    writeStop({ bg: bgSnap(next) }, Object.keys(patch));
    // writeStop and bgSnap are declared below; the closure resolves them when
    // this runs, so they must not go in the dependency list
  }, [persistBg]);

  const setBackgroundFile = useCallback(async (file) => {
    if (!file) return;
    const { assets } = capsRef.current;
    const prev = bgRef.current;
    let next;
    if (assets) {
      setBusy('Adding background\u2026');
      try {
        const res = await assets.upload(file);
        next = { ...prev, kind: 'image', id: res.id, url: res.url };
      } catch (err) {
        setBusy(err && err.code === 'too_large' ? 'Background is over the 20MB limit' : 'Could not add that background');
        return;
      }
    } else {
      next = { ...prev, kind: 'image', id: null, url: URL.createObjectURL(file) };
    }
    // A size may still be pointing at the old picture. Dropping it would
    // leave that size with a dead backdrop -- and revoking its URL does the
    // same damage as deleting the file, so the in-use check has to guard
    // both, not just the delete.
    if (!bgIdInUse(prev.id)) {
      if (prev.id && assets) assets.delete(prev.id).catch(() => {});
      else if (prev.url && prev.url.startsWith('blob:')) URL.revokeObjectURL(prev.url);
    }
    setBusy('');
    setBg(next);
    persistBg(next);
    writeStop({ bg: bgSnap(next) });     // the new picture belongs to this size
  }, [persistBg]);

  const clearBackgroundImage = useCallback(() => {
    const prev = bgRef.current;
    if (!bgIdInUse(prev.id)) {
      if (prev.id && capsRef.current.assets) {
        capsRef.current.assets.delete(prev.id).catch(() => {});
      } else if (prev.url && prev.url.startsWith('blob:')) {
        URL.revokeObjectURL(prev.url);
      }
    }
    applyBg({ id: null, url: '' });
  }, [applyBg]);

  /* ---------- stacked pictures ---------- */

  const persistLayers = useCallback(async (list) => {
    const db = capsRef.current.db;
    if (!db) return;
    const items = list.map((l) => ({
      id: l.id || null, name: l.name, key: l.key, z: l.z, depth: l.depth,
      x: l.x, y: l.y, size: l.size, rot: l.rot, opacity: l.opacity,
      dim: l.dim, show: !!l.show,
    }));
    try { await db.doc('deck/layers').set({ items }); } catch (e) { /* read-only viewer */ }
  }, []);

  /* Held in the order they paint: lowest level first, and pictures sharing a
     level in the order they were put there. So the list in the panel reads
     back to front exactly as the stage does, and "up" in that list is "further
     away" on the stage rather than a tie-break nobody can see. Sort is stable,
     which is what keeps same-level pictures in the order the arrows gave them. */
  const writeLayers = useCallback((list) => {
    const sorted = list.slice().sort((a, b) => a.z - b.z);
    layersRef.current = sorted;
    setLayers(sorted);
    persistLayers(sorted);
    // and into the size being edited, the way a backdrop change does
    writeStop({ layers: layerSnap(sorted) });
  }, [persistLayers]);

  /* Takes however many pictures you hand it. One that will not upload is
     reported and skipped rather than losing the rest of the batch. */
  const addLayerFiles = useCallback(async (fileList) => {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    const { assets } = capsRef.current;
    const rows = [];
    let refused = 0;
    let tooBig = false;
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      if (assets) {
        setBusy(files.length > 1
          ? `Adding picture ${i + 1} of ${files.length}\u2026` : 'Adding picture\u2026');
        try {
          const res = await assets.upload(file);
          rows.push({ id: res.id, url: res.url, name: file.name || 'picture' });
        } catch (err) {
          refused += 1;
          if (err && err.code === 'too_large') tooBig = true;
        }
      } else {
        rows.push({ id: null, url: URL.createObjectURL(file), name: file.name || 'picture' });
      }
    }
    if (!rows.length) {
      setBusy(tooBig ? 'That picture is over the 20MB limit' : 'Could not add that picture');
      return;
    }
    setBusy(refused
      ? `Added ${rows.length}, skipped ${refused}${tooBig ? ' (over the 20MB limit)' : ''}`
      : '');
    const base = layersRef.current.length;
    const list = layersRef.current.concat(
      rows.map((r, j) => normaliseLayer(r, base + j)),
    );
    writeLayers(list);
    setLaySel(list[base].key);         // open the first of the new ones
  }, [writeLayers]);

  const applyLayer = useCallback((i, patch) => {
    writeLayers(layersRef.current.map((l, j) => {
      if (j !== i) return l;
      const next = { ...l, ...patch };
      if (typeof patch.z === 'number') next.depth = zDepth(patch.z);
      return next;
    }));
  }, [writeLayers]);

  /* Swapping the picture in place rather than removing and re-adding, so the
     level and the framing it was given survive the swap. */
  const setLayerFile = useCallback(async (i, file) => {
    if (!file) return;
    const was = layersRef.current[i];
    if (!was) return;
    const { assets } = capsRef.current;
    let got;
    if (assets) {
      setBusy('Replacing picture\u2026');
      try {
        const res = await assets.upload(file);
        got = { id: res.id, url: res.url };
      } catch (err) {
        setBusy(err && err.code === 'too_large'
          ? 'That picture is over the 20MB limit' : 'Could not add that picture');
        return;
      }
      setBusy('');
    } else {
      got = { id: null, url: URL.createObjectURL(file) };
    }
    // a fresh key, so React swaps the element instead of reusing the old src
    const list = layersRef.current.map((l, j) => (j === i ? {
      ...l, ...got,
      name: file.name || l.name,
      key: `${got.id || 'local'}:${j}:${Date.now().toString(36)}`,
    } : l));
    setLaySel(list[i].key);
    // the picture it replaced goes only if nothing else still points at it
    const spokenFor = !!was.id && (bgRef.current.id === was.id
      || bpsRef.current.some((b) => b.bg && b.bg.id === was.id)
      || list.some((l) => l.id === was.id));
    if (!spokenFor) {
      if (was.id && assets) assets.delete(was.id).catch(() => {});
      else if (was.url && was.url.startsWith('blob:')) URL.revokeObjectURL(was.url);
    }
    writeLayers(list);
  }, [writeLayers]);

  const removeLayer = useCallback((i) => {
    const gone = layersRef.current[i];
    if (!gone) return;
    const list = layersRef.current.filter((l, j) => j !== i);
    // the file goes only when nothing left points at it -- the backdrop, a
    // size, or another copy of the same picture further up the stack
    const spokenFor = !!gone.id && (bgRef.current.id === gone.id
      || bpsRef.current.some((b) => b.bg && b.bg.id === gone.id)
      || list.some((l) => l.id === gone.id));
    if (!spokenFor) {
      if (gone.id && capsRef.current.assets) {
        capsRef.current.assets.delete(gone.id).catch(() => {});
      } else if (gone.url && gone.url.startsWith('blob:')) {
        URL.revokeObjectURL(gone.url);
      }
    }
    writeLayers(list);
    setLaySel(null);
  }, [writeLayers]);

  /* Puts a picture on a level AND at a given place in the back-to-front
     order. The order only decides ties, so this is what a drop needs: the
     level says which band, the index says where among the pictures there. */
  const placeLayerAt = useCallback((i, z, at) => {
    const list = layersRef.current.slice();
    if (!list[i]) return;
    const moved = { ...list[i], z, depth: zDepth(z) };
    list.splice(i, 1);
    list.splice(Math.max(0, Math.min(list.length, at)), 0, moved);
    writeLayers(list);
    setLaySel(moved.key);
  }, [writeLayers]);

  /* Puts a picture on a level and, among any pictures already sitting there,
     either behind the first of them or in front of the last. The list is held
     sorted by level with a stable sort, so where it lands here is exactly
     what breaks the tie on the stage. */
  const placeLayer = useCallback((i, z, atFront) => {
    const list = layersRef.current.slice();
    if (!list[i]) return;
    const moved = { ...list[i], z, depth: zDepth(z) };
    list.splice(i, 1);
    let at = atFront
      ? list.reduce((k, l, j) => (l.z <= z ? j + 1 : k), 0)
      : list.findIndex((l) => l.z >= z);
    if (at < 0) at = list.length;
    list.splice(at, 0, moved);
    writeLayers(list);
    setLaySel(moved.key);
  }, [writeLayers]);

  /* Where a step back or forward would land this picture: past a picture
     sharing its level if there is one, otherwise the next landmark in the
     scene. Returns null when it is already as far that way as it goes --
     which is the only thing that greys the button out. */
  const stepTarget = useCallback((i, dir) => {
    const list = layersRef.current;
    const was = list[i];
    if (!was) return null;
    const j = i + dir;
    // past a neighbour on the same level: no level change needed
    if (j >= 0 && j < list.length && list[j].z === was.z) return { swap: j };
    const stops = [...new Set(
      Z_STOPS.concat(list.filter((l, k) => k !== i).map((l) => l.z), [Z_MIN, Z_MAX]),
    )].sort((a, b) => a - b);
    const z = dir < 0
      ? stops.filter((v) => v < was.z).pop()
      : stops.find((v) => v > was.z);
    return z === undefined ? null : { z };
  }, []);

  const stepLayer = useCallback((i, dir) => {
    const to = stepTarget(i, dir);
    if (!to) return;
    if (to.swap === undefined) { placeLayer(i, to.z, dir > 0); return; }
    const list = layersRef.current.slice();
    const moved = { ...list[i] };
    list[i] = list[to.swap];
    list[to.swap] = moved;
    writeLayers(list);
    setLaySel(moved.key);
  }, [stepTarget, placeLayer, writeLayers]);

  /* ---------- messages and menu ---------- */

  const headOut = (h) => ({
    text: h.text, sub: h.sub, card: h.card, hold: h.hold,
    size: h.size, subSize: h.subSize, scale: h.scale,
    x: h.x, y: h.y, align: h.align,
    font: h.font, subFont: h.subFont, weight: h.weight,
    caps: !!h.caps, color: h.color, subColor: h.subColor, show: !!h.show,
  });
  const menuOut = (m) => ({
    on: !!m.on, place: m.place, align: m.align, brand: m.brand,
    color: m.color, font: m.font,
    items: m.items.map((it) => ({ label: it.label, card: it.card })),
  });

  const persistWords = useCallback(async (hs, mn, sc) => {
    const db = capsRef.current.db;
    if (!db) return;
    try {
      await db.doc('deck/words').set({
        headlines: hs.map(headOut),
        menu: menuOut(mn),
        scene: { intro: !!sc.intro, wordScale: sc.wordScale, grain: sc.grain,
          steps: sc.steps },
      });
    } catch (e) { /* read-only viewer */ }
  }, []);

  const writeHeads = useCallback((list) => {
    headsRef.current = list;
    setHeads(list);
    persistWords(list, menuRef.current, sceneRef.current);
  }, [persistWords]);

  const writeMenu = useCallback((next) => {
    menuRef.current = next;
    setMenu(next);
    persistWords(headsRef.current, next, sceneRef.current);
  }, [persistWords]);

  const writeScene = useCallback((patch) => {
    const next = { ...sceneRef.current, ...patch };
    sceneRef.current = next;
    setScene(next);
    persistWords(headsRef.current, menuRef.current, next);
  }, [persistWords]);

  const writeStep = useCallback((k, patch) => {
    const steps = sceneRef.current.steps;
    writeScene({ steps: { ...steps, [k]: { ...steps[k], ...patch } } });
  }, [writeScene]);

  const applyHead = useCallback((i, patch) => {
    writeHeads(headsRef.current.map((h, j) => (j === i ? { ...h, ...patch } : h)));
  }, [writeHeads]);

  const addHeads = useCallback((rows) => {
    const room = HEAD_MAX - headsRef.current.length;
    if (room <= 0) return;
    const add = rows.slice(0, room).map((r, i) => normaliseHead(
      { ...r, key: `h${Date.now().toString(36)}${i}` }, i,
    ));
    const list = headsRef.current.concat(add);
    writeHeads(list);
    setHeadSel(list.length - add.length);
  }, [writeHeads]);

  const removeHead = useCallback((i) => {
    writeHeads(headsRef.current.filter((h, j) => j !== i));
    setHeadSel(null);
  }, [writeHeads]);

  const moveHead = useCallback((i, delta) => {
    const list = headsRef.current.slice();
    const j = i + delta;
    if (j < 0 || j >= list.length) return;
    const t = list[i]; list[i] = list[j]; list[j] = t;
    writeHeads(list);
    setHeadSel(j);
  }, [writeHeads]);

  const applyMenu = useCallback((patch) => {
    writeMenu({ ...menuRef.current, ...patch });
  }, [writeMenu]);

  const setMenuItem = useCallback((i, patch) => {
    applyMenu({ items: menuRef.current.items.map((it, j) => (j === i ? { ...it, ...patch } : it)) });
  }, [applyMenu]);

  /* However many fit. A batch that would overflow is taken as far as it goes
     rather than refused outright. */
  const addLinks = useCallback((rows) => {
    const have = menuRef.current.items;
    const room = MENU_MAX - have.length;
    if (room <= 0) return;
    const add = rows.slice(0, room).map((r, i) => ({
      label: String((r && r.label) || '').slice(0, 24),
      card: Math.max(0, Math.min(Math.round((r && r.card) || 0), Math.max(n - 1, 0))),
      key: `m${Date.now().toString(36)}${i}`,
    }));
    applyMenu({ items: have.concat(add) });
  }, [applyMenu, n]);

  const moveMenuItem = useCallback((i, delta) => {
    const list = menuRef.current.items.slice();
    const j = i + delta;
    if (j < 0 || j >= list.length) return;
    const t = list[i]; list[i] = list[j]; list[j] = t;
    applyMenu({ items: list });
  }, [applyMenu]);

  // drop stale refs when the deck shrinks
  useEffect(() => {
    cardRefs.current.length = n;
    artRefs.current.length = n;
    sheenRefs.current.length = n;
  }, [n]);

  useEffect(() => { headElRefs.current.length = heads.length; }, [heads]);

  const persist = useCallback(async (next) => {
    const db = capsRef.current.db;
    if (!db) return;
    const items = next
      .filter((it) => it.id)
      .map((it) => ({ id: it.id, name: it.name, kind: it.kind, fh: !!it.fh, fv: !!it.fv }));
    try { await db.doc('deck/current').set({ items }); } catch (e) { /* read-only viewer */ }
  }, []);

  const addFiles = useCallback(async (fileList) => {
    const files = Array.from(fileList || []).filter(
      (f) => f.type.startsWith('image/') || f.type.startsWith('video/'),
    );
    if (!files.length) return;
    const { assets } = capsRef.current;
    const added = [];
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      const kind = f.type.startsWith('video/') ? 'video' : 'image';
      setBusy(`Adding ${i + 1} of ${files.length}\u2026`);
      if (assets) {
        try {
          const res = await assets.upload(f);
          added.push({ id: res.id, url: res.url, name: f.name, kind, key: res.id });
        } catch (err) {
          setBusy(err && err.code === 'too_large' ? `${f.name} is over the 20MB limit` : `Could not add ${f.name}`);
          continue;
        }
      } else {
        // no asset store in this view: keep it for the session only
        added.push({ id: null, url: URL.createObjectURL(f), name: f.name, kind, key: `local-${Date.now()}-${i}` });
      }
    }
    if (!added.length) return;
    const next = deckRef.current.concat(added);
    setDeck(next);
    setBusy('');
    persist(next);
  }, [persist]);

  const removeCard = useCallback((index) => {
    const current = deckRef.current;
    const item = current[index];
    const next = current.filter((_, i) => i !== index);
    setDeck(next);
    persist(next);
    if (item.id && capsRef.current.assets) {
      capsRef.current.assets.delete(item.id).catch(() => {});
    } else if (item.url && item.url.startsWith('blob:')) {
      URL.revokeObjectURL(item.url);
    }
  }, [persist]);

  const toggleFlip = useCallback((index, axis) => {
    const next = deckRef.current.map((it, i) => (i === index ? { ...it, [axis]: !it[axis] } : it));
    setDeck(next);
    persist(next);
  }, [persist]);

  const moveCard = useCallback((index, delta) => {
    const next = deckRef.current.slice();
    const to = index + delta;
    if (to < 0 || to >= next.length) return;
    const [row] = next.splice(index, 1);
    next.splice(to, 0, row);
    setDeck(next);
    persist(next);
  }, [persist]);

  const clearDeck = useCallback(() => {
    deckRef.current.forEach((it) => {
      if (it.id && capsRef.current.assets) capsRef.current.assets.delete(it.id).catch(() => {});
      else if (it.url && it.url.startsWith('blob:')) URL.revokeObjectURL(it.url);
    });
    setDeck([]);
    persist([]);
  }, [persist]);

  const measure = useCallback(() => {
    const el = worldRef.current;
    if (!el) return;
    const w = el.clientWidth;
    const h = el.clientHeight;
    const p = P.current;
    // The piece is composed in a 4:5 box. Every dimension -- card size, the
    // drum's reach, the focal length -- scales off that one box, so a narrow
    // window shrinks the whole rig evenly instead of shrinking the cards while
    // leaving the spacing behind, which is what pulls the stack apart.
    // A panel never renders wider than its own base width (depth only ever
    // pushes it away), so the frame can fill the height and only needs pulling
    // in when a card would genuinely overflow the viewport.
    // zoom scales the whole composition -- cards, spacing and focal length
    // together -- so the framing holds and only its size on screen changes
    const frameW = Math.min(h * 0.8, (w * 0.98) / Math.max(p.width, 0.01)) * p.zoom;
    const frameH = frameW * 1.25;
    const cardW = frameW * p.width;
    // p.aspect is the card's shape AS SEEN, so 1.0 is square whatever the
    // stretch is; divide it back out to get the pre-stretch layout height
    const cardH = (cardW * p.aspect) / p.stretch;
    const perspPx = frameH * p.persp;
    el.style.setProperty('--stretch', p.stretch);
    dims.current = {
      cardW, cardH, perspPx,
      ampY: frameH * p.amp,
      ampZ: perspPx * p.depth,
      slot: frameH * p.amp / 3,   // drag sensitivity only
    };

    el.style.perspective = `${perspPx}px`;
    // the vanishing point travels with the rig, so moving it reads as the same
    // composition relocated rather than the same scene viewed off-axis
    el.style.perspectiveOrigin =
      `${(50 + p.offX * 100).toFixed(2)}% ${(50 + p.offY * 100).toFixed(2)}%`;
    el.style.setProperty('--tx', `${(p.offX * 100).toFixed(3)}%`);
    el.style.setProperty('--ty', `${(p.offY * 100).toFixed(3)}%`);
    el.style.setProperty('--roll', `${p.roll}deg`);
    el.style.setProperty('--yaw', `${p.yaw}deg`);

    // Turning the artwork inside its card would show the card through the
    // corners, so it is scaled up by exactly enough to keep covering: the
    // bounding box of a 1 x aspect rectangle turned by this much, measured
    // against the card it still has to fill.
    const a = ((p.shotRoll || 0) * Math.PI) / 180;
    const sa = Math.abs(Math.sin(a));
    const ca = Math.abs(Math.cos(a));
    const ar = Math.max(p.aspect, 0.01);
    el.style.setProperty('--shotroll', `${p.shotRoll || 0}deg`);
    el.style.setProperty('--shotcover', Math.max(ca + ar * sa, (sa + ar * ca) / ar).toFixed(4));

    cardRefs.current.forEach((c) => {
      if (!c) return;
      c.style.width = `${cardW}px`;
      c.style.height = `${cardH}px`;
      const r = Math.max(4, cardW * p.radius);
      c.style.setProperty('--r', `${r.toFixed(2)}px`);
      c.style.setProperty('--rv', `${(r / p.stretch).toFixed(2)}px`);
      // shadow scales with the card so it reads the same at any size
      const off = cardW * 0.12 * p.shadowSize;
      const blur = cardW * 0.25 * p.shadowSize;
      c.style.boxShadow = p.shadow <= 0 ? 'none'
        : `0 ${off.toFixed(1)}px ${blur.toFixed(1)}px rgba(0,0,0,${(0.55 * p.shadow).toFixed(3)}),`
          + ` 0 ${(off * 0.12).toFixed(1)}px ${(blur * 0.2).toFixed(1)}px rgba(0,0,0,${(0.4 * p.shadow).toFixed(3)})`;
    });
  }, [n]);

  useEffect(() => {
    const onSize = () => {
      measure();
      const el = worldRef.current;
      if (flowRef.current && el) flowRef.current.resize(el.clientWidth, el.clientHeight);
      if (layoutRippleRef.current) layoutRippleRef.current();
    };
    measure();
    const ro = new ResizeObserver(onSize);
    if (worldRef.current) ro.observe(worldRef.current);
    return () => ro.disconnect();
  }, [measure]);

  /* Before paint, and keyed on the deck as well: a card that mounts without
     `n` or the sliders changing -- reordered, flipped, replaced wholesale by
     an import -- would otherwise sit with no width or height until the next
     resize, the same way the backdrop used to. */
  useLayoutEffect(() => { measure(); }, [params, measure, deck]);

  const layout = useCallback(() => {
    const p = P.current;
    const { ampY, ampZ } = dims.current;
    if (!ampY) return;
    const prog = progress.current;

    /* How far the one being taken has got, so the rest can stand back. A card
       growing among its neighbours at full strength reads as a card swelling;
       the same card with the ring dimmed behind it reads as a card out of
       it. */
    const liftI = openRun.current.i;
    const ringBack = liftI >= 0 ? liftAmt(liftI) : 0;

    for (let i = 0; i < n; i++) {
      const card = cardRefs.current[i];
      if (!card) continue;
      card.style.opacity = ringBack > 0 && i !== liftI
        ? (1 - 0.72 * ringBack).toFixed(3)
        : '';

      // where this panel sits on the drum; 0 is the near point at mid-frame
      let phi = (-TAU * (i + prog)) / n % TAU;
      if (phi < 0) phi += TAU;
      const s = Math.sin(phi);
      const c = Math.cos(phi);

      // a quarter turn lifts a panel to the top of the frame, bunched toward
      // the near point; half a turn parks it on the far side, dead centre
      const y = -ampY * Math.sign(s) * Math.pow(Math.abs(s), p.bunch);
      const z = -ampZ * (1 - c);

      // the panel turns with the drum, with extra rotation spent at the fold
      // so it reaches face-on well before the quarter turn
      const theta = 90 + phi * DEG + p.crease * Math.sin(2 * phi);

      /* Out of the ring, round to face the front, and into the middle. The
         turn takes the short way to the angle a card has when it sits at the
         near point, which is the angle at which this rig shows a card flat. */
      const beat = liftPhase(i);
      const lift = Math.max(beat.out, beat.turn);
      let ly = y;
      let lz = z + 46 * hoverAmt.current[i];
      let lth = theta;
      let lsc = 1;
      if (lift > 0) {
        /* Face-on is where the panel's own turn is flat to the rig: sin of
           it is zero, which is every half turn. Aiming at 90 instead -- the
           angle at the near point, where a card is edge-on and the sheen is
           at its brightest -- turned the card into a sliver on its way out.
           Nearest half turn, so the longest it ever turns is a quarter, and
           the flip already rights the artwork on a back face. */
        const face = Math.round(theta / 180) * 180;
        /* Out of the ring on the first beat, keeping its own angle, so a gap
           opens where it was. Round and into the middle on the second. */
        ly = y * (1 - beat.turn);
        lz = lz * (1 - beat.out) + ampZ * LIFT_PULL * beat.out;
        lth = theta + (face - theta) * beat.turn;
        lsc = 1 + (LIFT_SCALE - 1) * beat.turn;
      }

      card.style.transform =
        `translate3d(-50%, -50%, 0) translateY(${ly.toFixed(2)}px) ` +
        `translateZ(${lz.toFixed(2)}px) ` +
        `rotateX(${lth.toFixed(2)}deg)` +
        (lift > 0 ? ` scale(${lsc.toFixed(4)})` : '');

      /* Eased here rather than in the tick, because this already runs once a
         frame and the number is wanted at exactly this moment. */
      if (hoverAmt.current.length !== n) hoverAmt.current = new Float32Array(n);
      const want = i === hoverRef.current ? 1 : 0;
      const amt = hoverAmt.current[i] + (want - hoverAmt.current[i]) * 0.18;
      hoverAmt.current[i] = Math.abs(amt - want) < 0.002 ? want : amt;

      const grazing = Math.abs(Math.sin((lth * Math.PI) / 180)) * (1 - lift);
      const dim = (1 - p.dim * (1 - c) * 0.5 * (1 - lift)) * (1 + 0.22 * amt);
      // past the fold we are looking at the panel's back, which mirrors it
      // vertically -- undo that so photographs never read upside down. The
      // switch lands exactly where the panel is edge-on, so it is never seen.
      const flip = Math.cos((lth * Math.PI) / 180) < 0 ? 'scaleY(-1)' : 'none';

      const art = artRefs.current[i];
      if (art) {
        art.style.transform = flip;
        art.style.filter = `brightness(${(dim * (1 - 0.22 * grazing * grazing)).toFixed(3)})`;
      }
      const sheen = sheenRefs.current[i];
      if (sheen) {
        sheen.style.transform = flip;
        sheen.style.opacity = (Math.pow(grazing, 3) * 0.55 * dim).toFixed(3);
      }
    }

    /* A message arrives with its card and leaves with it, so the words are
       part of the turn rather than a caption sitting on top of it. One tied
       to no card simply stays up. */
    const hs = headsRef.current;
    for (let i = 0; i < hs.length; i++) {
      const el = headElRefs.current[i];
      if (!el) continue;
      const h = hs[i];
      let op = 1;
      if (h.card >= 0) {
        const at = frontAt(h.card, n);
        let d = (prog - at) % n;
        if (d >  n / 2) d -= n;
        if (d < -n / 2) d += n;
        const t = Math.min(Math.abs(d) / Math.max(h.hold, 0.05), 1);
        op = 1 - t * t * (3 - 2 * t);
      }
      const ax = h.align === 'left' ? 0 : h.align === 'right' ? -100 : -50;
      el.style.opacity = op.toFixed(3);
      el.style.transform = `translate(${ax}%, -50%) `
        + `translateY(${((1 - op) * 26).toFixed(1)}px)`;
    }
  }, [n]);

  useEffect(() => {
    let raf = 0;
    let last = performance.now();
    let frame = 0;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const tick = (now) => {
      frame += 1;
      if (frame % 15 === 0 && bpCheck.current) bpCheck.current();
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      /* Held still while a card is out of the ring, and all the way until it
         is back in it. Stopped dead and started dead it read as a jolt at
         both ends, so the drift is eased out and in: quicker to stop than to
         start, because a river that takes its time halting looks like it did
         not hear you. */
      /* A card under the pointer holds the river too. Reaching for something
         that is still moving is the pointer chasing it, and a card that stops
         dead under the hand is the page flinching -- so it leans into the
         stop rather than hitting it. Opening halts harder, because by then
         the choice is made. */
      const held = openRef.current ? 2 : (hoverRef.current >= 0 ? 1 : 0);
      const wantRun = held ? 0 : 1;
      riverRun.current += (wantRun - riverRun.current)
        * (1 - Math.exp(-dt * (wantRun ? 2.6 : (held === 2 ? 11 : 4.2))));
      if (riverRun.current < 0.0005) riverRun.current = 0;
      if (riverRun.current > 0.9995) riverRun.current = 1;

      if (!drag.current.active) {
        if (glide.current !== null) {
          // a menu link was clicked: ease the river round to that card by the
          // short way, and leave the drift alone until it arrives
          let d = (glide.current - progress.current) % n;
          if (d >  n / 2) d -= n;
          if (d < -n / 2) d += n;
          drag.current.vel = 0;
          if (Math.abs(d) < 0.004) { progress.current = glide.current; glide.current = null; }
          else progress.current += d * Math.min(1, dt * 4.5);
        } else {
          if (!reduce) progress.current += dt * P.current.speed * riverRun.current;
          /* Not scaled by the hold. The drift is the page's own motion and
             stops when you reach for a card; this is your hand's, and damping
             it threw away most of every wheel notch the moment the pointer
             was over anything. */
          progress.current += drag.current.vel * dt;
          drag.current.vel *= Math.pow(0.0015, dt);
          if (Math.abs(drag.current.vel) < 0.001) drag.current.vel = 0;
        }
        progress.current %= n;                          // keep precision
      }
      // the field advances on the same clock as the river, and not at all
      // for someone who has asked for less movement
      if (!reduce && flowRef.current) flowRef.current.frame(dt);
      if (!reduce && rippleRef.current) rippleRef.current.frame(dt);
      layout();
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [layout]);

  /* The river runs down the screen until the rig is rolled, and then it runs
     wherever the roll points it. Scrubbing follows: a drag counts only the
     part of itself that runs along the river, so pushing the cards along
     their own line always does what it does with no roll at all. At a
     quarter turn that means dragging sideways. */
  const riverAxis = () => {
    const r = ((P.current.roll || 0) * Math.PI) / 180;
    return { x: -Math.sin(r), y: Math.cos(r) };   // screen direction of "down the river"
  };

  /* A menu link brings one card to the front. It sets a destination rather
     than jumping, so the river turns there and the author sees which way it
     went -- and anything the viewer does next takes the wheel back. */
  const goTo = (card) => { glide.current = frontAt(card, n); };

  /* ---------- opening a card ----------------------------------------

     A card opens into one layer that holds everything: the picture, the
     words and the way out. The layer grows out of the card itself, so what
     you clicked becomes what you are reading rather than being replaced by
     it, and the picture flies to its place inside it on the same curve.

     It stays mounted while it closes. The first version simply stopped
     existing the moment you asked it to, which is why closing never felt
     like anything: there has to be something there to animate. */

  const [open, setOpen] = useState(null);     // the work on show
  const [zoom, setZoom] = useState(null);     // the picture in flight
  const [phase, setPhase] = useState(null);   // 'from' | 'to' | 'home'
  const openRef = useRef(null);
  openRef.current = open;
  const zoomRef = useRef(null);
  zoomRef.current = zoom;
  const homeTimer = useRef(null);

  /* Taking a card off the ring. It is pulled out towards the viewer, turned
     until it faces them and brought to the middle -- and only when it is flat
     to the camera does the flat copy take over, because that is the one
     moment the two are the same shape. Everything before this went straight
     to the copy, which is why it read as a picture appearing rather than a
     card being picked up. */
  const LIFT_MS = 440;
  const LIFT_PULL = 0.5;   // how far out of the ring, as a share of its depth
  const DROP_MS = 440;   // the lift, run backwards, so it takes just as long
  const LIFT_SCALE = 1.0;   // the pull toward the viewer does the enlarging
  const openRun = useRef({ i: -1, from: 0, to: 0, t0: 0, dur: LIFT_MS });
  const liftTimer = useRef(null);

  /* Two beats, not one. Taking a card off a ring is a card coming out and
     then being turned over, and doing both at once is neither: it reads as
     the card swelling where it stands. `out` is the first half and carries it
     clear of its neighbours; `turn` is the second and brings it round and to
     the middle. */
  const liftPhase = (i) => {
    const r = openRun.current;
    if (r.i !== i) return { out: 0, turn: 0 };
    const p = Math.min(1, (performance.now() - r.t0) / r.dur);
    const q = r.to >= r.from ? p : 1 - p;          // backwards on the way home
    const ease = (x) => x * x * (3 - 2 * x);
    const span = (x, a, b) => ease(Math.max(0, Math.min(1, (x - a) / (b - a))));
    /* They overlap by much more than they used to. Two beats that barely
       touch are two moves: on the way back the card finished arriving, then
       turned where it stood, then slid in -- a stop you could feel at
       thumbnail size. Overlapped, it is one move that still reads as out,
       then round. */
    return { out: span(q, 0, 0.66), turn: span(q, 0.14, 1) };
  };
  const liftAmt = (i) => {
    const l = liftPhase(i);
    return Math.max(l.out, l.turn);
  };

  const hoverRef = useRef(-1);
  const hoverAmt = useRef(new Float32Array(0));
  const [hoverWork, setHoverWork] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);

  /* Every card is pointer-events: none so the stage can own the drag, which
     means which card you are pointing at has to be worked out rather than
     asked for. The frontmost card is the biggest one on screen, and an
     edge-on card is a sliver nobody was aiming at. */
  const cardUnder = (x, y) => {
    let best = -1;
    let area = 0;
    for (let i = 0; i < cardRefs.current.length; i++) {
      const c = cardRefs.current[i];
      if (!c) continue;
      const r = c.getBoundingClientRect();
      if (r.width < 24 || r.height < 24) continue;
      if (x < r.left || x > r.right || y < r.top || y > r.bottom) continue;
      const ar = r.width * r.height;
      if (ar > area) { area = ar; best = i; }
    }
    return best;
  };

  /* The layer, and the picture's place inside it. Measured from the window
     rather than left to CSS, because the picture is flown to an exact
     rectangle and the two have to agree about where that is. */
  const sheetRect = () => {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const w = Math.min(1180, vw - Math.min(110, vw * 0.09));
    const h = Math.min(840, vh - Math.min(110, vh * 0.09));
    return { x: (vw - w) / 2, y: (vh - h) / 2, w, h };
  };

  const heroIn = (sheet, from) => {
    const pad = Math.max(18, Math.min(44, sheet.w * 0.04));
    const ar = Math.max(0.2, from.w / Math.max(from.h, 1));
    if (sheet.w >= 820) {
      const colW = (sheet.w - pad * 3) * 0.46;
      let h = Math.min(sheet.h - pad * 2, colW / ar);
      let w = h * ar;
      if (w > colW) { w = colW; h = w / ar; }
      return { x: sheet.x + pad, y: sheet.y + (sheet.h - h) / 2, w, h, pad, colW };
    }
    let w = sheet.w - pad * 2;
    let h = w / ar;
    const cap = sheet.h * 0.4;
    if (h > cap) { h = cap; w = h * ar; }
    return { x: sheet.x + (sheet.w - w) / 2, y: sheet.y + pad, w, h, pad, colW: w };
  };

  const openCard = (i, work) => {
    const c = cardRefs.current[i];
    if (!c || !work) return;
    clearTimeout(homeTimer.current);
    clearTimeout(liftTimer.current);

    /* The river stops where it is. The card leaves the ring on its own --
       turning the whole river to the front instead would be the ring moving,
       not a card being taken out of it. */
    drag.current.vel = 0;
    glide.current = null;

    openRun.current = { i, from: liftAmt(i), to: 1, t0: performance.now(), dur: LIFT_MS };
    setOpen(work);
    setPhase('lift');
    if (location.hash.replace(/^#/, '') !== work.slug) {
      history.pushState(null, '', '#' + work.slug);
    }

    /* Once it is flat to the camera the copy takes over, measured from where
       the card has actually got to rather than from where it began. */
    liftTimer.current = setTimeout(() => {
      const el = cardRefs.current[i];
      const item = deck[i];
      if (!el) return;
      const r = el.getBoundingClientRect();
      const from = { x: r.left, y: r.top, w: r.width, h: r.height };
      const sheet = sheetRect();
      setZoom({
        src: item && item.kind === 'image' ? srcFor(item) : '',
        video: item && item.kind === 'video' ? srcFor(item) : '',
        from,
        sheet,
        to: heroIn(sheet, from),
        i,
      });
      setPhase('from');
    }, LIFT_MS);
  };

  /* Back the way it came: the copy returns to the card, the card takes over
     where it is -- out in front and facing you -- and then turns and settles
     back into its place in the ring. */
  const closeCard = (push) => {
    if (!openRef.current) return;
    clearTimeout(liftTimer.current);
    const z = zoomRef.current;
    setPhase('home');
    if (z) {
      const c = cardRefs.current[z.i];
      const r = c && c.getBoundingClientRect();
      if (r && r.width > 8) {
        setZoom({ ...z, from: { x: r.left, y: r.top, w: r.width, h: r.height } });
      }
    }
    clearTimeout(homeTimer.current);
    homeTimer.current = setTimeout(() => {
      setPhase('drop');
      /* The picture stays a moment longer and crosses with the card rather
         than being taken away in front of it. Removed on the instant, it left
         a sixth of a second with nothing solid in its place while the card
         faded up -- which is the last of the stops. */
      setTimeout(() => setZoom(null), 260);
      const i = z ? z.i : openRun.current.i;
      openRun.current = { i, from: 1, to: 0, t0: performance.now(), dur: DROP_MS };
      homeTimer.current = setTimeout(() => {
        openRun.current = { i: -1, from: 0, to: 0, t0: 0, dur: LIFT_MS };
        setPhase(null);
        setOpen(null);
      }, DROP_MS);
      /* The travel is declared at 480ms but its curve is front-loaded and
         it is there in about 280. The card starts back then, not when the
         transition formally ends, or the picture sits at thumbnail size with
         nothing happening -- which is the stop you could feel. */
    }, 290);
    if (push && location.hash) {
      history.pushState(null, '', location.pathname + location.search);
    }
  };

  /* Mounted sitting exactly on the card, and only then told where it is
     going: a transition needs two frames to be a transition. */
  useEffect(() => {
    if (phase !== 'from') return undefined;
    const go = () => setPhase((ph) => (ph === 'from' ? 'to' : ph));
    /* Two frames, because a transition needs a frame to start from -- but a
       timer behind it, because requestAnimationFrame does not run in a tab
       nobody is looking at. Without it a page opened in a background tab is
       still shut when you get to it. */
    const r = requestAnimationFrame(() => requestAnimationFrame(go));
    const t = setTimeout(go, 60);
    return () => { cancelAnimationFrame(r); clearTimeout(t); };
  }, [phase]);

  /* The address is the page. Typing one in, sharing one, or pressing Back all
     arrive here, so there is one way in rather than two that can disagree. */
  useEffect(() => {
    const read = () => {
      const slug = (location.hash || '').replace(/^#/, '');
      const want = workBySlug(slug);
      const have = openRef.current;
      if (want && (!have || have.slug !== want.slug)) {
        const i = deck.findIndex((it) => {
          const w = workFor(it && it.id);
          return w && w.slug === want.slug;
        });
        if (i >= 0) openCard(i, want);
      } else if (!want && have) {
        closeCard(false);
      }
    };
    read();
    window.addEventListener('hashchange', read);
    window.addEventListener('popstate', read);
    return () => {
      window.removeEventListener('hashchange', read);
      window.removeEventListener('popstate', read);
    };
  }, [deck]);

  /* Shut by Escape, and by a card being opened -- a menu left hanging over
     the layer would be the page talking over itself. */
  useEffect(() => {
    if (!menuOpen) return undefined;
    if (open) { setMenuOpen(false); return undefined; }
    const esc = (e) => { if (e.key === 'Escape') setMenuOpen(false); };
    window.addEventListener('keydown', esc);
    return () => window.removeEventListener('keydown', esc);
  }, [menuOpen, open]);

  useEffect(() => {
    if (!open) return undefined;
    const esc = (e) => { if (e.key === 'Escape') closeCard(true); };
    window.addEventListener('keydown', esc);
    return () => window.removeEventListener('keydown', esc);
  }, [open, zoom]);

  /* Another work without leaving the layer: the picture flies in from its own
     card, which is still turning behind all this even though it cannot be
     seen, so the two views never disagree about where anything is. */
  const swapTo = (work) => {
    const i = deck.findIndex((it) => {
      const w = workFor(it && it.id);
      return w && w.slug === work.slug;
    });
    if (i >= 0) openCard(i, work);
  };

  /* What belongs to the stage, and what only happens to be drawn over it.
     The opened layer goes out through a portal, but a portal still bubbles
     its events up the React tree -- so a press on the close button arrived
     here too, and this took the pointer with setPointerCapture. The press
